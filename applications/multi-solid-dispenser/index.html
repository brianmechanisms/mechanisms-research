t="Explore 25+ advanced mechanical systems including quick return mechanisms, rotary motion, and walking systems."/><meta property="og:url" content="https://cseco.co.ke/mechanisms-research/"/><meta property="og:site_name" content="Brian Mechanisms"/><meta property="og:locale" content="en_US"/><meta property="og:image" content="https://cseco.co.ke/mechanisms-research/mechanisms-research/og-image.png"/><meta property="og:image:width" content="1200"/><meta property="og:image:height" content="630"/><meta property="og:image:alt" content="Brian Mechanisms - Interactive Mechanism Showcase"/><meta property="og:type" content="website"/><meta name="twitter:card" content="summary_large_image"/><meta name="twitter:creator" content="@brianmechanisms"/><meta name="twitter:title" content="Brian Mechanisms - Interactive Mechanism Showcase"/><meta name="twitter:description" content="Explore 25+ advanced mechanical systems including quick return mechanisms, rotary motion, and walking systems."/><meta name="twitter:image" content="https://cseco.co.ke/mechanisms-research/mechanisms-research/og-image.png"/><link rel="shortcut icon" href="/mechanisms-research/favicon.svg"/><link rel="icon" href="/mechanisms-research/favicon.svg" type="image/svg+xml"/><link rel="icon" href="/mechanisms-research/favicon.svg" sizes="any"/><link rel="apple-touch-icon" href="/mechanisms-research/favicon.svg"/><meta name="next-size-adjust"/><script src="/mechanisms-research/_next/static/chunks/polyfills-42372ed130431b0a.js" noModule=""></script></head><body class="__className_866e57"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><div class="min-h-screen flex items-center justify-center"><div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-mechanism-accent"></div></div><!--/$--><script src="/mechanisms-research/_next/static/chunks/webpack-028dda637c991d41.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0]);self.__next_f.push([2,null])</script><script>self.__next_f.push([1,"1:HL[\"/mechanisms-research/_next/static/media/e4af272ccee01ff0-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n2:HL[\"/mechanisms-research/_next/static/css/36cdcee1aa5b57b7.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"3:I[55854,[],\"\"]\n5:I[57894,[\"4144\",\"static/chunks/4144-f587ff692dbc30d7.js\",\"353\",\"static/chunks/353-de36aaa3747f313e.js\",\"4469\",\"static/chunks/app/applications/%5Bslug%5D/page-37fe3cafbd7410c4.js\"],\"default\"]\n9:I[68046,[],\"\"]\nb:I[87597,[],\"\"]\nc:I[79821,[\"3185\",\"static/chunks/app/layout-216e2108b630e66b.js\"],\"AuthProvider\"]\nd:I[10579,[\"3185\",\"static/chunks/app/layout-216e2108b630e66b.js\"],\"default\"]\nf:I[80914,[],\"\"]\n6:T577,Each stage keeps its OWN outlet, but all outlets should sit at the SAME height (level with each other), regardless of which stage they belong to.\nRESEARCH FINDING: an open vertical screw stops conveying at the flight TIP — it does NOT push material up the empty bore above the last flight (a vertical screw won't even self-empty if feed stops). Pushing product up above the flight only happens under confined plug/extrusion with back-pressure, which compacts and cakes food powders — bad for free metering. So we CANNOT rely on lifting the bottom solid up an open tube past the upper stages to reach the level.\nCONSEQUENCE: for a stage's outlet to reach the common height, its flighting must run all the way up to that height — so lower stages need LONGER screws. But if every screw has to reach the same top level they all span the full height and cannot share one central tube. So same-height outlets imply one of: (a) parallel risers — each stage its own full-height flighted tube, all topping out level, each with its own outlet; (b) concentric/nested tubes, one radius per stage, all reaching the same height (ties into the concentric screw-conveyor PoC) — needs concentric shafts, not one rod. These are OPTIONS to revisit at design time — not a blocker, and same-height outlets are not mandatory. If pursued, reduced-pitch flighting in tubular housing helps on the steep sections.7:T4b1,First-pass prior-art search (June 2026, web + Google Patents — NOT a professional opinion). FINDING: the two mechanisms we thought were the crux are already known. (1) Driving multiple augers from a SINGLE motor v"])</script><script>self.__next_f.push([1,"ia a gear train and individually selectable clutches is taught by US6540832B2 (and dual-auger farm patents). (2) A HOLLOW screw sleeve on a non-circular central drive ROD (key/spline coupling, sliding/telescoping) is taught by US7381131B1. Multi-auger powder dispensing and single-actuator multi-container spice metering also exist. IMPLICATION: the broad concept is largely anticipated; patentable novelty is narrow and would have to rest on a specific, non-obvious COMBINATION (e.g. vertically stacked full dispensing stages — each its own container + casing — sharing one rod through the hollow cores, with per-stage friction-gripper engagement, for legal-for-trade retail metering of solids). Even that risks an obviousness rejection combining the above. NEXT: a professional patentability / freedom-to-operate opinion; a utility model (KIPI) is likely more realistic than a full patent. Treat US6540832B2 and US7381131B1 as freedom-to-operate items to design around or license.8:T4bd,Note the orientation: this is NOT gravity-drop. Single-stage cross-section, bottom up:\n· a cylindrical container at the very bottom holds the solid;\n· above it a vertical screw (auger) runs inside a tube whose bore is slightly larger than the screw OD, so the flight sweeps product up the annular gap;\n· the screw is hollow down its centre (a central bore through the shaft);\n· product is conveyed UP and discharged at an outlet near the top.\n\nSTACKING is what makes it multi-solid from one actuator: a single shared ROD runs from the actuator at the bottom, up through the hollow core of EVERY screw, to the very top of the topmost set. Each stage is its own set — container + screw + casing — stacked on the one below, each holding a different solid. Each screw couples to the shared rod via a key or friction gripper (see hard parts). Goal: each stage keeps its own outlet, but all outlets sit at the SAME height (level with each other) — which means lower stages' flighting would have to reach that height (see hard parts for why this is har"])</script><script>self.__next_f.push([1,"d).\n\nRelates to the concentric screw-conveyor PoC. First task: cross-section of one stage, then the stacked arrangement with the shared rod (done in scratch).a:[\"slug\",\"multi-solid-dispenser\",\"d\"]\n10:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L3\",null,{\"buildId\":\"710gl6eUKXjcrYn2SPyPo\",\"assetPrefix\":\"/mechanisms-research\",\"urlParts\":[\"\",\"applications\",\"multi-solid-dispenser\",\"\"],\"initialTree\":[\"\",{\"children\":[\"applications\",{\"children\":[[\"slug\",\"multi-solid-dispenser\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"multi-solid-dispenser\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"applications\",{\"children\":[[\"slug\",\"multi-solid-dispenser\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L4\",[\"$\",\"$L5\",null,{\"project\":{\"slug\":\"multi-solid-dispenser\",\"name\":\"Single-Actuator Multi-Solid Dispenser\",\"summary\":\"One actuator, many solids — a metered dispenser family for legal-for-trade commerce.\",\"description\":\"A dispenser system that meters out multiple solid commodities (grains, sugar, flour, pulses, fertiliser, etc.) accurately enough for legal-for-trade sale, driven by a single actuator to keep cost and the tamper surface low. The aim is a Metriq-style, tamper-evident, OIML-R76-aligned dispenser: measurement you can defend. We explore three feed geometries for the solids path, then extend the same control idea to liquids. Each phase starts as a paper/CAD study before any hardware.\",\"status\":\"planned\",\"domain\":\"Dispensing / legal metrology\",\"client\":\"Metriq (cseco.co.ke)\",\"startedAt\":\"2026-06\",\"tags\":[\"dispenser\",\"metering\",\"single-actuator\",\"solids\",\"liquids\",\"legal-for-trade\"],\"links\":[{\"label\":\"Metriq\",\"url\":\"https://metriq.cseco.co.ke\"}],\"objectives\":[\"Meter multiple distinct solids accurately from a single drive.\",\"Tamper-evident by design — borrow the metering-grade sealing approach.\",\"Keep the actuator count (and therefore cost) to one wherever possible.\",\"Generalise the control approach from solids to liquids.\"],\"hardParts\":[{\"title\":\"The coupling (key / friction gripper)\",\"note\":\"Each stacked screw couples to the single shared rod via a key or a friction gripper. Designing this is the crux: it must transmit torque reliably, ideally be SELECTABLE (engage one stage at a time so the single actuator can dispense solid A or B on demand), fit inside/around the hollow screw core, and survive the dusty solids environment. Open: selectable vs. always-engaged, and how selection is actuated without adding a second actuator.\"},{\"title\":\"Same outlet height for all stages\",\"note\":\"$6\"},{\"title\":\"Metering accuracy for hygroscopic powders\",\"note\":\"Volumetric screw metering (revolutions × pitch → mass) holds only at constant bulk density and full fill. Salt/sugar are hygroscopic and cake/bridge/rathole, so the same revolutions give variable weight (~±1% by volume but ±2–3% by weight). For legal-for-trade accuracy, plan loss-in-weight (gravimetric) trimming and mass-flow hopper outlets (Jenike). Sources: KWS vertical-conveyor guide, Jenike \u0026 Johanson, Hapman volumetric-vs-gravimetric.\"}],\"priorArt\":{\"summary\":\"$7\",\"refs\":[{\"ref\":\"US6540832B2\",\"title\":\"Liquid dispensing system with multiple cartridges\",\"url\":\"https://patents.google.com/patent/US6540832B2/en\",\"note\":\"Single motor + gear train + individual electromagnetic clutches selectively engage multiple augering screws. Directly anticipates \\\"one actuator, per-stage selectable engagement\\\" — though for liquids/adhesives, not stacked solids.\"},{\"ref\":\"US7381131B1\",\"title\":\"Extendable auger conveyor\",\"url\":\"https://patents.google.com/patent/US7381131\",\"note\":\"Screw flight is a hollow sleeve on a non-circular central drive shaft (key/spline) that rotates the sleeve and lets it slide. Directly anticipates \\\"hollow screw core on a shared rod, coupled by a key\\\".\"},{\"ref\":\"US8622257B2\",\"title\":\"Auger-driven powder dispenser\",\"url\":\"https://patents.google.com/patent/US8622257B2/en\",\"note\":\"Dispenser with multiple bin+auger assemblies for powders. Prior art for multi-solid auger dispensing in one chassis.\"},{\"ref\":\"US11606907B2\",\"title\":\"Dual auger drive system (Unverferth)\",\"url\":\"https://patents.google.com/patent/US11606907\",\"note\":\"Transmission shaft with a sliding clutch tube that selectively engages augers. Prior art for selectable clutch engagement on a shared drive shaft (farm equipment).\"},{\"ref\":\"GB2203415A\",\"title\":\"Automatic spice and herb dispenser\",\"url\":\"https://patents.google.com/patent/GB2203415A/en\",\"note\":\"Plus US10,925,308 / US12,059,081: single-actuator metered dispensing from multiple containers (carousel / metering plate). Prior art for single-actuator multi-product food metering.\"}]},\"segments\":[{\"name\":\"Home kitchens — manual\",\"note\":\"Hand-cranked / on-demand dispensing of seasonings \u0026 powders (confirm terms: salt, sugar, powdered spices) and possibly beverages. No electronics — cheapest entry tier.\"},{\"name\":\"Home kitchens — automatic\",\"note\":\"Motorised, metered dispensing of the same seasonings/powders \u0026 beverages. Single actuator + the shared-rod stack; the \\\"smart\\\" tier.\"},{\"name\":\"Restaurants / commercial kitchens\",\"note\":\"Same product set as kitchens at higher throughput and duty cycle; hygiene/cleaning and refill ergonomics matter more. (Treated as a kitchen variant.)\"},{\"name\":\"Grains\",\"note\":\"Larger free-flowing solids; easier to convey than fine powders.\"},{\"name\":\"Cereals shops\",\"note\":\"Two layouts: (a) the stacked shared-rod unit as-is; (b) a per-product variant where each product has its own hopper. Customer-facing, legal-for-trade weighing relevant.\"},{\"name\":\"Farm chemicals\",\"note\":\"Needs proper sealing — likely the hardest segment for containment, materials compatibility, and operator safety. Tackle after the food segments are proven.\"}],\"roadmap\":[{\"id\":\"r1\",\"name\":\"1. Discovery \u0026 ideation\",\"status\":\"complete\",\"detail\":\"Idea captured: single-actuator multi-solid dispenser; opportunity and target segments defined. First-pass prior-art search done (see Prior art) — it found the two core mechanisms are already patented, so it directly shapes the IP stage. A professional freedom-to-operate opinion is still the proper next IP step.\"},{\"id\":\"r2\",\"name\":\"2. Concept design\",\"status\":\"in-progress\",\"detail\":\"Conceptual layout and cross-sections (vertical screw-lift, shared-rod stacking) plus technical-feasibility research (vertical conveying limits, metering accuracy). This is where our scratch cross-sections sit — not a standalone \\\"stage\\\".\"},{\"id\":\"r3\",\"name\":\"3. Scoping \u0026 business case\",\"status\":\"planned\",\"detail\":\"Requirements per segment, market sizing, cost/pricing direction, and go/no-go before committing engineering effort. Confirm kitchen product terms (salt, sugar, spices, beverages).\"},{\"id\":\"r4\",\"name\":\"4. Preliminary (embodiment) design\",\"status\":\"planned\",\"detail\":\"Parametric CAD of a single stage and the stacked-rod assembly; resolve the coupling and same-height-outlet hard parts; bring into /designs as components + assemblies.\"},{\"id\":\"r5\",\"name\":\"5. Detailed design \u0026 simulation\",\"status\":\"planned\",\"detail\":\"Full CAD, kinematic motion in the showcase viewer, bulk-solids flow sanity checks, and the revolution-to-mass metering model per commodity. Output: a design defined well enough to describe and protect.\"},{\"id\":\"r6\",\"name\":\"6. IP protection (file before disclosure)\",\"status\":\"planned\",\"detail\":\"First-pass prior-art search already done (see Prior art) — it found the core mechanisms are anticipated (US6540832B2, US7381131B1), so plan a PROFESSIONAL patentability / freedom-to-operate opinion and likely a utility model (KIPI) rather than a broad patent. Whatever is filed must go in BEFORE any public disclosure or sale — disclosure destroys novelty (some jurisdictions allow only a 6–12 month grace period), and publishing on metriq.cseco.co.ke, showing customers, and pilot sales all count as disclosure. So filing must precede the Launch stage.\"},{\"id\":\"r7\",\"name\":\"7. Prototyping\",\"status\":\"planned\",\"detail\":\"Proof-of-concept (prove the principle — e.g. the coupling and screw-lift work) then a working prototype (manual tier first, then automatic). Keep prototypes under confidentiality until IP is filed.\"},{\"id\":\"r8\",\"name\":\"8. Verification \u0026 validation\",\"status\":\"planned\",\"detail\":\"Verification (built to spec: metering accuracy \u0026 repeatability, durability) and validation (meets user \u0026 legal-for-trade needs: OIML-R76 alignment; sealing for farm chemicals). Design freeze on the final passing design before committing production tooling.\"},{\"id\":\"r9\",\"name\":\"9. Pilot production\",\"status\":\"planned\",\"detail\":\"Small-batch manufacturing trial run to prove the design can be MADE repeatably (tooling, suppliers, assembly, cost) — distinct from prototyping, which proves it works.\"},{\"id\":\"r10\",\"name\":\"10. Launch \u0026 commercialization\",\"status\":\"planned\",\"detail\":\"Full sales process, segment by segment, under the Metriq brand.\",\"steps\":[\"Draft metriq.cseco.co.ke content — dispenser product-line copy, specs, render placements (team applies to live site)\",\"Pricing \u0026 tiers (manual vs automatic; per-segment configurations)\",\"Lead generation \u0026 outreach (kitchens, restaurants, cereals shops, agro-dealers)\",\"Quotation → order → fulfilment workflow\",\"Installation, calibration \u0026 after-sales support\"]},{\"id\":\"r11\",\"name\":\"11. Post-launch support \u0026 iteration\",\"status\":\"planned\",\"detail\":\"Field feedback, servicing/recalibration, and design changes via formal change control (engineering change orders) — plus rolling out the remaining segments and the liquid variant.\"}],\"phases\":[{\"id\":\"phase-1\",\"name\":\"Solid dispenser — vertical stacking (screw lift)\",\"status\":\"planned\",\"objective\":\"Lift solids UP a vertical screw from a bottom container to an outlet above — the outlet sits above the stack, not below it.\",\"notes\":\"$8\",\"deliverables\":[\"Single-stage cross-section: container, screw + tube (bore \u003e screw OD), hollow core, outlet\",\"Stacked cross-section: shared rod through every hollow core, per-stage couplings, same-height outlets\",\"Revolution-to-mass calibration approach\",\"Parametric CAD study of the stacked vertical screw lift\"],\"images\":[{\"src\":\"/projects/multi-solid-dispenser/stacked-rod-xsection.svg\",\"caption\":\"Stacked screw dispenser — single shared rod up through every hollow screw core; each screw couples to the rod via key / friction gripper; single actuator. (Concept sketch — outlet heights to be revisited.)\",\"alt\":\"Axial cross-section of the stacked vertical screw dispenser with a shared central rod\"},{\"src\":\"/projects/multi-solid-dispenser/single-stage-xsection.svg\",\"caption\":\"Single-stage cross-section — bottom container, vertical screw in a tube (bore slightly larger than screw OD), hollow screw core, outlet near the top.\",\"alt\":\"Axial cross-section of one vertical screw-lift dispenser stage\"}],\"tags\":[\"vertical-stack\",\"screw-lift\",\"auger\",\"hollow-core\",\"shared-rod\",\"same-height-outlets\"]},{\"id\":\"phase-radial\",\"name\":\"Solid dispenser — radial / carousel layout (sector-gear selection)\",\"status\":\"planned\",\"objective\":\"Arrange several screws in a ring around a central sector gear that engages one screw at a time, all driven by a single actuator.\",\"notes\":\"TOP VIEW: a central gear with teeth over only a SMALL ARC sits at the middle, driven by the single actuator. Several screws (drawn here as 4) are arranged around it, each on its own gear meshed to the central gear's pitch circle. As the central gear rotates, its toothed arc sweeps round and meshes with ONE screw gear at a time — so only that stage dispenses. Each screw gear is a bigger diameter than the screw itself; each screw runs in its own casing (tube) inside its own container.\\n\\nWHY IT MATTERS: this is a clean mechanical answer to the coupling hard part — sequential single-screw engagement from one drive WITHOUT keys/friction grippers or clutches. Different layout from vertical/horizontal stacking: the screws sit side by side in a circle, not stacked, so there is no same-height-outlet problem.\\n\\nIP NOTE: sector / \\\"mutilated\\\" gears for intermittent single-output drive are classic, well-known mechanisms — unlikely to be novel on their own (see Prior art). Value here is simplicity, not patentability.\",\"images\":[{\"src\":\"/projects/multi-solid-dispenser/radial-sectorgear-topview.svg\",\"caption\":\"Top view — central sector gear (teeth over a small arc) engages one screw gear at a time; 4 screws around it, each gear bigger than its screw, with its own casing and container. Single actuator drives the central gear.\",\"alt\":\"Top view of the radial multi-screw dispenser with a central sector gear\"}],\"deliverables\":[\"Top-view sketch (done)\",\"Decide screw count and the toothed-arc angle (dwell vs. engagement timing)\",\"Gear mesh \u0026 sequencing analysis (ensure clean one-at-a-time engagement)\",\"Parametric CAD study\"],\"tags\":[\"radial\",\"carousel\",\"sector-gear\",\"mutilated-gear\",\"single-actuator\",\"selection\"]},{\"id\":\"phase-2\",\"name\":\"Solid dispenser — horizontal stacking\",\"status\":\"planned\",\"objective\":\"Meter solids from horizontally arranged bins feeding a common metering path.\",\"notes\":\"Bins sit side by side; the single actuator drives a shared metering element (e.g. a sweep, paddle, or sliding pocket) past each outlet. Trade-off vs. vertical: footprint and refill ergonomics against feed consistency and cross-contamination between commodities.\",\"deliverables\":[\"Concept sketch of the horizontal bin layout + shared metering element\",\"Cross-contamination / changeover analysis\",\"Parametric CAD study\"],\"tags\":[\"horizontal-stack\"]},{\"id\":\"phase-3\",\"name\":\"Solid dispenser — flexible screw conveyor\",\"status\":\"planned\",\"objective\":\"Meter solids via a flexible screw (auger) conveyor for routing and volumetric dosing.\",\"notes\":\"A flexible auger moves product from a remote hopper to the dispense point and doubles as the metering element — revolutions map to volume. Lets the hopper sit away from the point of sale and handles a wider range of solids. Relates to the existing concentric / screw-conveyor PoC work in the design catalog. Questions: flow consistency across commodities, slip/compaction, and turning auger revolutions into a defensible weight.\",\"deliverables\":[\"Flexible-auger metering concept\",\"Revolution-to-mass calibration approach per commodity\",\"CAD study reusing the screw-conveyor PoC\"],\"relatedDesigns\":[],\"tags\":[\"screw-conveyor\",\"auger\",\"flexible\"]},{\"id\":\"phase-4\",\"name\":\"Liquid dispenser — multiple liquids\",\"status\":\"idea\",\"objective\":\"Extend the single-actuator metering idea to dispensing multiple liquids.\",\"notes\":\"Carry the control approach over to liquids: one actuator selecting/metering among several liquid lines (e.g. cooking oil, detergent, milk). Open ques
