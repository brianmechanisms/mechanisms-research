drical-belt-dispenser\",\"name\":\"Cylindrical Belt Dispenser\",\"subtitle\":\"Vertical cylinder with an inclined belt conveyor inside — dispenses out a side slot\",\"description\":\"Novel dispenser study. A vertical cylindrical container with an open top and closed bottom holds the bulk material. Inside, a belt conveyor runs at an angle from the lower-back to the upper-front, lifting material up the incline and dispensing it through a rectangular exit slot cut in the cylinder wall at the upper pulley. First pass: static geometry only — drive, animation, and flighting / paddles to be added in subsequent steps.\",\"status\":\"in-progress\",\"tags\":[\"dispenser\",\"cylinder\",\"belt-conveyor\",\"inclined\",\"wip\"],\"parameters\":[{\"id\":\"cylInnerR\",\"label\":\"Cylinder inner radius\",\"default\":60,\"min\":20,\"max\":250,\"step\":1,\"unit\":\"mm\",\"group\":\"Container\"},{\"id\":\"cylH\",\"label\":\"Cylinder height\",\"default\":200,\"min\":50,\"max\":800,\"step\":1,\"unit\":\"mm\",\"group\":\"Container\"},{\"id\":\"wallT\",\"label\":\"Wall thickness\",\"default\":3,\"min\":1,\"max\":12,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Container\"},{\"id\":\"floorT\",\"label\":\"Floor thickness\",\"default\":3,\"min\":1,\"max\":12,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Container\"},{\"id\":\"pulleyR\",\"label\":\"Pulley radius\",\"default\":12,\"min\":4,\"max\":60,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Belt\"},{\"id\":\"beltW\",\"label\":\"Belt width\",\"default\":30,\"min\":5,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Belt\",\"description\":\"Belt width along the pulley axis (Z).\"},{\"id\":\"beltT\",\"label\":\"Belt thickness\",\"default\":1.5,\"min\":0.5,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Belt\"},{\"id\":\"tiltDeg\",\"label\":\"Belt tilt angle\",\"default\":35,\"min\":0,\"max\":75,\"step\":1,\"unit\":\"°\",\"group\":\"Belt\",\"description\":\"Inclination of the belt from horizontal. 0 = flat across the cylinder; higher = steeper lift.\"},{\"id\":\"beltSpan\",\"label\":\"Pulley centre-to-centre\",\"default\":100,\"min\":20,\"max\":600,\"step\":1,\"unit\":\"mm\",\"group\":\"Belt\",\"description\":\"Distance between the two pulley centres along the belt axis.\"},{\"id\":\"exitHeight\",\"label\":\"Exit slot height\",\"default\":40,\"min\":5,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Exit slot\",\"description\":\"Vertical height of the side opening cut in the cylinder wall at the upper pulley.\"},{\"id\":\"exitWidth\",\"label\":\"Exit slot width\",\"default\":36,\"min\":5,\"max\":300,\"step\":1,\"unit\":\"mm\",\"group\":\"Exit slot\",\"description\":\"Width of the side opening along the pulley axis (Z).\"},{\"id\":\"shaftR\",\"label\":\"Shaft radius\",\"default\":4,\"min\":1.5,\"max\":12,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Cantilever shaft radius. Shaft extends from each pulley through the +Z wall to an external bearing.\"},{\"id\":\"bossR\",\"label\":\"Wall boss radius\",\"default\":18,\"min\":6,\"max\":60,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Outer radius of the boss around each shaft. Must clear the outermost labyrinth ring.\"},{\"id\":\"bossIn\",\"label\":\"Boss inside protrusion\",\"default\":8,\"min\":2,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"How far the boss reaches into the cavity. Carries the stator labyrinth grooves.\"},{\"id\":\"bossOut\",\"label\":\"Boss outside protrusion\",\"default\":6,\"min\":2,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"How far the boss protrudes outside the wall. Seats the external bearing block.\"},{\"id\":\"labyrinthRings\",\"label\":\"Labyrinth rings\",\"default\":2,\"min\":1,\"max\":5,\"step\":1,\"group\":\"Shaft \u0026 seal\",\"description\":\"Number of concentric groove/ridge pairs in the non-contact powder seal.\"},{\"id\":\"labyrinthDepth\",\"label\":\"Labyrinth depth\",\"default\":3,\"min\":1,\"max\":8,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Axial depth of each labyrinth groove (and matching rotor ridge).\"},{\"id\":\"labyrinthClear\",\"label\":\"Labyrinth clearance\",\"default\":0.4,\"min\":0.15,\"max\":1.5,\"step\":0.05,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Axial + radial gap between rotor ridges and stator grooves.\"},{\"id\":\"bearingOR\",\"label\":\"Bearing OD radius\",\"default\":11,\"min\":4,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Outer radius of the external sealed bearing (11 mm = 608 bearing, OD 22).\"},{\"id\":\"bearingW\",\"label\":\"Bearing width\",\"default\":7,\"min\":3,\"max\":15,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Width of the external bearing along the shaft axis.\"}],\"tree\":[{\"id\":\"cylindrical-belt-dispenser\",\"label\":\"Cylindrical Belt Dispenser\",\"children\":[{\"id\":\"container\",\"label\":\"Cylindrical container\",\"color\":\"#b0b0b0\"},{\"id\":\"belt\",\"label\":\"Belt loop\",\"color\":\"#2a2a2a\"},{\"id\":\"pulley-lower\",\"label\":\"Lower pulley (intake)\",\"color\":\"#c0a060\"},{\"id\":\"pulley-upper\",\"label\":\"Upper pulley (discharge)\",\"color\":\"#c0a060\"},{\"id\":\"shaft-lower\",\"label\":\"Lower shaft (cantilever)\",\"color\":\"#888a90\"},{\"id\":\"shaft-upper\",\"label\":\"Upper shaft (cantilever)\",\"color\":\"#888a90\"},{\"id\":\"labyrinth-lower\",\"label\":\"Labyrinth rotor — lower\",\"color\":\"#6a8aa8\"},{\"id\":\"labyrinth-upper\",\"label\":\"Labyrinth rotor — upper\",\"color\":\"#6a8aa8\"},{\"id\":\"bearing-block-lower\",\"label\":\"Bearing block — lower\",\"color\":\"#404040\"},{\"id\":\"bearing-block-upper\",\"label\":\"Bearing block — upper\",\"color\":\"#404040\"}]}],\"bom\":[{\"label\":\"Cylindrical container\",\"quantity\":1,\"note\":\"Open-top tube with closed bottom, side exit slot, and integrated shaft bosses with stator l y / wet or very fine media, a felt or PTFE wiper can be added at the rotor face — not yet modelled. Belt rotation / animation, drive (motor + coupling), and belt flights / cleats remain to be added.\"}}],null],null],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\",\"assemblies\",\"children\",\"$e\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\",\"assemblies\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/mechanisms-research/_next/static/css/6bf84677938b7be2.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"div\",null,{\"className\":\"__variable_55ec73 __variable_4918c1 __variable_1f2f98 designs-root\",\"children\":[\"$\",\"$L10\",null,{\"children\":[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]}]}]],null],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/mechanisms-research/_next/static/css/36cdcee1aa5b57b7.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"
