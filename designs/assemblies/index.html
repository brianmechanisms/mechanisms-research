d the\n    cam rotation θ ∈ [0, 2π). The class method\n    Mechanism70c.computeCamProfile('S1' | 'S2', N) returns the sampled\n    {θ, r} pairs for each ridge.\n\n  • cam axis X     = max(x_S2) + r2min        (from class.getCamAxisX)\n  • Φ(t)           = 2π · t                   (cam rotation)\n  • slider X (mm)  = (x_S_i(t) - camAxisX) · worldScale\n\nRIDGE GEOMETRY  (the inverse of the v-slot variant's cut groove)\n\n  • Ridge centreline = pitch curve.\n  • Ridge cross-section: rectangular, thickness ridgeT (radial) × height ridgeH (along shaft).\n  • Follower: a pair of rollers (radius rollerR · worldScale) on either side of the ridge.\n  • Required follower-pair gap (centre-to-centre):\n        rollerPairGap = ridgeT + 2·(rollerR · worldScale) + clearance\n\nKEY DIMENSIONS (defaults)\n\n  rod radius           rodR        = 8 mm\n  rod length           rodLength   = 600 mm\n  shaft diameter       shaftDia    = 10 mm\n  shaft length         shaftLength = 80 mm\n  backing plate t      = 6 mm\n  ridge radial t       ridgeT      = 4 mm\n  ridge height         ridgeH      = 8 mm\n  world scale          = 200 mm/unit\n  L1 (world)           = 0.7\n  L2 (world)           = 1.2\n  parW (world)         = 0.08\n  rollerR (world)      = 0.06   →  1.2 mm × worldScale (= 12 mm) … see notes\n  r2min (world)        = 0.2\n\nSLIDER WHEEL LAYOUT (3-wheel preloaded triangle)\n\n  • Two grooved wheels on +Y side of the rod, spaced wheelSpacingX along rail axis.\n  • One grooved wheel on −Y side at the carriage centre.\n  • Wheel groove inner radius ≈ rodR + 0.5 mm clearance.\n"])</script><script>self.__next_f.push([1,"17:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$La\",null,{\"buildId\":\"lqvtXFpXdkbzBNWz_hcUs\",\"assetPrefix\":\"/mechanisms-research\",\"urlParts\":[\"\",\"designs\",\"assemblies\",\"\"],\"initialTree\":[\"\",{\"children\":[\"designs\",{\"children\":[\"assemblies\",{\"children\":[\"__PAGE__\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeed -2 inner radius (r2min)\",\"default\":0.2,\"min\":0.05,\"max\":5,\"step\":0.01,\"group\":\"Mechanism\",\"description\":\"Cam axis sits at (max S2.x + r2min). Sets the right-mirror axis.\"},{\"id\":\"L1\",\"label\":\"Link 1 length\",\"default\":0.7,\"min\":0.2,\"max\":5,\"step\":0.01,\"group\":\"Linkage\"},{\"id\":\"L2\",\"label\":\"Link 2 length\",\"default\":1.2,\"min\":0.2,\"max\":5,\"step\":0.01,\"group\":\"Linkage\"},{\"id\":\"railY\",\"label\":\"Rail Y\",\"default\":-0.4,\"min\":-5,\"max\":5,\"step\":0.01,\"group\":\"Linkage\",\"description\":\"World-frame rail height passed to the mechanism.\"},{\"id\":\"parW\",\"label\":\"Parallelogram width\",\"default\":0.08,\"min\":0,\"max\":1,\"step\":0.01,\"group\":\"Linkage\",\"description\":\"Base width of the link-1 parallelogram. 0 collapses to a single bar.\"}],\"tree\":[{\"id\":\"rail\",\"label\":\"V-slot rail\",\"color\":\"#b5b5b5\",\"componentSlug\":\"v-slot-2020\"},{\"id\":\"mid-clamp\",\"label\":\"Mid-rail clamp\",\"color\":\"#8a8a8a\",\"componentSlug\":\"rail-mid-clamp\"},{\"id\":\"cam-plate\",\"label\":\"Dual-groove cam plate\",\"color\":\"#d4845a\",\"componentSlug\":\"cam-plate-70-3\"},{\"id\":\"sliders\",\"label\":\"Slider carriages\",\"color\":\"#86b067\",\"children\":[{\"id\":\"slider-S1\",\"label\":\"Slider S1\",\"color\":\"#60a5fa\",\"componentSlug\":\"rail-slider-vwheel\"},{\"id\":\"slider-S2\",\"label\":\"Slider S2\",\"color\":\"#a855f7\",\"componentSlug\":\"rail-slider-vwheel\"},{\"id\":\"slider-S3\",\"label\":\"Slider S3\",\"color\":\"#4ade80\",\"componentSlug\":\"rail-slider-vwheel\"},{\"id\":\"slider-S4\",\"label\":\"Slider S4\",\"color\":\"#f472b6\",\"componentSlug\":\"rail-slider-vwheel\"}]}],\"scad\":\"// Walker Prototype — placeholder. Real SCAD generated from build3D\\n// parameters once the geometry stabilises.\\ninclude \u003cv-slot-2020.scad\u003e;\\n\\nrail_length = 600;\\n\\nmodule walker_70_3() {\\n  v_slot_2020(rail_length);\\n  // TODO: bracket, shaft, cam plate, sliders, links, feet.\\n}\\n\\nwalker_70_3();\\n\",\"bom\":[{\"componentSlug\":\"v-slot-2020\",\"quantity\":1,\"note\":\"Main rail, 600 mm\"},{\"componentSlug\":\"rail-mid-clamp\",\"quantity\":1,\"note\":\"Mid-rail saddle, mounts to chassis\"},{\"componentSlug\":\"rail-slider-vwheel\",\"quantity\":4,\"note\":\"S1..S4, identical hardware\"},{\"label\":\"Cantilever bracket\",\"quantity\":1},{\"label\":\"Cam shaft\",\"quantity\":1,\"note\":\"D-flat at drive end\"},{\"componentSlug\":\"cam-plate-70-3\",\"quantity\":1,\"note\":\"Synthesised from Mechanism 70.3\"},{\"label\":\"Link 1 bar\",\"quantity\":8,\"note\":\"Parallelogram leg (2 per slider × 4 sliders)\"},{\"label\":\"Link 2 bar\",\"quantity\":4,\"note\":\"Single bar (1 per S2/S4 × 2 sides)\"},{\"label\":\"Joint plate\",\"quantity\":4,\"note\":\"One per (upper/lower × left/right) joint\"},{\"label\":\"Foot peg\",\"quantity\":4,\"note\":\"One per tracer\"}],\"notes\":\"v1: cantilever shaft, single cam plate with two grooves, all four sliders share one rail. Drive end is a D-flat — coupling / bevel pinion comes later. See Mechanism 70.3 for the kinematic equations driving the cam profile.\"},{\"slug\":\"walker-70-3-rod\",\"name\":\"Walker Prototype (Mechanism 70.3, Rod variant)\",\"subtitle\":\"Round-rod rail, 3-wheel sliders, cam ASSEMBLY with raised ridges\",\"description\":\"Second physical realisation of Mechanism 70.3. Round rod replaces the 2020 v-slot. Sliders ride the rod on three grooved wheels in a preloaded triangle. The cam is an assembly — shaft, backing plate, and two screw-on raised ridges — and each follower is a pair of rollers (inner + outer) straddling its ridge.\",\"status\":\"in-progress\",\"tags\":[\"walker\",\"cam-driven\",\"mechanism-70.3\",\"rod\",\"ridge-cam\"],\"mechanismId\":70.3,\"parameters\":[{\"id\":\"worldScale\",\"label\":\"World scale\",\"default\":200,\"min\":50,\"max\":500,\"step\":1,\"unit\":\"mm/unit\",\"group\":\"Scale\",\"description\":\"Millimetres per unit world distance from the kinematic class
