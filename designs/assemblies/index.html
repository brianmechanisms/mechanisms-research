 around the\n    cam rotation θ ∈ [0, 2π). The class method\n    Mechanism70c.computeCamProfile('S1' | 'S2', N) returns the sampled\n    {θ, r} pairs for each ridge.\n\n  • cam axis X     = max(x_S2) + r2min        (from class.getCamAxisX)\n  • Φ(t)           = 2π · t                   (cam rotation)\n  • slider X (mm)  = (x_S_i(t) - camAxisX) · worldScale\n\nRIDGE GEOMETRY  (the inverse of the v-slot variant's cut groove)\n\n  • Ridge centreline = pitch curve.\n  • Ridge cross-section: rectangular, thickness ridgeT (radial) × height ridgeH (along shaft).\n  • Follower: a pair of rollers (radius rollerR · worldScale) on either side of the ridge.\n  • Required follower-pair gap (centre-to-centre):\n        rollerPairGap = ridgeT + 2·(rollerR · worldScale) + clearance\n\nKEY DIMENSIONS (defaults)\n\n  rod radius              rodR              = 8 mm\n  rod length              rodLength         = 600 mm\n  shaft diameter          shaftDia          = 8 mm  (608ZZ bore)\n  shaft length            shaftLength       = frameDepth + 60 mm\n  cam plate thickness     camPlateThickness = 6 mm\n  cam plate outer dia     camPlateOuterDia  = 80 mm\n  ridge radial t          ridgeT            = 4 mm\n  ridge height            ridgeH            = 8 mm\n  world scale          = 200 mm/unit\n  L1 (world)           = 0.7\n  L2 (world)           = 1.2\n  parW (world)         = 0.08\n  rollerR (world)      = 0.06   →  1.2 mm × worldScale (= 12 mm) … see notes\n  r2min (world)        = 0.2\n\nSLIDER WHEEL LAYOUT (3-wheel preloaded triangle)\n\n  • Two grooved wheels on +Y side of the rod, spaced wheelSpacingX along rail axis.\n  • One grooved wheel on −Y side at the carriage centre.\n  • Wheel groove inner radius ≈ rodR + 0.5 mm clearance.\n"])</script><script>self.__next_f.push([1,"11:{\"id\":\"worldScale\",\"label\":\"World scale\",\"default\":200,\"min\":50,\"max\":500,\"step\":1,\"unit\":\"mm/unit\",\"group\":\"Scale\",\"description\":\"Millimetres per unit world distance from the kin  of the ridge.\n  • Required follower-pair gap (centre-to-centre):\n        rollerPairGap = ridgeT + 2·(rollerR · worldScale) + clearance\n\nKEY DIMENSIONS (defaults)\n\n  rod radius              rodR              = 8 mm\n  rod length              rodLength         = 600 mm\n  shaft diameter          shaftDia          = 8 mm  (608ZZ bore)\n  shaft length            shaftLength       = frameDepth + 60 mm\n  cam plate thickness     camPlateThickness = 6 mm\n  cam plate outer dia     camPlateOuterDia  = 80 mm\n  ridge radial t          ridgeT            = 4 mm\n  ridge height            ridgeH            = 8 mm\n  world scale          = 200 mm/unit\n  L1 (world)           = 0.7\n  L2 (world)           = 1.2\n  parW (world)         = 0.08\n  rollerR (world)      = 0.06   →  1.2 mm × worldScale (= 12 mm) … see notes\n  r2min (world)        = 0.2\n\nSLIDER WHEEL LAYOUT (3-wheel preloaded triangle)\n\n  • Two grooved wheels on +Y side of the rod, spaced wheelSpacingX along rail axis.\n  • One grooved wheel on −Y side at the carriage centre.\n  • Wheel groove inner radius ≈ rodR + 0.5 mm clearance.\n"])</script><script>self.__next_f.push([1,"1d8:T42c,Square outer cross-section gives flat faces for the racks; the cylindrical bore through each member end-cap accepts the guide rod from the next inner member, keeping it axially aligned with minimal friction. The innermost member is the output and carries no pinions of its own.\n\nTODO:\n1. Couple the two pinions on each carrier tube so they rotate together. Each tube has a top + bottom pinion on a single shaft; they need a rigid coupling (one-piece shaft, keyed boss, or through-shaft with both gears fixed) so they cannot rotate independently and the rack engagement at top and bottom stays in phase.\n2. Re-route the screw drive: instead of the screw acting directly on the SECOND tube, have it drive the rod/pin of the second tube THROUGH the first (outer) tube. The screw + nut still live at the bottom; the nut is bonded to the bottom of the second tube's rod (which already passes through the first tube's end-cap bore). Lifting the rod lifts the second tube. Frees up the area around the second tube and keeps all moving drive parts inside the fixed outer tube.1d9:T8d4,"])</script><script>self.__next_f.push([1,"Current build: six concentric curved ring sectors (rings 0..5) arranged in a planetary cascade. Even rings (0, 2, 4) sit in one Z-slab; odd rings (1, 3, 5) sit in the offset slab. Intermediate rings (1..4) carry teeth on both arcs and two pinions each, mounted on shafts on the exposed end face that faces toward the next ring out. Ring 0 is fixed; driving ring 1 cascades through ring 5 with each successive ring sweeping faster than the last.\n\nPossible applications:\n1. Deployable tent — not sure it strictly fits the \"deployable mechanism\" definition, but the fan-out of nested arcs could form a self-spreading curved canopy.\n2. Fancy gate — the cascading sweep gives a dramatic opening motion across a curved opening.\n3. Fancy door — same idea, vertical orientation, panels nest and fan out as the door opens.\n4. Door opening/closing mechanism — a compact actuator that multiplies a small input sweep into a large output sweep via the planetary ratio at each stage.\n\nTo investigate — force / actuator-sizing advantage over linear actuators:\nA conventional linear actuator on a door or gate pushes along a fixed line, but the door swings on an arc. The actuator force has to be decomposed into a tangential component (which does useful work moving the door) and a radial component (absorbed by the hinge as wasted capacity). The decomposition is geometry-dependent and worst near the fully open / fully closed positions, so the actuator must be sized for the WORST tangential-fraction in its travel — i.e. you end up specifying a more powerful actuator than the average required torque would suggest.\n\nThis banana cascade in principle applies its output torque directly to the swinging member through the gear mesh, with no force decomposed away into the hinge. Combined with the planetary speed multiplication (input small sweep → output large sweep), the input torque required should likewise be reduced by the overall ratio, so a smaller / less powerful actuator could in principle achieve the same door motion. The trade-offs (friction losses across many meshes, backlash, manufacturing tolerance on curved racks, structural stiffness of curved sectors) need to be measured before claiming a real advantage — flag for follow-up research."])</script><script>self.__next_f.push([1,"1e1:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$La\",null,{\"buildId\":\"4HVliKr3wScT5dXl_o4gh\",\"assetPrefix\":\"/mechanisms-research\",\"urlParts\":[\"\",\"designs\",\"assemblies\",\"\"],\"initialTree\":[\"\",{\"children\":[\"designs\",{\"children\":[\"assemblies\",{\"children\":[\"__PAGE__\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"designs\",{\"children\":[\"assemblies\",{\"children\":[\"__PAGE__\",{},[[\"$Lb\",[[\"$\",\"$Lc\",null,{}],[\"$\",\"$Ld\",null,{\"code\":\"Designs / ASM\",\"title\":\"Assemblies\",\"subtitle\":\"Buildable assemblies. When linked to a kinematic class, the live 2D pane animates the linkage straight from the IK; the BOM cross-references components in this catalog.\"}],[\"$\",\"main\",null,{\"className\":\"max-w-[1200px] mx-auto px-6 py-8\",\"children\":[\"$\",\"$Le\",null,{\"kind\":\"assembly\",\"designs\":[{\"slug\":\"walker-70-3-prototype\",\"name\":\"Walker Prototype (Mechanism 70.3)\",\"subtitle\":\"Buildable cam-driven walker prototype\",\"description\":\"Buildable assembly that realises Mechanism 70.3: one v-slot rail carrying four v-wheel slider carriages (S1..S4), a cantilever cam-shaft bracket at the cam-axis position, and a single dual-groove cam plate driving both left/right slider pairs at 180° phase offset. Eight links and four feet sit above and below the rail.\",\"status\":\"in-progress\", le C (two-jaw forward ring + two-jaw aft ring, inchworming along Z). At the A–C junction the active mode hands off: vertical jaws park open, horizontal jaws clamp pole C, then the body shuttles along C.\",\"status\":\"in-progress\",\"tags\":[\"pharaas\",\"climber\",\"inchworm\",\"gripper\",\"walking\"],\"parameters\":[{\"id\":\"poleT\",\"label\":\"Pole cross-section\",\"default\":20,\"min\":10,\"max\":40,\"step\":1,\"unit\":\"mm\",\"group\":\"Rails\",\"description\":\"Edge of the pole A / pole C square cross-section. Matches pharaas-rails.\"},{\"id\":\"poleAH\",\"label\":\"Pole A height\",\"default\":640,\"min\":100,\"max\":2000,\"step\":10,\"unit\":\"mm\",\"group\":\"Rails\",\"description\":\"Vertical extent of pole A (climbing track).\"},{\"id\":\"poleCJointY\",\"label\":\"Pole C height (Y)\",\"default\":625,\"min\":100,\"max\":2000,\"step\":10,\"unit\":\"mm\",\"group\":\"Rails\",\"description\":\"Height of the horizontal pole C above the floor.\"},{\"id\":\"poleCH\",\"label\":\"Pole C length\",\"default\":350,\"min\":100,\"max\":2000,\"step\":10,\"unit\":\"mm\",\"group\":\"Rails\",\"description\":\"Length of pole C along Z (the horizontal track).\"},{\"id\":\"bodySize\",\"label\":\"Body cube size\",\"default\":40,\"min\":20,\"max\":120,\"step\":1,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"Edge of the central body cube.\"},{\"id\":\"jawArm\",\"label\":\"Jaw arm length\",\"default\":30,\"min\":10,\"max\":120,\"step\":1,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"How far each jaw extends from the body toward / past the pole.\"},{\"id\":\"jawT\",\"label\":\"Jaw thickness\",\"default\":12,\"min\":4,\"max\":40,\"step\":1,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"Jaw cross-section thickness perpendicular to the pole axis.\"},{\"id\":\"jawW\",\"label\":\"Jaw width\",\"default\":24,\"min\":8,\"max\":80,\"step\":1,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"Jaw width along the pole axis (the contact patch length).\"},{\"id\":\"ringGap\",\"label\":\"Clamp ring gap\",\"default\":90,\"min\":30,\"max\":400,\"step\":5,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"Distance between the two clamp rings of one mode (top↔bottom on pole A; fwd↔aft on pole C).\"},{\"id\":\"stride\",\"label\":\"Inchworm stride\",\"default\":70,\"min\":10,\"max\":300,\"step\":5,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"How far the body advances per inchworm cycle (per ring step).\"},{\"id\":\"openD\",\"label\":\"Jaw open distance\",\"default\":8,\"min\":1,\"max\":40,\"step\":1,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"How far each jaw retracts from the pole when released.\"},{\"id\":\"startY\",\"label\":\"Start Y on pole A\",\"default\":200,\"min\":0,\"max\":2000,\"step\":10,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"Body Y at the beginning of the cycle (vertical-mode start).\"}],\"tree\":[{\"id\":\"rail-pole-A\",\"label\":\"Rail: pole A (vertical)\",\"color\":\"#8a8a8e\"},{\"id\":\"rail-pole-C\",\"label\":\"Rail: pole C (horizontal)\",\"color\":\"#d4845a\"},{\"id\":\"climber-body\",\"label\":\"Climber body\",\"color\":\"#4a6fa5\"},{\"id\":\"climber/v-pair-p\",\"label\":\"Vertical pair (+X side of pole A)\",\"color\":\"#60a5fa\",\"children\":[{\"id\":\"climber/v-pair-p/rod\",\"label\":\"Linking rod\",\"color\":\"#3a6fb0\"},{\"id\":\"climber/v-pair-p/jaw-top\",\"label\":\"Top jaw\",\"color\":\"#60a5fa\"},{\"id\":\"climber/v-pair-p/jaw-bot\",\"label\":\"Bottom jaw\",\"color\":\"#60a5fa\"}]},{\"id\":\"climber/v-pair-n\",\"label\":\"Vertical pair (−X side of pole A)\",\"color\":\"#60a5fa\",\"children\":[{\"id\":\"climber/v-pair-n/rod\",\"label\":\"Linking rod\",\"color\":\"#3a6fb0\"},{\"id\":\"climber/v-pair-n/jaw-top\",\"label\":\"Top jaw\",\"color\":\"#60a5fa\"},{\"id\":\"climber/v-pair-n/jaw-bot\",\"label\":\"Bottom jaw\",\"color\":\"#60a5fa\"}]},{\"id\":\"climber/h-pair-p\",\"label\":\"Horizontal pair (+Y side of pole C)\",\"color\":\"#a855f7\",\"children\":[{\"id\":\"climber/h-pair-p/rod\",\"label\":\"Linking rod\",\"color\":\"#7a3fc0\"},{\"id\":\"climber/h-pair-p/jaw-fwd\",\"label\":\"Forward jaw\",\"color\":\"#a855f7\"},{\"id\":\"climber/h-pair-p/jaw-aft\",\"label\":\"Aft jaw\",\"color\":\"#a855f7\"}]},{\"id\":\"climber/h-pair-n\",\"label\":\"Horizontal pair (−Y side of pole C)\",\"color\":\"#a855f7\",\"children\":[{\"id\":\"climber/h-pair-n/rod\",\"label\":\"Linking rod\",\"color\":\"#7a3fc0\"},{\"id\":\"climber/h-pair-n/jaw-fwd\",\"label\":\"Forward jaw\",\"color\":\"#a855f7\"},{\"id\":\"climber/h-pair-n/jaw-aft\",\"label\":\"Aft jaw\",\"color\":\"#a855f7\"}]}],\"scad\":\"// Pharaas climber — placeholder. See build3D for actual geometry.\\nmodule pharaas_climber() {\\n  // Vertical clamp rings around pole A + horizontal clamp rings around pole C.\\n}\\npharaas_climber();\\n\",\"bom\":[{\"label\":\"Climber body block\",\"quantity\":1},{\"label\":\"Vertical pair (rod + top jaw + bottom jaw)\",\"quantity\":2,\"note\":\"On +X and −X faces of pole A; jaws rigidly linked by the rod\"},{\"label\":\"Horizontal pair (rod + fwd jaw + aft jaw)\",\"quantity\":2,\"note\":\"On +Y and −Y faces of pole C; jaws rigidly linked by the rod\"},{\"label\":\"Pair clamp actuator\",\"quantity\":4,\"note\":\"One per pair — extends/retracts both jaws on the rod together\"},{\"label\":\"Pair slide actuator\",\"quantity\":4,\"note\":\"One per pair — translates the rod along the active pole axis\"}],\"notes\":\"Inchworm gait, two modes. Four grippers per direction = two pairs; within a pair the top and bottom jaws share a rigid rod and clamp / release together (one bottom jaw connects to one top jaw). Vertical-mode cycle (t ∈ [0, 0.5]): pair-N grips pole A, pair-P releases / lifts / regrips, then pair-N releases and the body + pair-N lift. Two strides per half-cycle. At t = 0.5 the active mode switches: vertical pairs park open at pole C height, horizontal pairs engage pole C, body shuttles along Z (two strides).\"},{\"slug\":\"telescopic-screw-75\",\"name\":\"Telescopic Screw Lift (Mechanism 75)\",\"subtitle\":\"N-stage anti-rotated telescoping screw — locus-3 design study\",\"description\":\"Buildable 3D realisation of Mechanism 75 / locus 3: an N-stage telescopic screw driven from below, with the topmost stage held against rotation by a rod-and-sleeve chain anchored to a barrel-mounted receiver. Designed for dispensing inside a circular barrel.\",\"status\":\"in-progress\",\"tags\":[\"screw\",\"telescopic\",\"lift\",\"dispenser\",\"anti-rotation\",\"mechanism-75\"],\"mechanismId\":75,\"parameters\":[{\"id\":\"N\",\"label\":\"Number of stages\",\"default\":5,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Stages\",\"description\":\"Number of nested screw stages, top stage held against rotation.\"},{\"id\":\"stageHeight\",\"label\":\"Stage height\",\"default\":40,\"min\":10,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"rCore\",\"label\":\"Central bore radius\",\"default\":3,\"min\":1,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"tOuter\",\"label\":\"Outer wall thickness\",\"default\":2,\"min\":0.5,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Wall\"},{\"id\":\"tGroove\",\"label\":\"Annular groove width\",\"default\":3,\"min\":1,\"max\":12,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Wall\"},{\"id\":\"tInner\",\"label\":\"Inner wall thickness\",\"default\":2,\"min\":0.5,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Wall\"},{\"id\":\"rodLengthFactor\",\"label\":\"Rod length factor\",\"default\":0.9,\"min\":0.3,\"max\":1,\"step\":0.05,\"group\":\"Anti-rotation\",\"description\":\"Rod length as a fraction of stage height; controls max stroke per stage.\"},{\"id\":\"spinScale\",\"label\":\"Visual spin gain\",\"default\":8,\"min\":0,\"max\":50,\"step\":1,\"group\":\"Animation\",\"description\":\"Thread/stage rotation multiplier for the animation; does not change geometry.\"}],\"tree\":[{\"id\":\"telescopic-screw-75\",\"label\":\"Telescopic Screw Lift\",\"children\":[{\"id\":\"barrel\",\"label\":\"Barrel (transparent, fixed)\",\"color\":\"#b0b0b0\"},{\"id\":\"receiver\",\"label\":\"Anti-rotation receiver (barrel-fixed)\",\"color\":\"#555555\"},{\"id\":\"stage-0\",\"label\":\"Stage 0 body (driven, outermost)\",\"color\":\"#440154\"},{\"id\":\"sleeve-0\",\"label\":\"Sleeve 0 (anti-rot ring)\",\"color\":\"#9966cc\"},{\"id\":\"rod-cage-0\",\"label\":\"Rod cage 0 → receiver\",\"color\":\"#cc3333\"},{\"id\":\"stage-1\",\"label\":\"Stage 1 body\",\"color\":\"#3b528b\"},{\"id\":\"sleeve-1\",\"label\":\"Sleeve 1\",\"color\":\"#9966cc\"},{\"id\":\"rod-cage-1\",\"label\":\"Rod cage 1 → sleeve 0\",\"color\":\"#cc3333\"},{\"id\":\"stage-2\",\"label\":\"Stage 2 body\",\"color\":\"#21908d\"},{\"id\":\"sleeve-2\",\"label\":\"Sleeve 2\",\"color\":\"#9966cc\"},{\"id\":\"rod-cage-2\",\"label\":\"Rod cage 2 → sleeve 1\",\"color\":\"#cc3333\"},{\"id\":\"stage-3\",\"label\":\"Stage 3 body\",\"color\":\"#5ec962\"},{\"id\":\"sleeve-3\",\"label\":\"Stage 3 - sleeve\",\"color\":\"#9966cc\"},{\"id\":\"rod-cage-3\",\"label\":\"Rod cage 3 → sleeve 2\",\"color\":\"#cc3333\"},{\"id\":\"top-unit\",\"label\":\"Stage 4\",\"color\":\"#fde725\"}]}],\"bom\":[{\"label\":\"Barrel tube\",\"quantity\":1,\"note\":\"Smooth-bore cylindrical tube (transparent in viewer).\"},{\"label\":\"Anti-rotation receiver\",\"quantity\":1,\"note\":\"Fixed cyl at barrel base, holes for stage-0 rods.\"},{\"label\":\"Threaded stage (outer + inner walls + groove floor)\",\"quantity\":4,\"note\":\"Stages 0..N-2; identical pattern, different radii.\"},{\"label\":\"Top stage (solid)\",\"quantity\":1,\"note\":\"Innermost stage, rigidly fused with its sleeve; platform face.\"},{\"label\":\"Sleeve disc\",\"quantity\":5,\"note\":\"One per stage; top is solid, others are rings.\"},{\"label\":\"Anti-rotation rod\",\"quantity\":20,\"note\":\"4 per stage × 5 stages (visualised at 90° intervals).\"}],\"scad\":\"// Telescopic Screw Lift — assembly source.\\n// Each part is generated as a self-contained SCAD program by the\\n// 'telescopic-screw-75' entry in scadRegistry.ts (compiled to STL via\\n// openscad-wasm). Part list:\\n//   barrel              — outer transparent tube\\n//   receiver            — fixed annulus at the base with 4 rod holes\\n//   stage-{k}           — k = 0..N-1; outer/inner walls + groove floor\\n//                         (top stage is a solid cylinder)\\n//   sleeve-{k}          — anti-rotation disc on top of stage k;\\n//                         non-top sleeves have 4 rod-clearance holes\\n//   rod-cage-{k}        — 4 rods hanging from sleeve k into the unit below\\n\",\"equations\":\"## Telescoping kinematics\\n\\nDriven from below (stage 0) at angular rate ω, top stage (k=N-1) held against rotation. Each thread interface contributes lift = p × Δφ where Δφ is the relative rotation across that interface.\\n\\n$$ z_{top} = \\\\frac{p \\\\, \\\\varphi_{in}}{2\\\\pi} $$\\n\\nPer-stage rise (linear interpolation):\\n\\n$$ z_k = z_{top} \\\\cdot \\\\frac{k}{N-1} $$\\n\\n## Stage radii\\n\\nBuilt innermost-out from the central bore radius $r_c$:\\n\\n$$ r^{i,ID}_{N-1} = r_c $$\\n$$ r^{i,OD}_k = r^{i,ID}_k + t_i $$\\n$$ r^{o,ID}_k = r^{i,OD}_k + t_g $$\\n$$ r^{o,OD}_k = r^{o,ID}_k + t_o $$\\n$$ r^{i,ID}_{k-1} = r^{o,OD}_k + \\\\text{gap} $$\\n\\n## Max stroke\\n\\nEach rod must remain engaged with its receiver below; with rod length $L_r = f_r \\\\cdot h$:\\n\\n$$ z_{max,k} = h - (h - L_r) = L_r $$\\n\\nTotal stroke distributed across N−1 interfaces:\\n\\n$$ z_{stroke} \\\\approx (N-1) \\\\cdot L_r \\\\cdot \\\\eta $$\\n\\nwhere $\\\\eta$ is a safety factor (≈ 0.85 in the builder).\",\"notes\":\"Geometry mirrors the locus-3 design study. The barrel is rendered transparent so the screw stack stays visible. Animation: progress 0 → max → 0 (triangle-wave) extends and collapses the stack; the bottom stage spins at the full input rate, intermediate stages spin proportionally, the top stage is rotation-locked.\"},{\"slug\":\"telescopic-rackpinion-76\",\"name\":\"Telescopic Cylinder — Rack \u0026 Pinion (Mechanism 76)\",\"subtitle\":\"Square outer bodies + cylindrical bores; screw-driven 2:1+ stage cascade\",\"description\":\"N nested telescoping members with square outer profiles and a cylindrical bore through each. Each member carries pinions on its body that mesh racks on the inner face of the member outside it and the outer face of the member inside it. A screw drives the second member; each successive member rises by +1× stroke over its outer neighbour. Pin/rod fingers on each member slide in the cylindrical bore of the member outside it for guiding.\",\"status\":\"in-progress\",\"tags\":[\"rack\",\"pinion\",\"gear\",\"telescopic\",\"lift\",\"doubler\",\"mechanism-76\"],\"mechanismId\":76,\"parameters\":[{\"id\":\"N\",\"label\":\"Number of stages (walls)\",\"default\":7,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Stages\",\"description\":\"Total nested members. Each beyond the outer adds a +1× stage.\"},{\"id\":\"cylHeight\",\"label\":\"Member height\",\"default\":560,\"min\":40,\"max\":2000,\"step\":5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"maxStroke\",\"label\":\"Stroke per stage\",\"default\":480,\"min\":20,\"max\":1800,\"step\":5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"wallT\",\"label\":\"Wall (square-tube) thickness\",\"default\":5,\"min\":1,\"max\":15,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Body\"},{\"id\":\"boreR\",\"label\":\"Cylindrical bore radius\",\"default\":6,\"min\":2,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Body\"},{\"id\":\"pinR\",\"label\":\"Guide-rod (pin) radius\",\"default\":5.5,\"min\":1,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Body\"},{\"id\":\"pinionR\",\"label\":\"Pinion pitch radius\",\"default\":14,\"min\":5,\"max\":40,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Gears\"},{\"id\":\"toothDepth\",\"label\":\"Tooth depth\",\"default\":2.5,\"min\":0.5,\"max\":8,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Gears\"},{\"id\":\"toothPitch\",\"label\":\"Tooth pitch\",\"default\":6,\"min\":2,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Gears\"},{\"id\":\"screwR\",\"label\":\"Drive screw radius\",\"default\":6,\"min\":2,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Drive\"}],\"tree\":[{\"id\":\"telescopic-rackpinion-76\",\"label\":\"Telescopic Cylinder (R\u0026P)\",\"children\":[{\"id\":\"screw\",\"label\":\"Drive screw (fixed, rotates)\",\"color\":\"#cc3333\"},{\"id\":\"nut\",\"label\":\"Nut on bottom cap of member 2\",\"color\":\"#cc8866\"},{\"id\":\"wall-0\",\"label\":\"Member 0 — outermost (fixed)\",\"color\":\"#aab0b8\"},{\"id\":\"wall-1\",\"label\":\"Member 1 — carrier (screw-driven)\",\"color\":\"#3b82f6\"},{\"id\":\"wall-2\",\"label\":\"Member 2\",\"color\":\"#a78bfa\"},{\"id\":\"wall-3\",\"label\":\"Member 3 — innermost (output)\",\"color\":\"#5eead4\"},{\"id\":\"pinions\",\"label\":\"Pinion sets (top + bottom per side)\",\"color\":\"#f59e0b\"}]}],\"bom\":[{\"label\":\"Square-tube member (steel)\",\"quantity\":4,\"note\":\"Square outer cross-section with cylindrical bore through each end-cap.\"},{\"label\":\"Guide rod / pin\",\"quantity\":3,\"note\":\"One per non-outer member, slides into the bore of the member outside it.\"},{\"label\":\"Rack strip\",\"quantity\":6,\"note\":\"Inner-face + outer-face racks on adjacent member pairs.\"},{\"label\":\"Pinion\",\"quantity\":16,\"note\":\"4 per non-innermost, non-outermost member (top + bottom × left + right).\"},{\"label\":\"Drive screw\",\"quantity\":1,\"note\":\"Acme thread, fixed in Y, rotates to drive member 1.\"},{\"label\":\"Travelling nut\",\"quantity\":1,\"note\":\"Bonded to member 1 bottom cap; climbs the screw.\"}],\"scad\":\"// Telescopic Rack-and-Pinion Cylinder — assembly source.\\n// Each part is generated by the 'telescopic-rackpinion-76' entry in\\n// scadRegistry.ts (compiled to STL via openscad-wasm). Part list:\\n//   wall-{k}     — k = 0..N-1; square-section tube with cylindrical\\n//                  end-cap bore (the bore guides the pin from k+1).\\n//   pin-{k}      — k = 1..N-1; vertical cylindrical rod attached to\\n//                  wall k's top, sliding inside wall (k-1)'s bore.\\n//   rack-{...}   — flat racks on the facing faces of adjacent members.\\n//   pinion-{...} — gear, top+bottom pair on each non-outer, non-inner\\n//                  member, axles bonded to the member's body.\\n//   screw, nut   — drive system at the axis.\\n\",\"equations\":\"## Lift ratio\\n\\nDriving the carrier (k=1) by stroke h via the screw. Each subsequent stage adds +1·h via its rack-and-pinion pair, so member k rises by\\n\\n$$ h_k = (k-1) \\\\cdot h $$\\n\\nand the innermost (output) rises by\\n\\n$$ h_{out} = (N-1) \\\\cdot h $$\\n\\n## Pinion rotation\\n\\nEach pinion sits between two adjacent members whose relative lift is exactly h. Roll length = h, so\\n\\n$$ \\\\varphi = \\\\frac{h}{r_p} $$\\n\\nidentical across all stages.\",\"notes\":\"$1d8\"},{\"slug\":\"telescopic-chain-77\",\"name\":\"Telescopic Cylinder — Rack \u0026 Pinion + Chain Coupling (Mechanism 77)\",\"subtitle\":\"Mechanism 76 with top/bottom big pinions coupled by a chain on coaxial sprockets\",\"description\":\"Variant of Mechanism 76. Identical telescoping square tubes, racks, screw drive and stroke math. The intermediate gear train along Y is removed entirely (no middle big or small gears between top and bottom). Each remaining big pinion — only the TOP and the BOTTOM on every non-outer, non-inner tube — carries a smaller coaxial sprocket rigidly attached. A vertical chain loop on each tube wraps the top sprocket and bottom sprocket on that tube, locking them in phase. The chain replaces the through-shaft coupling that Mechanism 76 needed to keep top and bottom pinions on a tube synchronised.\",\"status\":\"in-progress\",\"tags\":[\"rack\",\"pinion\",\"gear\",\"chain\",\"sprocket\",\"telescopic\",\"lift\",\"doubler\",\"mechanism-77\"],\"mechanismId\":77,\"parameters\":[{\"id\":\"N\",\"label\":\"Number of stages (walls)\",\"default\":7,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Stages\",\"description\":\"Total nested members. Each beyond the outer adds a +1× stage.\"},{\"id\":\"cylHeight\",\"label\":\"Member height\",\"default\":560,\"min\":40,\"max\":2000,\"step\":5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"maxStroke\",\"label\":\"Stroke per stage\",\"default\":480,\"min\":20,\"max\":1800,\"step\":5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"wallT\",\"label\":\"Wall (square-tube) thickness\",\"default\":5,\"min\":1,\"max\":15,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Body\"},{\"id\":\"screwR\",\"label\":\"Drive screw radius\",\"default\":6,\"min\":2,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Drive\"}],\"tree\":[{\"id\":\"telescopic-chain-77\",\"label\":\"Telescopic Cylinder (R\u0026P + Chain)\",\"children\":[{\"id\":\"screw\",\"label\":\"Drive screw (fixed, rotates)\",\"color\":\"#cc3333\"},{\"id\":\"nut\",\"label\":\"Nut on bottom cap of member 1\",\"color\":\"#cc8866\"},{\"id\":\"wall-0\",\"label\":\"Member 0 — outermost (fixed)\",\"color\":\"#aab0b8\"},{\"id\":\"wall-1\",\"label\":\"Member 1 — carrier (screw-driven)\",\"color\":\"#3b82f6\"},{\"id\":\"wall-2\",\"label\":\"Member 2\",\"color\":\"#a78bfa\"},{\"id\":\"wall-3\",\"label\":\"Member 3 — innermost (output)\",\"color\":\"#5eead4\"},{\"id\":\"pinions\",\"label\":\"Big pinions (top + bottom per tube)\",\"color\":\"#f59e0b\"},{\"id\":\"sprockets\",\"label\":\"Chain sprockets (coaxial with pinions)\",\"color\":\"#d97706\"},{\"id\":\"chains\",\"label\":\"Chain loops (top↔bottom per tube)\",\"color\":\"#444444\"}]}],\"bom\":[{\"label\":\"Square-tube member (wood)\",\"quantity\":4,\"note\":\"Square outer cross-section, racks unioned into body.\"},{\"label\":\"Rack strip\",\"quantity\":6,\"note\":\"Inner-face + outer-face racks on adjacent member pairs (merged into tube).\"},{\"label\":\"Big pinion\",\"quantity\":4,\"note\":\"Top + bottom on each non-outer, non-inner tube.\"},{\"label\":\"Chain sprocket (small)\",\"quantity\":4,\"note\":\"Coaxial with each big pinion, smaller diameter.\"},{\"label\":\"Chain loop\",\"quantity\":2,\"note\":\"One closed loop per non-outer, non-inner tube; top↔bottom sprockets.\"},{\"label\":\"Drive screw\",\"quantity\":1,\"note\":\"Acme thread, fixed in Y, rotates to drive member 1.\"},{\"label\":\"Travelling nut\",\"quantity\":1,\"note\":\"Bonded to member 1 bottom cap; climbs the screw.\"}],\"scad\":\"// Telescopic Rack-and-Pinion + Chain — assembly source.\\n// Parts emitted by the 'telescopic-chain-77' entry in\\n// scadRegistry.ts. Identical to mechanism-76 except:\\n//   • No intermediate gears (no middle big/small along Y).\\n//   • Each big pinion carries a coaxial smaller sprocket.\\n//   • A chain loop on each tube ties top sprocket ↔ bottom sprocket,\\n//     enforcing in-phase rotation of the top + bottom big pinions.\\n\",\"equations\":\"## Lift ratio\\n\\nSame as Mechanism 76. Driving the carrier (k=1) by stroke h via the screw, member k rises by\\n\\n$$ h_k = (k-1) \\\\cdot h $$\\n\\n## Chain coupling\\n\\nThe chain on tube k wraps the top and bottom small sprockets (both of pitch radius r_s). Because both sprockets are rigid with their respective big pinions, the chain enforces\\n\\n$$ \\\\varphi_{top} = \\\\varphi_{bot} $$\\n\\nso the top and bottom big pinions stay in phase without a through-shaft. The chain ratio is 1:1 (same sprocket on each end) — its job is phase-locking, not torque conversion.\",\"notes\":\"Derived from Mechanism 76. The chain + sprocket pair replaces the rigid through-shaft coupling that 76 needed between each tube's top and bottom pinions. Removing the intermediate gear train clears the rack span between top and bottom; only the end pinions engage the racks now, so the rack engagement is concentrated at the ends rather than distributed along the full height.\"},{\"slug\":\"sliding-gate-78\",\"name\":\"Sliding Gate — Horizontal Mechanism 77 (Mechanism 78)\",\"subtitle\":\"Mechanism 77 laid on its side to push/pull a sliding gate panel along a ground rail\",\"description\":\"Horizontal application of the Mechanism 77 telescoping rack-and-pinion + chain unit. The mechanism is rotated 90° so its long telescoping axis runs along the gate-travel direction (X). The screw end is anchored to a fixed steel frame; the innermost tube carries a gate panel on its far end. Driving the screw extends the mechanism — pushing the gate CLOSED across the opening; reversing retracts the mechanism and PULLS the gate OPEN. The gate slides along a ground-mounted steel rail.\",\"status\":\"in-progress\",\"tags\":[\"rack\",\"pinion\",\"gear\",\"chain\",\"sprocket\",\"telescopic\",\"sliding-gate\",\"horizontal\",\"mechanism-78\"],\"mechanismId\":78,\"parameters\":[{\"id\":\"N\",\"label\":\"Number of stages (walls)\",\"default\":4,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Mechanism\",\"description\":\"Total nested members. Stroke = (N−1) × stroke-per-stage.\"},{\"id\":\"cylHeight\",\"label\":\"Member length\",\"default\":600,\"min\":40,\"max\":2000,\"step\":5,\"unit\":\"mm\",\"group\":\"Mechanism\"},{\"id\":\"maxStroke\",\"label\":\"Stroke per stage\",\"default\":500,\"min\":20,\"max\":1800,\"step\":5,\"unit\":\"mm\",\"group\":\"Mechanism\"},{\"id\":\"wallT\",\"label\":\"Wall (square-tube) thickness\",\"default\":5,\"min\":1,\"max\":15,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Mechanism\"},{\"id\":\"screwR\",\"label\":\"Drive screw radius\",\"default\":6,\"min\":2,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Mechanism\"}],\"tree\":[{\"id\":\"sliding-gate-78\",\"label\":\"Sliding Gate (R\u0026P + Chain, horizontal)\",\"children\":[{\"id\":\"fixed-frame\",\"label\":\"Fixed mounting frame (inner block)\",\"color\":\"#3a3a3a\"},{\"id\":\"fixed-frame-outer\",\"label\":\"Fixed mounting frame (outer ring)\",\"color\":\"#2a2a2a\"},{\"id\":\"ground-rail\",\"label\":\"Ground rail\",\"color\":\"#666666\"},{\"id\":\"gate-panel\",\"label\":\"Gate panel (attached to innermost tube)\",\"color\":\"#6b4423\"},{\"id\":\"screw\",\"label\":\"Drive screw (fixed, rotates)\",\"color\":\"#cc3333\"},{\"id\":\"nut\",\"label\":\"Nut on bottom cap of member 1\",\"color\":\"#cc8866\"},{\"id\":\"wall-0\",\"label\":\"Member 0 — outermost (fixed)\",\"color\":\"#aab0b8\"},{\"id\":\"wall-1\",\"label\":\"Member 1 — carrier (screw-driven)\",\"color\":\"#3b82f6\"},{\"id\":\"wall-2\",\"label\":\"Member 2\",\"color\":\"#a78bfa\"},{\"id\":\"wall-3\",\"label\":\"Member 3 — innermost (output)\",\"color\":\"#5eead4\"},{\"id\":\"pinions\",\"label\":\"Big pinions (top + bottom per tube)\",\"color\":\"#f59e0b\"},{\"id\":\"sprockets\",\"label\":\"Chain sprockets (coaxial with pinions)\",\"color\":\"#d97706\"},{\"id\":\"chains\",\"label\":\"Chain loops (top↔bottom per tube)\",\"color\":\"#444444\"}]}],\"bom\":[{\"label\":\"Fixed mounting frame\",\"quantity\":1,\"note\":\"Steel plate; anchors screw + outer tube at the frame end.\"},{\"label\":\"Ground rail\",\"quantity\":1,\"note\":\"Steel beam under the gate panel; supports the gate weight.\"},{\"label\":\"Gate panel\",\"quantity\":1,\"note\":\"Wood panel bolted to the innermost tube's far end.\"},{\"label\":\"Mechanism 77 unit\",\"quantity\":1,\"note\":\"Telescoping R\u0026P + chain (see Mechanism 77 BOM).\"}],\"scad\":\"// Sliding Gate — Mechanism 77 laid horizontally.\\n// All Mechanism 77 parts are emitted by the 'sliding-gate-78' entry in\\n// scadRegistry.ts via the shared buildTelescopicChainParts() helper,\\n// nested under a rotated container so the telescoping axis maps to\\n// world X (gate-travel direction). Adds gate panel, ground rail, and\\n// fixed frame on top.\\n\",\"equations\":\"## Gate travel\\n\\nSame kinematics as Mechanism 77. With N stages, screw-driven stroke h on the carrier produces gate travel\\n\\n$$ x_{gate} = (N-1) \\\\cdot h $$\\n\\nFor the default 4 stages × 500 mm/stage, the gate covers a 1.5 m opening from a frame that is itself only ~600 mm long.\",\"notes\":\"The gate hangs from the innermost tube's far end. The ground rail bears the gate's weight so the mechanism only has to handle longitudinal push/pull, not the vertical load. The fixed frame must absorb the full pushing force when closing against a stop.\"},{\"slug\":\"cylindrical-belt-dispenser\",\"name\":\"Cylindrical Belt Dispenser\",\"subtitle\":\"Vertical cylinder with an inclined belt conveyor inside — dispenses out a side slot\",\"description\":\"Novel dispenser study. A vertical cylindrical container with an open top and closed bottom holds the bulk material. Inside, a belt conveyor runs at an angle from the lower-back to the upper-front, lifting material up the incline and dispensing it through a rectangular exit slot cut in the cylinder wall at the upper pulley. First pass: static geometry only — drive, animation, and flighting / paddles to be added in subsequent steps.\",\"status\":\"in-progress\",\"tags\":[\"dispenser\",\"cylinder\",\"belt-conveyor\",\"inclined\",\"wip\"],\"parameters\":[{\"id\":\"cylInnerR\",\"label\":\"Cylinder inner radius\",\"default\":60,\"min\":20,\"max\":250,\"step\":1,\"unit\":\"mm\",\"group\":\"Container\"},{\"id\":\"cylH\",\"label\":\"Cylinder height\",\"default\":200,\"min\":50,\"max\":800,\"step\":1,\"unit\":\"mm\",\"group\":\"Container\"},{\"id\":\"wallT\",\"label\":\"Wall thickness\",\"default\":3,\"min\":1,\"max\":12,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Container\"},{\"id\":\"floorT\",\"label\":\"Floor thickness\",\"default\":3,\"min\":1,\"max\":12,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Container\"},{\"id\":\"pulleyR\",\"label\":\"Pulley radius\",\"default\":12,\"min\":4,\"max\":60,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Belt\"},{\"id\":\"beltW\",\"label\":\"Belt width\",\"default\":30,\"min\":5,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Belt\",\"description\":\"Belt width along the pulley axis (Z).\"},{\"id\":\"beltT\",\"label\":\"Belt thickness\",\"default\":1.5,\"min\":0.5,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Belt\"},{\"id\":\"tiltDeg\",\"label\":\"Belt tilt angle\",\"default\":35,\"min\":0,\"max\":75,\"step\":1,\"unit\":\"°\",\"group\":\"Belt\",\"description\":\"Inclination of the belt from horizontal. 0 = flat across the cylinder; higher = steeper lift.\"},{\"id\":\"beltSpan\",\"label\":\"Pulley centre-to-centre\",\"default\":100,\"min\":20,\"max\":600,\"step\":1,\"unit\":\"mm\",\"group\":\"Belt\",\"description\":\"Distance between the two pulley centres along the belt axis.\"},{\"id\":\"exitHeight\",\"label\":\"Exit slot height\",\"default\":40,\"min\":5,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Exit slot\",\"description\":\"Vertical height of the side opening cut in the cylinder wall at the upper pulley.\"},{\"id\":\"exitWidth\",\"label\":\"Exit slot width\",\"default\":36,\"min\":5,\"max\":300,\"step\":1,\"unit\":\"mm\",\"group\":\"Exit slot\",\"description\":\"Width of the side opening along the pulley axis (Z).\"},{\"id\":\"shaftR\",\"label\":\"Shaft radius\",\"default\":4,\"min\":1.5,\"max\":12,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Cantilever shaft radius. Shaft extends from each pulley through the +Z wall to an external bearing.\"},{\"id\":\"bossR\",\"label\":\"Wall boss radius\",\"default\":18,\"min\":6,\"max\":60,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Outer radius of the boss around each shaft. Must clear the outermost labyrinth ring.\"},{\"id\":\"bossIn\",\"label\":\"Boss inside protrusion\",\"default\":8,\"min\":2,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"How far the boss reaches into the cavity. Carries the stator labyrinth grooves.\"},{\"id\":\"bossOut\",\"label\":\"Boss outside protrusion\",\"default\":6,\"min\":2,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"How far the boss protrudes outside the wall. Seats the external bearing block.\"},{\"id\":\"labyrinthRings\",\"label\":\"Labyrinth rings\",\"default\":2,\"min\":1,\"max\":5,\"step\":1,\"group\":\"Shaft \u0026 seal\",\"description\":\"Number of concentric groove/ridge pairs in the non-contact powder seal.\"},{\"id\":\"labyrinthDepth\",\"label\":\"Labyrinth depth\",\"default\":3,\"min\":1,\"max\":8,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Axial depth of each labyrinth groove (and matching rotor ridge).\"},{\"id\":\"labyrinthClear\",\"label\":\"Labyrinth clearance\",\"default\":0.4,\"min\":0.15,\"max\":1.5,\"step\":0.05,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Axial + radial gap between rotor ridges and stator grooves.\"},{\"id\":\"bearingOR\",\"label\":\"Bearing OD radius\",\"default\":11,\"min\":4,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Outer radius of the external sealed bearing (11 mm = 608 bearing, OD 22).\"},{\"id\":\"bearingW\",\"label\":\"Bearing width\",\"default\":7,\"min\":3,\"max\":15,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Shaft \u0026 seal\",\"description\":\"Width of the external bearing along the shaft axis.\"}],\"tree\":[{\"id\":\"cylindrical-belt-dispenser\",\"label\":\"Cylindrical Belt Dispenser\",\"children\":[{\"id\":\"container\",\"label\":\"Cylindrical container\",\"color\":\"#b0b0b0\"},{\"id\":\"belt\",\"label\":\"Belt loop\",\"color\":\"#2a2a2a\"},{\"id\":\"pulley-lower\",\"label\":\"Lower pulley (intake)\",\"color\":\"#c0a060\"},{\"id\":\"pulley-upper\",\"label\":\"Upper pulley (discharge)\",\"color\":\"#c0a060\"},{\"id\":\"shaft-lower\",\"label\":\"Lower shaft (cantilever)\",\"color\":\"#888a90\"},{\"id\":\"shaft-upper\",\"label\":\"Upper shaft (cantilever)\",\"color\":\"#888a90\"},{\"id\":\"labyrinth-lower\",\"label\":\"Labyrinth rotor — lower\",\"color\":\"#6a8aa8\"},{\"id\":\"labyrinth-upper\",\"label\":\"Labyrinth rotor — upper\",\"color\":\"#6a8aa8\"},{\"id\":\"bearing-block-lower\",\"label\":\"Bearing block — lower\",\"color\":\"#404040\"},{\"id\":\"bearing-block-upper\",\"label\":\"Bearing block — upper\",\"color\":\"#404040\"}]}],\"bom\":[{\"label\":\"Cylindrical container\",\"quantity\":1,\"note\":\"Open-top tube with closed bottom, side exit slot, and integrated shaft bosses with stator labyrinth grooves.\"},{\"label\":\"Belt loop\",\"quantity\":1,\"note\":\"Single closed belt wrapped around both pulleys.\"},{\"label\":\"Pulley\",\"quantity\":2,\"note\":\"Identical lower (intake) and upper (discharge) pulleys, bored to fit the shaft.\"},{\"label\":\"Cantilever shaft\",\"quantity\":2,\"note\":\"Pulley shaft, one per pulley. Cantilevered: supported only by the external bearing.\"},{\"label\":\"Labyrinth rotor\",\"quantity\":2,\"note\":\"Mounted on each shaft just inside the wall; ridges interleave with stator grooves for a non-contact powder seal.\"},{\"label\":\"External bearing block\",\"quantity\":2,\"note\":\"Houses a sealed deep-groove bearing (e.g. 608). Lives entirely outside the cavity.\"},{\"label\":\"Sealed deep-groove bearing\",\"quantity\":2,\"note\":\"Bought-in part. Default sized for 608 (8 × 22 × 7 mm).\"}],\"scad\":\"// Cylindrical belt dispenser — multi-part assembly.\\n// Parts emitted by the 'cylindrical-belt-dispenser' entry in\\n// scadRegistry.ts (each compiled to STL via openscad-wasm):\\n//   container            — vertical cylinder, open top, closed bottom,\\n//                          side exit slot, and integrated wall bosses\\n//                          with stator labyrinth grooves.\\n//   belt                 — closed loop band wrapped around both pulleys.\\n//   pulley-lower/upper   — pulleys with shaft bore.\\n//   shaft-lower/upper    — cantilever shafts through the +Z wall.\\n//   labyrinth-lower/upper — rotors carrying ridges that interleave with\\n//                          the stator grooves (non-contact powder seal).\\n//   bearing-block-*      — external housings for sealed bearings.\\n\",\"notes\":\"Cross-contamination control: bearings live entirely outside the cavity. Each pulley shaft is cantilevered through a wall boss; the boss carries concentric labyrinth grooves on its inside face that interleave with ridges on a rotor mounted on the shaft, forming a non-contact seal suitable for dry powders. For sticky / wet or very fine media, a felt or PTFE wiper can be added at the rotor face — not yet modelled. Belt rotation / animation, drive (motor + coupling), and belt flights / cleats remain to be added.\"},{\"slug\":\"olds-elevator\",\"name\":\"Olds Elevator\",\"subtitle\":\"Vertical screw elevator with a rotating tube and internal helix — gentle, sealed, handles all particulate solids\",\"description\":\"Olds-style elevator (Peter Olds, AU). Unlike a conventional screw conveyor — rotating helix on a central shaft inside a stationary tube — the Olds elevator rotates the outer tube itself with the helix fixed to its inner wall, and leaves the centre completely hollow. Material enters at the bottom from a stationary intake hopper, rides the helix flutes up the tube wall, and is discharged out a side port in a stationary shroud at the top. Bearings live only at the very ends of the tube, fully outside the product zone. Suited to powders, granules, pellets and fragile media; low power per tonne lifted; minimal particle degradation; easy to seal.\",\"status\":\"in-progress\",\"tags\":[\"elevator\",\"conveyor\",\"screw\",\"olds\",\"particulate\",\"powder\",\"sealed\",\"wip\"],\"parameters\":[{\"id\":\"tubeInnerR\",\"label\":\"Tube inner radius\",\"default\":25,\"min\":8,\"max\":120,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Rotating tube\"},{\"id\":\"tubeWallT\",\"label\":\"Tube wall thickness\",\"default\":2,\"min\":0.8,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Rotating tube\"},{\"id\":\"tubeH\",\"label\":\"Tube length\",\"default\":250,\"min\":40,\"max\":2000,\"step\":5,\"unit\":\"mm\",\"group\":\"Rotating tube\",\"description\":\"Axial length of the rotating tube, governing total lift.\"},{\"id\":\"helixPitch\",\"label\":\"Helix pitch\",\"default\":40,\"min\":8,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Helix\",\"description\":\"Axial distance per one full turn of the helix.\"},{\"id\":\"helixInnerR\",\"label\":\"Helix inner radius\",\"default\":8,\"min\":0,\"max\":60,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Helix\",\"description\":\"Inner edge of the helical flight. The hollow centre is empty — no shaft.\"},{\"id\":\"flightT\",\"label\":\"Flight thickness\",\"default\":2,\"min\":0.6,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Helix\"},{\"id\":\"hopperR\",\"label\":\"Hopper radius\",\"default\":60,\"min\":15,\"max\":250,\"step\":1,\"unit\":\"mm\",\"group\":\"Intake hopper\"},{\"id\":\"hopperH\",\"label\":\"Hopper height\",\"default\":40,\"min\":10,\"max\":300,\"step\":1,\"unit\":\"mm\",\"group\":\"Intake hopper\"},{\"id\":\"hopperWallT\",\"label\":\"Hopper wall thickness\",\"default\":2,\"min\":0.8,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Intake hopper\"},{\"id\":\"hopperFloorT\",\"label\":\"Hopper floor thickness\",\"default\":3,\"min\":1,\"max\":10,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Intake hopper\"},{\"id\":\"tubeBottomGap\",\"label\":\"Tube-to-floor gap\",\"default\":5,\"min\":1,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Intake hopper\",\"description\":\"Clearance between the rotating tube bottom and the hopper floor — material flows in through this gap.\"},{\"id\":\"intakeWindowH\",\"label\":\"Intake window height\",\"default\":25,\"min\":5,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Intake hopper\",\"description\":\"Axial height of the single intake window cut into the bottom of the rotating tube.\"},{\"id\":\"intakeWindowAngle\",\"label\":\"Window angular width\",\"default\":90,\"min\":10,\"max\":270,\"step\":5,\"unit\":\"°\",\"group\":\"Intake hopper\",\"description\":\"Angular width of the intake window. Wider = more material scooped per revolution; narrower = stiffer tube.\"},{\"id\":\"dischargeR\",\"label\":\"Shroud radius\",\"default\":45,\"min\":10,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\"},{\"id\":\"dischargeH\",\"label\":\"Shroud height\",\"default\":55,\"min\":10,\"max\":250,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\"},{\"id\":\"dischargeWallT\",\"label\":\"Shroud wall thickness\",\"default\":2,\"min\":0.8,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Discharge shroud\"},{\"id\":\"dischargeRoofT\",\"label\":\"Shroud roof thickness\",\"default\":3,\"min\":1,\"max\":10,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Discharge shroud\"},{\"id\":\"dischargeOverlap\",\"label\":\"Shroud overlap\",\"default\":25,\"min\":2,\"max\":100,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"How far the rotating tube extends up into the discharge shroud cavity. Must be greater than the sleeve height so the slanted floor sits below the sleeve.\"},{\"id\":\"dischargeOutW\",\"label\":\"Outlet width\",\"default\":30,\"min\":5,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"Width of the side discharge slot (along Z).\"},{\"id\":\"dischargeOutH\",\"label\":\"Outlet height\",\"default\":20,\"min\":5,\"max\":150,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"Vertical height of the side discharge slot.\"},{\"id\":\"shroudFloorRise\",\"label\":\"Floor rise\",\"default\":10,\"min\":1,\"max\":40,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"Vertical rise of the slanted internal floor from the spout (+X) side up to the far (-X) side. Material lands here from the sleeve and slides down to the outlet.\"},{\"id\":\"spoutLen\",\"label\":\"Spout length\",\"default\":40,\"min\":0,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"How far the tubular spout projects outward from the +X face. Carries the dispensed material away from the body, like a jug mouth.\"},{\"id\":\"sleeveH\",\"label\":\"Top sleeve height\",\"default\":10,\"min\":3,\"max\":100,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Top sleeve\",\"description\":\"Axial height of the slanting sleeve welded to the top of the rotating tube. Should be ≤ the shroud overlap so the sleeve sits inside the discharge cavity.\"},{\"id\":\"sleeveBottomR\",\"label\":\"Sleeve bottom radius\",\"default\":40,\"min\":10,\"max\":200,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Top sleeve\",\"description\":\"Outer radius at the wide (bottom) edge of the slanting sleeve. Must fit inside the shroud inner radius with clearance.\"},{\"id\":\"sleeveWallT\",\"label\":\"Sleeve wall thickness\",\"default\":1.5,\"min\":0.6,\"max\":6,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Top sleeve\"},{\"id\":\"rodR\",\"label\":\"Spider rod radius\",\"default\":2,\"min\":0.8,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\"},{\"id\":\"rodCount\",\"label\":\"Spider rod count\",\"default\":4,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Spider \u0026 drive shaft\",\"description\":\"Number of rods welded to the top rim of the tube; bend inward to meet at a central apex.\"},{\"id\":\"rodVertH\",\"label\":\"Rod vertical run\",\"default\":8,\"min\":0,\"max\":80,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\",\"description\":\"How far each rod climbs straight up from the tube top before bending inward.\"},{\"id\":\"rodConvergeH\",\"label\":\"Rod converge height\",\"default\":12,\"min\":2,\"max\":80,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\",\"description\":\"Additional vertical rise of the inward-bent segment, from the knee to the central apex.\"},{\"id\":\"driveRodR\",\"label\":\"Drive rod radius\",\"default\":4,\"min\":1.5,\"max\":15,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\",\"description\":\"Radius of the central rod that exits the shroud roof — this is the external drive input.\"},{\"id\":\"driveRodLen\",\"label\":\"Drive rod length\",\"default\":60,\"min\":10,\"max\":300,\"step\":1,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\",\"description\":\"Length of the central drive rod above the spider apex. Must be long enough to clear the shroud roof.\"},{\"id\":\"labyrinthRings\",\"label\":\"Labyrinth rings\",\"default\":2,\"min\":1,\"max\":5,\"step\":1,\"group\":\"Top labyrinth seal\",\"description\":\"Number of concentric groove/ridge pairs in the non-contact powder seal at the drive-rod exit.\"},{\"id\":\"labyrinthDepth\",\"label\":\"Labyrinth depth\",\"default\":2,\"min\":0.5,\"max\":6,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Top labyrinth seal\",\"description\":\"Axial depth of each groove cut into the shroud roof. Must be less than the roof thickness.\"},{\"id\":\"labyrinthClear\",\"label\":\"Labyrinth clearance\",\"default\":0.4,\"min\":0.15,\"max\":1.5,\"step\":0.05,\"unit\":\"mm\",\"group\":\"Top labyrinth seal\",\"description\":\"Axial + radial gap between rotor ridges and stator grooves.\"},{\"id\":\"labyrinthDiscR\",\"label\":\"Rotor disc radius\",\"default\":12,\"min\":5,\"max\":60,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Top labyrinth seal\",\"description\":\"Outer radius of the labyrinth rotor disc fused to the drive rod. Must clear the cavity wall.\"},{\"id\":\"labyrinthDiscT\",\"label\":\"Rotor disc thickness\",\"default\":2,\"min\":0.6,\"max\":10,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Top labyrinth seal\"}],\"tree\":[{\"id\":\"olds-elevator\",\"label\":\"Olds Elevator\",\"children\":[{\"id\":\"hopper\",\"label\":\"Intake hopper (stationary)\",\"color\":\"#a0a0a0\"},{\"id\":\"rotating-tube\",\"label\":\"Rotating body (tube + sleeve + spider + drive rod)\",\"color\":\"#8090a0\"},{\"id\":\"helix\",\"label\":\"Internal helix\",\"color\":\"#c0a060\"},{\"id\":\"discharge-shroud\",\"label\":\"Discharge shroud (stationary)\",\"color\":\"#707070\"}]}],\"bom\":[{\"label\":\"Intake hopper\",\"quantity\":1,\"note\":\"Stationary open-top bowl. Material level sits above the rotating tube's open bottom.\"},{\"label\":\"Rotating body\",\"quantity\":1,\"note\":\"Outer tube + slanting top deflector sleeve + N-rod top spider + central drive rod, all welded into one rigid assembly. The helix is welded inside in production but is modelled as a separate part.\"},{\"label\":\"Internal helix\",\"quantity\":1,\"note\":\"Single helical flight. Pitch and flight thickness drive throughput and gentleness.\"},{\"label\":\"Discharge shroud\",\"quantity\":1,\"note\":\"Stationary cap around the tube top with a side outlet.\"},{\"label\":\"Sealed bearings\",\"quantity\":2,\"note\":\"Bought-in. Live entirely outside the product path; locate the rotating tube at top and bottom. Not yet modelled.\"}],\"scad\":\"// Olds elevator — multi-part assembly.\\n// Parts emitted by the 'olds-elevator' entry in scadRegistry.ts\\n// (each compiled to STL via openscad-wasm):\\n//   hopper            — stationary intake bowl at the base.\\n//   rotating-tube     — vertical outer tube; rotates about Y.\\n//   helix             — internal helical flight; slides into the tube.\\n//   discharge-shroud  — stationary cap at the top with a +X side outlet.\\n\",\"notes\":\"Olds elevator: outer tube rotates with the helix attached to its inner wall; the centre is hollow (no shaft). Material is lifted along the tube wall by the rotating helix flutes; bearings live at the tube ends, outside the product zone. Better than the belt-in-cylinder concept for fine cohesive powders and broad particulate range; gentler than a conventional auger because no central shaft shears the material. Drive (motor + transmission), top/bottom bearings, and rotation animation remain to be added.\"},{\"slug\":\"telescopic-rackpinion-banana-79\",\"name\":\"Telescopic Cylinder — Rack \u0026 Pinion, Banana Tubes (Mechanism 79)\",\"subtitle\":\"Mechanism 76 variant with curved (banana-shaped) tube bodies\",\"description\":\"Same telescoping rack-and-pinion cascade as Mechanism 76, but the tube members curve along a circular arc in the X-Y plane (curving toward −X) instead of being straight prisms. Used to study how a bent stage shape affects packing, clearance, and the rack/pinion engagement. For this preview only the outermost tube (wall-0) is curved by default; set `bendOnlyFirst = 0` to curve every wall.\",\"status\":\"in-progress\",\"tags\":[\"rack\",\"pinion\",\"gear\",\"telescopic\",\"lift\",\"banana\",\"curved\",\"mechanism-79\"],\"mechanismId\":79,\"parameters\":[{\"id\":\"N\",\"label\":\"Number of stages (walls)\",\"default\":4,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Stages\",\"description\":\"Total nested members. Each beyond the outer adds a +1× stage.\"},{\"id\":\"cylHeight\",\"label\":\"Member height\",\"default\":560,\"min\":40,\"max\":2000,\"step\":5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"maxStroke\",\"label\":\"Stroke per stage\",\"default\":480,\"min\":20,\"max\":1800,\"step\":5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"wallT\",\"label\":\"Wall (square-tube) thickness\",\"default\":5,\"min\":1,\"max\":15,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Body\"},{\"id\":\"boreR\",\"label\":\"Cylindrical bore radius\",\"default\":6,\"min\":2,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Body\"},{\"id\":\"pinR\",\"label\":\"Guide-rod (pin) radius\",\"default\":5.5,\"min\":1,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Body\"},{\"id\":\"pinionR\",\"label\":\"Pinion pitch radius\",\"default\":14,\"min\":5,\"max\":40,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Gears\"},{\"id\":\"toothDepth\",\"label\":\"Tooth depth\",\"default\":2.5,\"min\":0.5,\"max\":8,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Gears\"},{\"id\":\"toothPitch\",\"label\":\"Tooth pitch\",\"default\":6,\"min\":2,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Gears\"},{\"id\":\"screwR\",\"label\":\"Drive screw radius\",\"default\":6,\"min\":2,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Drive\"},{\"id\":\"bendRadius\",\"label\":\"Bend radius\",\"default\":1200,\"min\":200,\"max\":8000,\"step\":10,\"unit\":\"mm\",\"group\":\"Body\",\"description\":\"Circular-arc bend radius for the banana tubes. Smaller = more curved.\"},{\"id\":\"bendOnlyFirst\",\"label\":\"Bend only outermost tube\",\"default\":1,\"min\":0,\"max\":1,\"step\":1,\"group\":\"Body\",\"description\":\"1 = bend wall-0 only (preview). 0 = bend every tube.\"},{\"id\":\"sweepDeg\",\"label\":\"Sweep angle\",\"default\":60,\"min\":5,\"max\":180,\"step\":1,\"unit\":\"°\",\"group\":\"Body\",\"description\":\"Arc sweep of each ring sector.\"},{\"id\":\"ringRadialT\",\"label\":\"Ring radial thickness\",\"default\":36,\"min\":4,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Body\"},{\"id\":\"ringGap\",\"label\":\"Gap between rings\",\"default\":36,\"min\":4,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Body\",\"description\":\"Radial gap between the inner ring’s outer face and the outer ring’s inner face.\"},{\"id\":\"pinionFaceClr\",\"label\":\"Ring 1 Z-offset\",\"default\":30,\"min\":0,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Body\",\"description\":\"Z displacement of the middle ring so its end faces poke out past rings 0/2, exposing a face to mount the pinion shaft.\"},{\"id\":\"shaftAngleADeg\",\"label\":\"Shaft A sweep angle\",\"default\":-28,\"min\":-90,\"max\":90,\"step\":1,\"unit\":\"°\",\"group\":\"Body\",\"description\":\"Sweep angle of the first pinion shaft, from the sweep midline. Sits at ring 1’s mean radius near the −sweep end.\"},{\"id\":\"shaftAngleBDeg\",\"label\":\"Shaft B sweep angle\",\"default\":28,\"min\":-90,\"max\":90,\"step\":1,\"unit\":\"°\",\"group\":\"Body\",\"description\":\"Sweep angle of the second pinion shaft, near the +sweep end.\"},{\"id\":\"maxSweep1Deg\",\"label\":\"Ring 1 max sweep\",\"default\":50,\"min\":1,\"max\":180,\"step\":1,\"unit\":\"°\",\"group\":\"Drive\",\"description\":\"Peak angular sweep of ring 1 over the animation. Ring 2 follows via the rolling constraint.\"}],\"tree\":[{\"id\":\"telescopic-rackpinion-banana-79\",\"label\":\"Telescopic Cylinder (R\u0026P, banana)\",\"children\":[{\"id\":\"ring-sector-0\",\"label\":\"Ring 0 — innermost, teeth outward\",\"color\":\"#aab0b8\"},{\"id\":\"ring-sector-1\",\"label\":\"Ring 1 — teeth both arcs (driver)\",\"color\":\"#3b82f6\"},{\"id\":\"ring-sector-2\",\"label\":\"Ring 2 — teeth both arcs\",\"color\":\"#a78bfa\"},{\"id\":\"ring-sector-3\",\"label\":\"Ring 3 — teeth both arcs\",\"color\":\"#10b981\"},{\"id\":\"ring-sector-4\",\"label\":\"Ring 4 — teeth both arcs\",\"color\":\"#ec4899\"},{\"id\":\"ring-sector-5\",\"label\":\"Ring 5 — outermost, teeth inward\",\"color\":\"#f97316\"},{\"id\":\"pinion-inner\",\"label\":\"Ring 1 pinion A\",\"color\":\"#f59e0b\"},{\"id\":\"pinion-outer\",\"label\":\"Ring 1 pinion B\",\"color\":\"#f59e0b\"},{\"id\":\"pinion2-a\",\"label\":\"Ring 2 pinion A\",\"color\":\"#f59e0b\"},{\"id\":\"pinion2-b\",\"label\":\"Ring 2 pinion B\",\"color\":\"#f59e0b\"},{\"id\":\"pinion3-a\",\"label\":\"Ring 3 pinion A\",\"color\":\"#f59e0b\"},{\"id\":\"pinion3-b\",\"label\":\"Ring 3 pinion B\",\"color\":\"#f59e0b\"},{\"id\":\"pinion4-a\",\"label\":\"Ring 4 pinion A\",\"color\":\"#f59e0b\"},{\"id\":\"pinion4-b\",\"label\":\"Ring 4 pinion B\",\"color\":\"#f59e0b\"}]}],\"bom\":[{\"label\":\"Curved square-tube member\",\"quantity\":4,\"note\":\"Square outer cross-section bent along a circular arc.\"},{\"label\":\"Guide rod / pin\",\"quantity\":3,\"note\":\"One per non-outer member.\"},{\"label\":\"Rack strip\",\"quantity\":6,\"note\":\"Inner-face + outer-face racks on adjacent member pairs.\"},{\"label\":\"Pinion\",\"quantity\":16,\"note\":\"4 per non-innermost, non-outermost member.\"},{\"label\":\"Drive screw\",\"quantity\":1,\"note\":\"Acme thread, rotates to drive member 1.\"},{\"label\":\"Travelling nut\",\"quantity\":1,\"note\":\"Bonded to member 1 bottom cap; climbs the screw.\"}],\"scad\":\"// Telescopic Rack-and-Pinion Cylinder, banana variant.\\n// Parts are generated by the 'telescopic-rackpinion-banana-79' entry in\\n// scadRegistry.ts. The builder calls the Mechanism 76 builder and then\\n// wraps each wall's SCAD body in a slice-and-arc transform that bends\\n// the tube along a circular arc in the X-Y plane (toward −X).\\n\",\"equations\":\"## Bend\\n\\nEach tube body is bent along a circular arc of radius $R$ in the X-Y plane (center at $(-R, 0, 0)$). A point originally at height $y$ in the straight tube maps to\\n\\n$$ \\\\theta = -y / R, \\\\quad (x, y) \\\\mapsto (-(R - R\\\\cos\\\\theta),\\\\ -R\\\\sin\\\\theta) $$\\n\\nand the local frame rotates by $\\\\theta$ about Z so the tube cross-section stays normal to the arc tangent.\\n\\n## Lift ratio\\n\\nUnchanged from Mechanism 76:\\n\\n$$ h_{out} = (N-1) \\\\cdot h $$\",\"notes\":\"$1d9\"},{\"slug\":\"gate-arm-array-80\",\"name\":\"Gate from Telescoping-Arm Array (Mechanism 80)\",\"subtitle\":\"Multiple sliding-gate-78 arms stacked side-by-side; the extended members BECOME the gate\",\"description\":\"Variant of the sliding-gate-78 assembly stripped down to its essentials: the screw-end mounting block + the telescoping rack+pinion+chain arm. The arm is rotated +90° about world X compared to gate-78 so its long axis is vertical. M such arms are placed side-by-side along world Z; when they extend, their tubes form a curtain-like gate. No separate gate panel, no ground rail, no second frame block — the arms themselves are the gate.\",\"status\":\"in-progress\",\"tags\":[\"rack\",\"pinion\",\"chain\",\"telescopic\",\"gate\",\"array\",\"mechanism-80\"],\"mechanismId\":80,\"parameters\":[{\"id\":\"armCount\",\"label\":\"Number of arms\",\"default\":34,\"min\":1,\"max\":128,\"step\":1,\"group\":\"Array\",\"description\":\"How many telescoping arms stacked along world Y. Default fills the gate-78 column height.\"},{\"id\":\"armPitchY\",\"label\":\"Arm spacing (Y)\",\"default\":80,\"min\":20,\"max\":1000,\"step\":1,\"unit\":\"mm\",\"group\":\"Array\",\"description\":\"Centre-to-centre spacing between adjacent arms along world Y.\"},{\"id\":\"N\",\"label\":\"Stages per arm\",\"default\":4,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Mechanism\",\"description\":\"Number of nested tubes in each arm.\"},{\"id\":\"cylHeight\",\"label\":\"Tube length\",\"default\":560,\"min\":40,\"max\":2000,\"step\":5,\"unit\":\"mm\",\"group\":\"Mechanism\"},{\"id\":\"maxStroke\",\"label\":\"Stroke per stage\",\"default\":480,\"min\":20,\"max\":1800,\"step\":5,\"unit\":\"mm\",\"group\":\"Mechanism\"}],\"tree\":[{\"id\":\"gate-arm-array-80\",\"label\":\"Gate (array of arms)\"}],\"bom\":[{\"label\":\"Telescoping arm assembly (Mechanism 77)\",\"quantity\":1,\"note\":\"One arm.\"},{\"label\":\"Fixed mounting frame block\",\"quantity\":1,\"note\":\"Screw-end block, same as sliding-gate-78.\"}],\"scad\":\"// Gate-arm array. Each arm is a Mechanism-77 telescopic chain\\n// rotated about world X by +90° relative to sliding-gate-78. M\\n// instances are emitted with per-arm id prefixes 'arm-{i}/'.\\n\",\"notes\":\"Each arm extends independently — they could be driven by the same shaft (mechanical sync) or by independent motors (software sync). With all arms extended together, their innermost members reach world X = cylHeight + (N−1)·maxStroke and the row of arms spans the opening.\\n\\nTODO:\\n1. Add coupling between arms (shared drive shaft or chain) so they extend in lockstep.\\n2. Consider adding thin web panels between adjacent innermost tubes to close the gaps between arms for a solid gate face.\\n3. Reconcile with deployable-tent / fancy-door applications from Mechanism 79 — this is the \\\"arm-array\\\" alternative to a single cascade of curved sectors.\"}]}]}]],null],null],null]},[null,[\"$\",\"$L1da\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\",\"assemblies\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L1db\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$unde
