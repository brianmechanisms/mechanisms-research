d the\n    cam rotation θ ∈ [0, 2π). The class method\n    Mechanism70c.computeCamProfile('S1' | 'S2', N) returns the sampled\n    {θ, r} pairs for each ridge.\n\n  • cam axis X     = max(x_S2) + r2min        (from class.getCamAxisX)\n  • Φ(t)           = 2π · t                   (cam rotation)\n  • slider X (mm)  = (x_S_i(t) - camAxisX) · worldScale\n\nRIDGE GEOMETRY  (the inverse of the v-slot variant's cut groove)\n\n  • Ridge centreline = pitch curve.\n  • Ridge cross-section: rectangular, thickness ridgeT (radial) × height ridgeH (along shaft).\n  • Follower: a pair of rollers (radius rollerR · worldScale) on either side of the ridge.\n  • Required follower-pair gap (centre-to-centre):\n        rollerPairGap = ridgeT + 2·(rollerR · worldScale) + clearance\n\nKEY DIMENSIONS (defaults)\n\n  rod radius              rodR              = 8 mm\n  rod length              rodLength         = 600 mm\n  shaft diameter          shaftDia          = 8 mm  (608ZZ bore)\n  shaft length            shaftLength       = frameDepth + 60 mm\n  cam plate thickness     camPlateThickness = 6 mm\n  cam plate outer dia     camPlateOuterDia  = 80 mm\n  ridge radial t          ridgeT            = 4 mm\n  ridge height            ridgeH            = 8 mm\n  world scale          = 200 mm/unit\n  L1 (world)           = 0.7\n  L2 (world)           = 1.2\n  parW (world)         = 0.08\n  rollerR (world)      = 0.06   →  1.2 mm × worldScale (= 12 mm) … see notes\n  r2min (world)        = 0.2\n\nSLIDER WHEEL LAYOUT (3-wheel preloaded triangle)\n\n  • Two grooved wheels on +Y side of the rod, spaced wheelSpacingX along rail axis.\n  • One grooved wheel on −Y side at the carriage centre.\n  • Wheel groove inner radius ≈ rodR + 0.5 mm clearance.\n"])</script><script>self.__next_f.push([1,"17:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$La\",null,{\"buildId\":\"kLSarSvfrR1QgiLgxZbPf\",\"assetPrefix\":\"/mechanisms-research\",\"urlParts\":[\"\",\"designs\",\"assemblies\",\"\"],\"initialTr cad\u003e;\\n\\nrail_length = 600;\\n\\nmodule walker_70_3() {\\n  v_slot_2020(rail_length);\\n  // TODO: bracket, shaft, cam plate, sliders, links, feet.\\n}\\n\\nwalker_70_3();\\n\",\"bom\":[{\"componentSlug\":\"v-slot-2020\",\"quantity\":1,\"note\":\"Main rail, 600 mm\"},{\"componentSlug\":\"rail-mid-clamp\",\"quantity\":1,\"note\":\"Mid-rail saddle, mounts to chassis\"},{\"componentSlug\":\"rail-slider-vwheel\",\"quantity\":4,\"note\":\"S1..S4, identical hardware\"},{\"label\":\"Cantilever bracket\",\"quantity\":1},{\"label\":\"Cam shaft\",\"quantity\":1,\"note\":\"D-flat at drive end\"},{\"componentSlug\":\"cam-plate-70-3\",\"quantity\":1,\"note\":\"Synthesised from Mechanism 70.3\"},{\"label\":\"Link 1 bar\",\"quantity\":8,\"note\":\"Parallelogram leg (2 per slider × 4 sliders)\"},{\"label\":\"Link 2 bar\",\"quantity\":4,\"note\":\"Single bar (1 per S2/S4 × 2 sides)\"},{\"label\":\"Joint plate\",\"quantity\":4,\"note\":\"One per (upper/lower × left/right) joint\"},{\"label\":\"Foot peg\",\"quantity\":4,\"note\":\"One per tracer\"}],\"notes\":\"v1: cantilever shaft, single cam plate with two grooves, all four sliders share one rail. Drive end is a D-flat — coupling / bevel pinion comes later. See Mechanism 70.3 for the kinematic equations driving the cam profile.\"},{\"slug\":\"walker-70-3-rod\",\"name\":\"Walker Prototype (Mechanism 70.3, Rod variant)\",\"subtitle\":\"Round-rod rail, 3-wheel sliders, cam ASSEMBLY with raised ridges\",\"description\":\"Second physical realisation of Mechanism 70.3. Round rod replaces the 2020 v-slot. Sliders ride the rod on three grooved wheels in a preloaded triangle. The cam is an assembly — shaft, backing plate, and two screw-on raised ridges — and each follower is a pair of rollers (inner + outer) straddling its ridge.\",\"status\":\"in-progress\",\"tags\":[\"walker\",\"cam-driven\",\"mechanism-70.3\",\"rod\",\"ridge-cam\"],\"mechanismId\":70.3,\"parameters\":[{\"id\":\"worldScale\",\"label\":\"World scale\",\"default\":200 ute crossbar\",\"description\":\"Three-pole exploratory assembly. Pole A rises from the ground. Pole B is a horizontal stub fixed to A partway up. Pole C sits at the top of A, pinned through its midpoint by a revolute joint so it can rock about the world X axis.\",\"status\":\"in-progress\",\"tags\":[\"pharaas\",\"rails\",\"revolute\",\"sketch\"],\"parameters\":[{\"id\":\"poleT\",\"label\":\"Pole cross-section\",\"default\":20,\"min\":10,\"max\":40,\"step\":1,\"unit\":\"mm\",\"group\":\"Pharaas\",\"description\":\"Edge of the square cross-section used by all three poles.\"},{\"id\":\"poleATopMargin\",\"label\":\"Pole A top margin\",\"default\":15,\"min\":0,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Pharaas\",\"description\":\"How far pole A extends above the shaft hole. Pole A height is derived as (joint Y) + this.\"},{\"id\":\"poleCH\",\"label\":\"Pole C height\",\"default\":350,\"min\":50,\"max\":2000,\"step\":10,\"unit\":\"mm\",\"group\":\"Pharaas\",\"description\":\"Top pole of the BC line, on the same central axis as B. Pinned at its midpoint to pole A (revolute joint).\"},{\"id\":\"poleCJointY\",\"label\":\"Shaft height (Y)\",\"default\":625,\"min\":100,\"max\":2000,\"step\":10,\"unit\":\"mm\",\"group\":\"Pharaas\",\"description\":\"Height of the revolute shaft above the ground. Pole C is centered on this Y; pole B rises from the ground to just below it.\"},{\"id\":\"bcClearance\",\"label\":\"B↔C clearance\",\"default\":5,\"min\":0,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Pharaas\",\"description\":\"Small air gap between the top of pole B and the base of pole C.\"},{\"id\":\"shaftR\",\"label\":\"Joint shaft radius\",\"default\":4,\"min\":1,\"max\":12,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Pharaas\",\"description\":\"Radius of the shaft through the revolute joint (Ø8 default = M8).\"},{\"id\":\"frameSpace\",\"label\":\"Frame Z spacing\",\"default\":120,\"min\":10,\"max\":500,\"step\":1,\"unit\":\"mm\",\"group\":\"Pharaas\",\"description\":\"
