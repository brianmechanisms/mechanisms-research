ew elevator with a rotating tube and internal helix — gentle, sealed, handles all particulate solids\",\"description\":\"Olds-style elevator (Peter Olds, AU). Unlike a conventional screw conveyor — rotating helix on a central shaft inside a stationary tube — the Olds elevator rotates the outer tube itself with the helix fixed to its inner wall, and leaves the centre completely hollow. Material enters at the bottom from a stationary intake hopper, rides the helix flutes up the tube wall, and is discharged out a side port in a stationary shroud at the top. Bearings live only at the very ends of the tube, fully outside the product zone. Suited to powders, granules, pellets and fragile media; low power per tonne lifted; minimal particle degradation; easy to seal.\",\"status\":\"in-progress\",\"tags\":[\"elevator\",\"conveyor\",\"screw\",\"olds\",\"particulate\",\"powder\",\"sealed\",\"wip\"],\"parameters\":[{\"id\":\"tubeInnerR\",\"label\":\"Tube inner radius\",\"default\":25,\"min\":8,\"max\":120,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Rotating tube\"},{\"id\":\"tubeWallT\",\"label\":\"Tube wall thickness\",\"default\":2,\"min\":0.8,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Rotating tube\"},{\"id\":\"tubeH\",\"label\":\"Tube length\",\"default\":250,\"min\":40,\"max\":2000,\"step\":5,\"unit\":\"mm\",\"group\":\"Rotating tube\",\"description\":\"Axial length of the rotating tube, governing total lift.\"},{\"id\":\"helixPitch\",\"label\":\"Helix pitch\",\"default\":40,\"min\":8,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Helix\",\"description\":\"Axial distance per one full turn of the helix.\"},{\"id\":\"helixInnerR\",\"label\":\"Helix inner radius\",\"default\":8,\"min\":0,\"max\":60,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Helix\",\"description\":\"Inner edge of the helical flight. The hollow centre is empty — no shaft.\"},{\"id\":\"flightT\",\"label\":\"Flight thickness\",\"default\":2,\"min\":0.6,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Helix\"},{\"id\":\"hopperR\",\"label\":\"Hopper radius\",\"default\":60,\"min\":15,\"max\":250,\"step\":1,\"unit\":\"mm\",\"group\":\"Intake hopper\"},{\"id\":\"hopperH\",\"label\":\"Hopper height\",\"default\":40,\"min\":10,\"max\":300,\"step\":1,\"unit\":\"mm\",\"group\":\"Intake hopper\"},{\"id\":\"hopperWallT\",\"label\":\"Hopper wall thickness\",\"default\":2,\"min\":0.8,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Intake hopper\"},{\"id\":\"hopperFloorT\",\"label\":\"Hopper floor thickness\",\"default\":3,\"min\":1,\"max\":10,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Intake hopper\"},{\"id\":\"tubeBottomGap\",\"label\":\"Tube-to-floor gap\",\"default\":5,\"min\":1,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Intake hopper\",\"description\":\"Clearance between the rotating tube bottom and the hopper floor — material flows in through this gap.\"},{\"id\":\"intakeWindowH\",\"label\":\"Intake window height\",\"default\":25,\"min\":5,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Intake hopper\",\"description\":\"Axial height of the single intake window cut into the bottom of the rotating tube.\"},{\"id\":\"intakeWindowAngle\",\"label\":\"Window angular width\",\"default\":90,\"min\":10,\"max\":270,\"step\":5,\"unit\":\"°\",\"group\":\"Intake hopper\",\"description\":\"Angular width of the intake window. Wider = more material scooped per revolution; narrower = stiffer tube.\"},{\"id\":\"dischargeR\",\"label\":\"Shroud radius\",\"default\":45,\"min\":10,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\"},{\"id\":\"dischargeH\",\"label\":\"Shroud height\",\"default\":55,\"min\":10,\"max\":250,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\"},{\"id\":\"dischargeWallT\",\"label\":\"Shroud wall thickness\",\"default\":2,\"min\":0.8,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Discharge shroud\"},{\"id\":\"dischargeRoofT\",\"label\":\"Shroud roof thickness\",\"default\":3,\"min\":1,\"max\":10,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Discharge shroud\"},{\"id\":\"dischargeOverlap\",\"label\":\"Shroud overlap\",\"default\":25,\"min\":2,\"max\":100,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"How far the rotating tube extends up into the discharge shroud cavity. Must be greater than the sleeve height so the slanted floor sits below the sleeve.\"},{\"id\":\"dischargeOutW\",\"label\":\"Outlet width\",\"default\":30,\"min\":5,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"Width of the side discharge slot (along Z).\"},{\"id\":\"dischargeOutH\",\"label\":\"Outlet height\",\"default\":20,\"min\":5,\"max\":150,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"Vertical height of the side discharge slot.\"},{\"id\":\"shroudFloorRise\",\"label\":\"Floor rise\",\"default\":10,\"min\":1,\"max\":40,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"Vertical rise of the slanted internal floor from the spout (+X) side up to the far (-X) side. Material lands here from the sleeve and slides down to the outlet.\"},{\"id\":\"spoutLen\",\"label\":\"Spout length\",\"default\":40,\"min\":0,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Discharge shroud\",\"description\":\"How far the tubular spout projects outward from the +X face. Carries the dispensed material away from the body, like a jug mouth.\"},{\"id\":\"sleeveH\",\"label\":\"Top sleeve height\",\"default\":10,\"min\":3,\"max\":100,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Top sleeve\",\"description\":\"Axial height of the slanting sleeve welded to the top of the rotating tube. Should be ≤ the shroud overlap so the sleeve sits inside the discharge cavity.\"},{\"id\":\"sleeveBottomR\",\"label\":\"Sleeve bottom radius\",\"default\":40,\"min\":10,\"max\":200,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Top sleeve\",\"description\":\"Outer radius at the wide (bottom) edge of the slanting sleeve. Must fit inside the shroud inner radius with clearance.\"},{\"id\":\"sleeveWallT\",\"label\":\"Sleeve wall thickness\",\"default\":1.5,\"min\":0.6,\"max\":6,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Top sleeve\"},{\"id\":\"rodR\",\"label\":\"Spider rod radius\",\"default\":2,\"min\":0.8,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\"},{\"id\":\"rodCount\",\"label\":\"Spider rod count\",\"default\":4,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Spider \u0026 drive shaft\",\"description\":\"Number of rods welded to the top rim of the tube; bend inward to meet at a central apex.\"},{\"id\":\"rodVertH\",\"label\":\"Rod vertical run\",\"default\":8,\"min\":0,\"max\":80,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\",\"description\":\"How far each rod climbs straight up from the tube top before bending inward.\"},{\"id\":\"rodConvergeH\",\"label\":\"Rod converge height\",\"default\":12,\"min\":2,\"max\":80,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\",\"description\":\"Additional vertical rise of the inward-bent segment, from the knee to the central apex.\"},{\"id\":\"driveRodR\",\"label\":\"Drive rod radius\",\"default\":4,\"min\":1.5,\"max\":15,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\",\"description\":\"Radius of the central rod that exits the shroud roof — this is the external drive input.\"},{\"id\":\"driveRodLen\",\"label\":\"Drive rod length\",\"default\":60,\"min\":10,\"max\":300,\"step\":1,\"unit\":\"mm\",\"group\":\"Spider \u0026 drive shaft\",\"description\":\"Length of the central drive rod above the spider apex. Must be long enough to clear the shroud roof.\"},{\"id\":\"labyrinthRings\",\"label\":\"Labyrinth rings\",\"default\":2,\"min\":1,\"max\":5,\"step\":1,\"group\":\"Top labyrinth seal\",\"description\":\"Number of concentric groove/ridge pairs in the non-contact powder seal at the drive-rod exit.\"},{\"id\":\"labyrinthDepth\",\"label\":\"Labyrinth depth\",\"default\":2,\"min\":0.5,\"max\":6,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Top labyrinth seal\",\"description\":\"Axial depth of each groove cut into the shroud roof. Must be less than the roof thickness.\"},{\"id\":\"labyrinthClear\",\"label\":\"Labyrinth clearance\",\"default\":0.4,\"min\":0.15,\"max\":1.5,\"step\":0.05,\"unit\":\"mm\",\"group\":\"Top labyrinth seal\",\"description\":\"Axial + radial gap between rotor ridges and stator grooves.\"},{\"id\":\"labyrinthDiscR\",\"label\":\"Rotor disc radius\",\"default\":12,\"min\":5,\"max\":60,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Top labyrinth seal\",\"description\":\"Outer radius of the labyrinth rotor disc fused to the drive rod. Must clear the cavity wall.\"},{\"id\":\"labyrinthDiscT\",\"label\":\"Rotor disc thickness\",\"default\":2,\"min\":0.6,\"max\":10,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Top labyrinth seal\"}],\"tree\":[{\"id\":\"olds-elevator\",\"label\":\"Olds Elevator\",\"children\":[{\"id\":\"hopper\",\"label\":\"Intake hopper (stationary)\",\"color\":\"#a0a0a0\"},{\"id\":\"rotating-tube\",\"label\":\"Rotating body (tube + sleeve + spider + drive rod)\",\"color\":\"#8090a0\"},{\"id\":\"helix\",\"label\":\"Internal helix\",\"color\":\"#c0a060\"},{\"id\":\"discharge-shroud\",\"label\":\"Discharge shroud (stationary)\",\"color\":\"#707070\"}]}],\"bom\":[{\"label\":\"Intake hopper\",\"quantity\":1,\"note\":\"Stationary open-top bowl. Material level sits above the rotating tube's open bottom.\"},{\"label\":\"Rotating body\",\"quantity\":1,\"note\":\"Outer tube + slanting top deflector sleeve + N-rod top spider + central drive rod, all welded into one rigid assembly. The helix is welded inside in production but is modelled as a separate part.\"},{\"label\":\"Internal helix\",\"quantity\":1,\"note\":\"Single helical flight. Pitch and flight thickness drive throughput and gentleness.\"},{\"label\":\"Discharge shroud\",\"quantity\":1,\"note\":\"Stationary cap around the tube top with a side outlet.\"},{\"label\":\"Sealed bearings\",\"quantity\":2,\"note\":\"Bought-in. Live entirely outside the product path; locate the rotating tube at top and bottom. Not yet modelled.\"}],\"scad\":\"// Olds elevator — multi-part assembly.\\n// Parts emitted by the 'olds-elevator' entry in scadRegistry.ts\\n// (each compiled to STL via openscad-wasm):\\n//   hopper            — stationary intake bowl at the base.\\n//   rotating-tube     — vertical outer tube; rotates about Y.\\n//   helix             — internal helical flight; slides into the tube.\\n//   discharge-shroud  — stationary cap at the top with a +X side outlet.\\n\",\"notes\":\"Olds elevator: outer tube rotates with the helix attached to its inner wall; the centre is hollow (no shaft). Material is lifted along the tube wall by the rotating helix flutes; bearings live at the tube ends, outside the product zone. Better than the belt-in-cylinder concept for fine cohesive powders and broad particulate range; gentler than a conventional auger because no central shaft shears the material. Drive (motor + transmission), top/bottom bearings, and rotation animation remain to be added.\"}}],null],null],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\",\"assemblies\",\"children\",\"$e\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\",\"assemblies\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"r
