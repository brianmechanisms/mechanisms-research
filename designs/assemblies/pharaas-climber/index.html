w cross-section thickness perpendicular to the pole axis.\"},{\"id\":\"jawW\",\"label\":\"Jaw width\",\"default\":24,\"min\":8,\"max\":80,\"step\":1,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"Jaw width along the pole axis (the contact patch length).\"},{\"id\":\"ringGap\",\"label\":\"Clamp ring gap\",\"default\":90,\"min\":30,\"max\":400,\"step\":5,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"Distance between the two clamp rings of one mode (top↔bottom on pole A; fwd↔aft on pole C).\"},{\"id\":\"stride\",\"label\":\"Inchworm stride\",\"default\":70,\"min\":10,\"max\":300,\"step\":5,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"How far the body advances per inchworm cycle (per ring step).\"},{\"id\":\"openD\",\"label\":\"Jaw open distance\",\"default\":8,\"min\":1,\"max\":40,\"step\":1,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"How far each jaw retracts from the pole when released.\"},{\"id\":\"startY\",\"label\":\"Start Y on pole A\",\"default\":200,\"min\":0,\"max\":2000,\"step\":10,\"unit\":\"mm\",\"group\":\"Climber\",\"description\":\"Body Y at the beginning of the cycle (vertical-mode start).\"}],\"tree\":[{\"id\":\"rail-pole-A\",\"label\":\"Rail: pole A (vertical)\",\"color\":\"#8a8a8e\"},{\"id\":\"rail-pole-C\",\"label\":\"Rail: pole C (horizontal)\",\"color\":\"#d4845a\"},{\"id\":\"climber-body\",\"label\":\"Climber body\",\"color\":\"#4a6fa5\"},{\"id\":\"climber/v-pair-p\",\"label\":\"Vertical pair (+X side of pole A)\",\"color\":\"#60a5fa\",\"children\":[{\"id\":\"climber/v-pair-p/rod\",\"label\":\"Linking rod\",\"color\":\"#3a6fb0\"},{\"id\":\"climber/v-pair-p/jaw-top\",\"label\":\"Top jaw\",\"color\":\"#60a5fa\"},{\"id\":\"climber/v-pair-p/jaw-bot\",\"label\":\"Bottom jaw\",\"color\":\"#60a5fa\"}]},{\"id\":\"climber/v-pair-n\",\"label\":\"Vertical pair (−X side of pole A)\",\"color\":\"#60a5fa\",\"children\":[{\"id\":\"climber/v-pair-n/rod\",\"label\":\"Linking rod\",\"color\":\"#3a6fb0\"},{\"id\":\"climber/
