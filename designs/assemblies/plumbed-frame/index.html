NPS pipe frame with one union for loop closure\",\"description\":\"Reusable sub-assembly: four NPS Sch. 40 pipes + four 90° elbows forming a rectangle in the XZ plane, with one pipe split by a pipe union so the threaded-pipe loop is physically buildable. Used as the base of walker-70-3-rod-cross-v2. Defaults render at 200×600 mm centerline-to-centerline in 1/2\\\" NPS; any parent assembly that instantiates this sub-assembly can override the frame dimensions through its own equations file.\",\"status\":\"in-progress\",\"tags\":[\"subassembly\",\"frame\",\"plumbing\",\"NPS\",\"union\"],\"kind\":\"subassembly\",\"tree\":[{\"id\":\"frame-pipes\",\"label\":\"Pipes\",\"children\":[{\"id\":\"frame-pipe-x-front\",\"label\":\"X-pipe · front (+Z) — split by union\",\"children\":[{\"id\":\"pipe-x-front-east\",\"label\":\"East half (+X side)\",\"color\":\"#8a8a8a\"},{\"id\":\"union-x-front\",\"label\":\"Pipe union\",\"color\":\"#8a8a85\"},{\"id\":\"pipe-x-front-west\",\"label\":\"West half (−X side)\",\"color\":\"#8a8a8a\"}]},{\"id\":\"pipe-x-rear\",\"label\":\"X-pipe · rear (−Z)\",\"color\":\"#8a8a8a\"},{\"id\":\"pipe-z-right\",\"label\":\"Z-pipe · right (+X)\",\"color\":\"#8a8a8a\"},{\"id\":\"pipe-z-left\",\"label\":\"Z-pipe · left (−X)\",\"color\":\"#8a8a8a\"}]},{\"id\":\"frame-corners\",\"label\":\"Corner elbows\",\"children\":[{\"id\":\"elbow-pp\",\"label\":\"Elbow · PP (+X, +Z)\",\"color\":\"#8a8a85\"},{\"id\":\"elbow-pn\",\"label\":\"Elbow · PN (+X, −Z)\",\"color\":\"#8a8a85\"},{\"id\":\"elbow-nn\",\"label\":\"Elbow · NN (−X, −Z)\",\"color\":\"#8a8a85\"},{\"id\":\"elbow-np\",\"label\":\"Elbow · NP (−X, +Z)\",\"color\":\"#8a8a85\"}]}],\"equationsFile\":{\"globals\":{\"frameEdgeX\":{\"value\":200,\"unit\":\"mm\",\"group\":\"Frame\",\"description\":\"Centerline-to-centerline distance between the two long Z-pipes (the short axis of the rectangular frame).\"},\"frameEdgeZ\":{\"value\":600,\"unit\":\"mm\",\"group\":\"Frame\",\"description\":\"Centerline-to-centerline distance between the two short X-pipes (the long axis of the rectangular frame).\"},\"pipeNpsSize\":{\"value\":0.5,\"unit\":\"in\",\"group\":\"Plumbing\",\"description\":\"NPS size for every frame pipe and elbow. Numeric here for use in equations; instance stdRefs spell it as a string.\"},\"elbowCenterToEnd\":{\"value\":28,\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"ANSI B16.3 'A' dimension for the 1/2\\\" NPS 90° elbow: distance from centerline intersection to leg end face. Drives pipe cut lengths.\"},\"elbowThreadEngagement\":{\"value\":9.6,\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"Effective NPT thread length (L2) for 1/2\\\" NPS. The pipe screws this far into each elbow, so the cut length includes 2 × this on top of the centerline-to-centerline distance minus 2 × A.\"},\"unionCenterToEnd\":{\"value\":25,\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"Half-length of a 1/2\\\" NPS pipe union: distance from the central sealing plane to the face of one socket. The union consumes 2 × this of centerline distance on whichever pipe it sits on (minus the thread engagement, which lives inside the socket — same accounting as the elbow).\"},\"unionThreadEngagement\":{\"value\":9.6,\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"Effective NPT thread length for the pipe-into-union joint. Same value as the elbow engagement (same pipe thread).\"},\"pipeVisualEngagement\":{\"value\":3,\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"How far the visible pipe geometry extends past each fitting's socket face into the fitting's interior. Smaller than the real thread engagement (9.6 mm for 1/2\\\" NPS) so the straight pipe doesn't visibly clash with the elbow's curved bore. The actual bench cut length still uses the full thread engagement; this is purely a rendering tweak.\"},\"pipeHubBoltCrossHoleR\":{\"value\":0,\"unit\":\"mm\",\"group\":\"Hub bolts\",\"description\":\"Radius of the cross-drilled holes through the Z-pipes at the hub-clamp bolt positions. Default 0 = no holes. Parents that add hubs override this with the bolt shank radius.\"},\"pipeHubBoltCrossHoleOffsetZ\":{\"value\":0,\"unit\":\"mm\",\"group\":\"Hub bolts\",\"description\":\"Offset (along the pipe's local Z axis = world Z when hub is at z=0) from the hub centerpoint to each bolt position. Two holes are drilled per pipe at ±this offset. Default 0; parents that add hubs override.\"}},\"equations\":{\"halfFrameX\":{\"expr\":\"frameEdgeX / 2\",\"unit\":\"mm\",\"group\":\"Frame\",\"description\":\"Half the short-axis centerline span; used to position pipes and elbows symmetrically about the origin.\"},\"halfFrameZ\":{\"expr\":\"frameEdgeZ / 2\",\"unit\":\"mm\",\"group\":\"Frame\",\"description\":\"Half the long-axis centerline span.\"},\"effectiveJoinDepth\":{\"expr\":\"elbowCenterToEnd - elbowThreadEngagement\",\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"How far each elbow shortens the pipe cut: the elbow consumes A mm of centerline distance but the threaded portion of the pipe (threadEngagement) lives inside the elbow, so the visible pipe length is reduced by (A − engagement) at each end.\"},\"pipeLengthX\":{\"expr\":\"frameEdgeX - 2 * elbowCenterToEnd + 2 * pipeVisualEngagement\",\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"Visible length of each of the two short X-pipes. Extends `pipeVisualEngagement` mm past each elbow's socket face into the elbow's interior so the joint reads as engaged. Real cut length on the bench = (frameEdgeX − 2·elbowCenterToEnd) + 2·elbowThreadEngagement.\"},\"pipeLengthZ\":{\"expr\":\"frameEdgeZ - 2 * elbowCenterToEnd + 2 * pipeVisualEngagement\",\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"Visible length of each of the two long Z-pipes. Real cut length on the bench = (frameEdgeZ − 2·elbowCenterToEnd) + 2·elbowThreadEngagement.\"},\"pipeXFrontHalfCenterlineSpan\":{\"expr\":\"(frameEdgeX - 2 * elbowCenterToEnd - 2 * unionCenterToEnd) / 2\",\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"Centerline length of one half of the split X-pipe at +Z (socket-face to socket-face).\"},\"pipeXFrontHalfCutLength\":{\"expr\":\"pipeXFrontHalfCenterlineSpan + 2 * pipeVisualEngagement\",\"unit\":\"mm\",\"group\":\"Plumbing\",\"description\":\"Visible pipe length for each half of the +Z X-pipe. Includes `pipeVisualEngagement` mm of insertion past the elbow socket and the union socket. Real bench cut length = centerline span + elbowThreadEngagement + unionThreadEngagement.\"},\"pipeXFrontHalfMidX\":{\"expr\":\"(halfFrameX - elbowCenterToEnd + unionCenterToEnd) / 2\",\"unit\":\"mm\",\"group\":\"Frame\",\"description\":\"World X coordinate of the centerpoint of one half of the split X-pipe at +Z (east half is at +this, west half at −this).\"},\"elbowInsetX\":{\"expr\":\"halfFrameX - elbowCenterToEnd\",\"unit\":\"mm\",\"group\":\"Frame\",\"description\":\"X coordinate of each elbow's origin (corner X minus A); the elbow's bend center then lands on the centerline rectangle corner.\"},\"elbowInsetZ\":{\"expr\":\"halfFrameZ - elbowCenterToEnd\",\"unit\":\"mm\",\"group\":\"Frame\",\"description\":\"Z coordinate of each elbow's origin (corner Z minus A).\"},\"deg90\":{\"expr\":\"pi / 2\",\"unit\":\"rad\",\"group\":\"Math\",\"description\":\"\"},\"deg180\":{\"expr\":\"pi\",\"unit\":\"rad\",\"group\":\"Math\",\"description\":\"\"},\"deg270\":{\"expr\":\"3 * pi / 2\",\"unit\":\"rad\",\"group\":\"Math\",\"description\":\"\"}},\"instances\":{\"pipe-x-front-east\":{\"group\":\"Frame pipes\",\"description\":\"East half of the split X-pipe at +Z, between corner-PP and the union at center. Splitting this pipe with a union is what makes the frame's threaded-pipe loop physically assemblable — three sides of the rectangle are built first, then the union is brought together as the last step without rotating either pipe.\",\"stdRef\":{\"family\":\"pipe\",\"size\":\"0.5\",\"overrides\":{\"length\":\"pipeXFrontHalfCutLength\"}},\"transform\":{\"position\":[\"pipeXFrontHalfMidX\",0,\"halfFrameZ\"]}},\"union-x-front\":{\"group\":\"Frame pipes\",\"description\":\"Pipe union at the centre of the X-pipe at +Z. Each half threads into one socket independently; the hex nut tightens against the ground sealing face to clamp the two halves together.\",\"stdRef\":{\"family\":\"union\",\"size\":\"0.5\"},\"transform\":{\"position\":[0,0,\"halfFrameZ\"]}},\"pipe-x-front-west\":{\"group\":\"Frame pipes\",\"description\":\"West half of the split X-pipe at +Z, between the union at center and corner-NP.\",\"stdRef\":{\"family\":\"pipe\",\"size\":\"0.5\",\"overrides\":{\"length\":\"pipeXFrontHalfCutLength\"}},\"transform\":{\"position\":[\"-pipeXFrontHalfMidX\",0,\"halfFrameZ\"]}},\"pipe-x-rear\":{\"group\":\"Frame pipes\",\"description\":\"Short X-pipe along the -Z edge of the frame.\",\"stdRef\":{\"family\":\"pipe\",\"size\":\"0.5\",\"overrides\":{\"length\":\"pipeLengthX\"}},\"transform\":{\"position\":[0,0,\"-halfFrameZ\"]}},\"pipe-z-right\":{\"group\":\"Frame pipes\",\"description\":\"Long Z-pipe along the +X edge of the frame, running between corner-PP and corner-PN. Cross-drilled at ±pipeHubBoltCrossHoleOffsetZ along its local X axis (= world Z) for the hub-clamp bolts; when no hubs are present, those overrides are 0 and the pipe has no cross holes.\",\"stdRef\":{\"family\":\"pipe\",\"size\":\"0.5\",\"overrides\":{\"length\":\"pipeLengthZ\",\"crossHole0X\":\"pipeHubBoltCrossHoleOffsetZ\",\"crossHole0R\":\"pipeHubBoltCrossHoleR\",\"crossHole1X\":\"-pipeHubBoltCrossHoleOffsetZ\",\"crossHole1R\":\"pipeHubBoltCrossHoleR\"}},\"transform\":{\"position\":[\"halfFrameX\",0,0],\"rotation\":[0,\"deg90\",0]}},\"pipe-z-left\":{\"group\":\"Frame pipes\",\"description\":\"Long Z-pipe along the -X edge of the frame.\",\"stdRef\":{\"family\":\"pipe\",\"size\":\"0.5\",\"overrides\":{\"length\":\"pipeLengthZ\",\"crossHole0X\":\"pipeHubBoltCrossHoleOffsetZ\",\"crossHole0R\":\"pipeHubBoltCrossHoleR\",\"crossHole1X\":\"-pipeHubBoltCrossHoleOffsetZ\",\"crossHole1R\":\"pipeHubBoltCrossHoleR\"}},\"transform\":{\"position\":[\"-halfFrameX\",0,0],\"rotation\":[0,\"deg90\",0]}},\"elbow-pp\":{\"group\":\"Frame corners\",\"description\":\"Corner-PP elbow (+X, +Z corner). Two legs face -X (toward pipe-x-front) and -Z (toward pipe-z-right). Built from the catalog elbow rotated +90° about X (lifts the L-shape from the XY plane into the XZ plane). Three.js applies the rotation triple as intrinsic XYZ: after Rx the local Z axis points to world −Y, so the Z component of the rotation triple becomes the per-corner rotation about world −Y (i.e. clockwise when looking down at the floor from above).\",\"stdRef\":{\"family\":\"elbow90\",\"size\":\"0.5\"},\"transform\":{\"position\":[\"elbowInsetX\",0,\"elbowInsetZ\"],\"rotation\":[\"deg90\",0,0]}},\"elbow-pn\":{\"group\":\"Frame corners\",\"description\":\"Corner-PN elbow (+X, -Z). Legs face -X (toward pipe-x-rear) and +Z (toward pipe-z-right). Intrinsic XYZ rotation [Rx=+90°, Ry=0, Rz=-90°] (the Rz component is rotation about post-Rx local Z = world -Y, which equals +90° of rotation about world Y).\",\"stdRef\":{\"family\":\"elbow90\",\"size\":\"0.5\"},\"transform\":{\"position\":[\"elbowInsetX\",0,\"-elbowInsetZ\"],\"rotation\":[\"deg90\",0,\"-deg90\"]}},\"elbow-nn\":{\"group\":\"Frame corners\",\"description\":\"Corner-NN elbow (-X, -Z). Legs face +X (toward pipe-x-rear) and +Z (toward pipe-z-left). Intrinsic XYZ rotation [Rx=+90°, Ry=0, Rz=180°].\",\"stdRef\":{\"family\":\"elbow90\",\"size\":\"0.5\"},\"transform\":{\"position\":[\"-elbowInsetX\",0,\"-elbowInsetZ\"],\"rotation\":[\"deg90\",0,\"deg180\"]}},\"elbow-np\":{\"group\":\"Frame corners\",\"description\":\"Corner-NP elbow (-X, +Z). Legs face +X (toward pipe-x-front) and -Z (toward pipe-z-left). Intrinsic XYZ rotation [Rx=+90°, Ry=0, Rz=+90°].\",\"stdRef\":{\"family\":\"elbow90\",\"size\":\"0.5\"},\"transform\":{\"position\":[\"-elbowInsetX\",0,\"elbowInsetZ\"],\"rotation\":[\"deg90\",0,\"deg90\"]}}}},\"scad\":\"// Driven from lib
