 (early prototype)\",\"subtitle\":\"Cam-follower carriage with plain-bearing wheels (no bearings) — boss-as-washer on each wheel\",\"description\":\"Cam-follower carriage. Two plates sandwich a Ø(2·rodR) rod, separated by three toroidal-groove wheels (two on −Z, one on +Z) that triangulate against the rod. Wheels run directly on plain axles; each wheel has two coaxial side bosses acting as integral washers so the grooved rim never rubs the plate. A pair of follower rollers on the +Y plate straddle a cam rib of thickness camRibThickness, at x = ±(camRibThickness/2 + rollerR). Sized to match the cam-shaft sub-assembly’s ridgeT / ridgeRollerR / ridgeH so the rollers land on the cam pitch curve when the two are composed. Lower part count than the bearinged variant; intended for the early prototype build.\",\"status\":\"in-progress\",\"tags\":[\"subassembly\",\"slider\",\"cam-follower\",\"walker-base\",\"prototype\"],\"kind\":\"subassembly\",\"tree\":[{\"id\":\"slider\",\"label\":\"Rod slider (bushed)\",\"children\":[{\"id\":\"upper-plate\",\"label\":\"Upper plate (+Y)\",\"color\":\"#60a5fa\"},{\"id\":\"lower-plate\",\"label\":\"Lower plate (−Y)\",\"color\":\"#60a5fa\"},{\"id\":\"wheel-1\",\"label\":\"Wheel 1 (−X, −Z)\",\"color\":\"#202024\"},{\"id\":\"wheel-2\",\"label\":\"Wheel 2 (+X, −Z)\",\"color\":\"#202024\"},{\"id\":\"wheel-3\",\"label\":\"Wheel 3 (X=0, +Z)\",\"color\":\"#202024\"},{\"id\":\"axle-1\",\"label\":\"Axle 1\",\"color\":\"#9a9a9e\"},{\"id\":\"axle-2\",\"label\":\"Axle 2\",\"color\":\"#9a9a9e\"},{\"id\":\"axle-3\",\"label\":\"Axle 3\",\"color\":\"#9a9a9e\"},{\"id\":\"follower-shaft-neg\",\"label\":\"Follower shaft (−X)\",\"color\":\"#9a9a9e\"},{\"id\":\"follower-roller-neg\",\"label\":\"Follower roller (−X)\",\"color\":\"#d4845a\"},{\"id\":\"follower-shaft-pos\",\"label\":\"Follower shaft (+X)\",\"color\":\"#9a9a9e\"},{\"id\":\"follower-roller-pos\",\"label\":\"Follower roller (+X)\",\"color\":\"#d4845a\"}]}],\"equationsFile\":{\"globals\":{\"rodR\":{\"value\":8,\"unit\":\"mm\",\"group\":\"Rod\",\"description\":\"Radius of the rod the slider's wheels groove around (Ø16 mm rod by default). Matches the legacy walker-rod default. When this slider is later mounted on a real frame member, set rodR to match that member's OD/2.\"},\"sliderPlateL\":{\"value\":60,\"unit\":\"mm\",\"group\":\"Plates\",\"description\":\"Plate length along the rod axis (local +X). Longer plates make the slider more rotationally stable but heavier.\"},\"sliderPlateW\":{\"value\":36,\"unit\":\"mm\",\"group\":\"Plates\",\"description\":\"Plate width along local +Z (the in-plate dimension perpendicular to the rod axis). Must exceed 2·wheelOffsetZ + a margin so the plate fully overhangs the wheels.\"},\"sliderPlateT\":{\"value\":4,\"unit\":\"mm\",\"group\":\"Plates\",\"description\":\"Plate thickness along local +Y (the small dimension).\"},\"wheelThickness\":{\"value\":6,\"unit\":\"mm\",\"group\":\"Wheels\",\"description\":\"Wheel thickness along its own axis (local +Y, between the plates). The toroidal groove takes ~half of this; the rest is the flanks.\"},\"wheelSpacingX\":{\"value\":36,\"unit\":\"mm\",\"group\":\"Wheels\",\"description\":\"X spacing between the two same-side wheels (the pair on −Z). The third wheel sits at x=0 on +Z; together they triangulate against the round rod.\"},\"wheelOffsetZ\":{\"value\":14,\"unit\":\"mm\",\"group\":\"Wheels\",\"description\":\"Z distance from the rod centerline to each wheel centerline. Must be \u003e rodR + a small clearance so the wheel groove can reach the rod without the wheel body hitting it.\"},\"wheelBossRadius\":{\"value\":3.5,\"unit\":\"mm\",\"group\":\"Wheels\",\"description\":\"Radius of the integral side boss on each wheel (the washer face that bears against the plate). Larger than axleRadius, smaller than the wheel's outer rim radius. ~2× axleRadius is typical.\"},\"wheelBossLength\":{\"value\":1.5,\"unit\":\"mm\",\"group\":\"Wheels\",\"description\":\"Axial length of each side boss (per side, along the wheel axis +Y). Sets the air gap between the wheel rim and the plate inner face.\"},\"axleRadius\":{\"value\":2,\"unit\":\"mm\",\"group\":\"Wheels\",\"description\":\"Plain-bearing axle radius. The wheel bore is sized 0.2 mm clear of this so it spins on the axle. M4-ish.\"},\"camRibThickness\":{\"value\":4,\"unit\":\"mm\",\"group\":\"Follower\",\"description\":\"Cam-rib thickness — drives follower-roller X spacing. The two rollers sit at x = ±(camRibThickness/2 + rollerR), straddling the rib. Must equal the cam-shaft's ridgeT.\"},\"rollerR\":{\"value\":2.7,\"unit\":\"mm\",\"group\":\"Follower\",\"description\":\"Follower-roller radius. Must equal the cam-shaft's ridgeRollerR so the rollers ride at the same pitch radius the cam profile is synthesised for.\"},\"rollerLen\":{\"value\":6,\"unit\":\"mm\",\"group\":\"Follower\",\"description\":\"Follower-roller length along its axis (the bit that contacts the rib's flank). Must equal the cam-shaft's ridgeH.\"},\"followerStandoff\":{\"value\":2,\"unit\":\"mm\",\"group\":\"Follower\",\"description\":\"Air gap between the +Y plate's outer face and the roller's near face. Provides clearance so the rib's tip doesn't kiss the plate.\"}},\"equations\":{},\"instances\":{}},\"scad\":\"// Driven from lib/data/designs/subassemblies/rod-slider-bushed/equations.json\",\"notes\":\"Sister variant rod-slider-bearinged swaps the bushed wheels for 624ZZ ball bearings and is the production variant.\"}}],null],null],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\",\"assemblies\",\"children\",\"$e\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"c
