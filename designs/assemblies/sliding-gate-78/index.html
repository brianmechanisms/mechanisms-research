nism 77 (Mechanism 78)\",\"subtitle\":\"Mechanism 77 laid on its side to push/pull a sliding gate panel along a ground rail\",\"description\":\"Horizontal application of the Mechanism 77 telescoping rack-and-pinion + chain unit. The mechanism is rotated 90° so its long telescoping axis runs along the gate-travel direction (X). The screw end is anchored to a fixed steel frame; the innermost tube carries a gate panel on its far end. Driving the screw extends the mechanism — pushing the gate CLOSED across the opening; reversing retracts the mechanism and PULLS the gate OPEN. The gate slides along a ground-mounted steel rail.\",\"status\":\"in-progress\",\"tags\":[\"rack\",\"pinion\",\"gear\",\"chain\",\"sprocket\",\"telescopic\",\"sliding-gate\",\"horizontal\",\"mechanism-78\"],\"mechanismId\":78,\"parameters\":[{\"id\":\"N\",\"label\":\"Number of stages (walls)\",\"default\":4,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Mechanism\",\"description\":\"Total nested members. Stroke = (N−1) × stroke-per-stage.\"},{\"id\":\"cylHeight\",\"label\":\"Member length\",\"default\":600,\"min\":40,\"max\":2000,\"step\":5,\"unit\":\"mm\",\"group\":\"Mechanism\"},{\"id\":\"maxStroke\",\"label\":\"Stroke per stage\",\"default\":500,\"min\":20,\"max\":1800,\"step\":5,\"unit\":\"mm\",\"group\":\"Mechanism\"},{\"id\":\"wallT\",\"label\":\"Wall (square-tube) thickness\",\"default\":5,\"min\":1,\"max\":15,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Mechanism\"},{\"id\":\"screwR\",\"label\":\"Drive screw radius\",\"default\":6,\"min\":2,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Mechanism\"}],\"tree\":[{\"id\":\"sliding-gate-78\",\"label\":\"Sliding Gate (R\u0026P + Chain, horizontal)\",\"children\":[{\"id\":\"fixed-frame\",\"label\":\"Fixed mounting frame (inner block)\",\"color\":\"#3a3a3a\"},{\"id\":\"fixed-frame-outer\",\"label\":\"Fixed mounting frame (outer ring)\",\"color\":\"#2a2a2a\"},{\"id\":\"ground-rail\",\"label\":\"Ground rail\",\"color\":\"#666666\"},{\"id\":\"gate-panel
