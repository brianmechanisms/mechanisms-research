pic Cylinder — Rack \u0026 Pinion + Chain Coupling (Mechanism 77)\",\"subtitle\":\"Mechanism 76 with top/bottom big pinions coupled by a chain on coaxial sprockets\",\"description\":\"Variant of Mechanism 76. Identical telescoping square tubes, racks, screw drive and stroke math. The intermediate gear train along Y is removed entirely (no middle big or small gears between top and bottom). Each remaining big pinion — only the TOP and the BOTTOM on every non-outer, non-inner tube — carries a smaller coaxial sprocket rigidly attached. A vertical chain loop on each tube wraps the top sprocket and bottom sprocket on that tube, locking them in phase. The chain replaces the through-shaft coupling that Mechanism 76 needed to keep top and bottom pinions on a tube synchronised.\",\"status\":\"in-progress\",\"tags\":[\"rack\",\"pinion\",\"gear\",\"chain\",\"sprocket\",\"telescopic\",\"lift\",\"doubler\",\"mechanism-77\"],\"mechanismId\":77,\"parameters\":[{\"id\":\"N\",\"label\":\"Number of stages (walls)\",\"default\":7,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Stages\",\"description\":\"Total nested members. Each beyond the outer adds a +1× stage.\"},{\"id\":\"cylHeight\",\"label\":\"Member height\",\"default\":560,\"min\":40,\"max\":2000,\"step\":5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"maxStroke\",\"label\":\"Stroke per stage\",\"default\":480,\"min\":20,\"max\":1800,\"step\":5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"wallT\",\"label\":\"Wall (square-tube) thickness\",\"default\":5,\"min\":1,\"max\":15,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Body\"},{\"id\":\"screwR\",\"label\":\"Drive screw radius\",\"default\":6,\"min\":2,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Drive\"}],\"tree\":[{\"id\":\"telescopic-chain-77\",\"label\":\"Telescopic Cylinder (R\u0026P + Chain)\",\"children\":[{\"id\":\"screw\",\"label\":\"Drive screw (fixed, rotates)\",\"color\":\"#cc3333\"},{\"id\":\"nut\",\"label\":\"Nut on bottom cap of member 1\",\"color\":\"#cc8866\"},{\"id\":\"wall-0\",\"label\":\"Member 0 — outermost (fixed)\",\"color\":\"#aab0b8\"},{\"id\":\"wall-1\",\"label\":\"Member 1 — carrier (screw-driven)\",\"color\":\"#3b82f6\"},{\"id\":\"wall-2\",\"label\":\"Member 2\",\"color\":\"#a78bfa\"},{\"id\":\"wall-3\",\"label\":\"Member 3 — innermost (output)\",\"color\":\"#5eead4\"},{\"id\":\"pinions\",\"label\":\"Big pinions (top + bottom per tube)\",\"color\":\"#f59e0b\"},{\"id\":\"sprockets\",\"label\":\"Chain sprockets (coaxial with pinions)\",\"color\":\"#d97706\"},{\"id\":\"chains\",\"label\":\"Chain loops (top↔bottom per tube)\",\"color\":\"#444444\"}]}],\"bom\":[{\"label\":\"Square-tube member (wood)\",\"quantity\":4,\"note\":\"Square outer cross-section, racks unioned into body.\"},{\"label\":\"Rack strip\",\"quantity\":6,\"note\":\"Inner-face + outer-face racks on adjacent member pairs (merged into tube).\"},{\"label\":\"Big pinion\",\"quantity\":4,\"note\":\"Top + bottom on each non-outer, non-inner tube.\"},{\"label\":\"Chain sprocket (small)\",\"quantity\":4,\"note\":\"Coaxial with each big pinion, smaller diameter.\"},{\"label\":\"Chain loop\",\"quantity\":2,\"note\":\"One closed loop per non-outer, non-inner tube; top↔bottom sprockets.\"},{\"label\":\"Drive screw\",\"quantity\":1,\"note\":\"Acme thread, fixed in Y, rotates to drive member 1.\"},{\"label\":\"Travelling nut\",\"quantity\":1,\"note\":\"Bonded to member 1 bottom cap; climbs the screw.\"}],\"scad\":\"// Telescopic Rack-and-Pinion + Chain — assembly source.\\n// Parts emitted by the 'telescopic-chain-77' entry in\\n// scadRegistry.ts. Identical to mechanism-76 except:\\n//   • No intermediate gears (no middle big/small along Y).\\n//   • Each big pinion carries a coaxial smaller sprocket.\\n//   • A chain loop on each tube ties top sprocket ↔ bottom sprocket,\\n//     enforcing in-phase rotation of the top + bottom big pinions.\\n\",\"equations\":\"## Lift ratio\\n\\nSame as Mechanism 76. Driving the carrier (k=1) by stroke h via the screw, member k rises by\\n\\n$$ h_k = (k-1) \\\\cdot h $$\\n\\n## Chain coupling\\n\\nThe chain on tube k wraps the top and bottom small sprockets (both of pitch radius r_s). Because both sprockets are rigid with their respective big pinions, the chain enforces\\n\\n$$ \\\\varphi_{top} = \\\\varphi_{bot} $$\\n\\nso the top and bottom big pinions stay in phase without a through-shaft. The chain ratio is 1:1 (same sprocket on each end) — its job is phase-locking, not torque conversion.\",\"notes\":\"Derived from Mechanism 76. The chain + sprocket pair replaces the rigid through-shaft coupling that 76 needed between each tube's top and bottom pinions. Removing the intermediate gear train clears the rack span between top and bottom; only the end pinions engage the racks now, so the rack engagement is concentrated at the ends rather than distributed along the full height.\"}}],null],null],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\",\"assemblies\",\"children\",\"$e\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\",\"assemblies\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/mechanisms-research/_next/static/css/6bf84677938b7be2.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"div\",null,{\"className\":\"__variable_55ec73 __variable_4918c1 __variable_1f
