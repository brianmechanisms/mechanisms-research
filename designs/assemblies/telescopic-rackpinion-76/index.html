ses through the first tube's end-cap bore). Lifting the rod lifts the second tube. Frees up the area around the second tube and keeps all moving drive parts inside the fixed outer tube.f:[\"slug\",\"telescopic-rackpinion-76\",\"d\"]\n16:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$La\",null,{\"buildId\":\"4HVliKr3wScT5dXl_o4gh\",\"assetPrefix\":\"/mechanisms-research\",\"urlParts\":[\"\",\"designs\",\"assemblies\",\"telescopic-rackpinion-76\",\"\"],\"initialTree\":[\"\",{\"children\":[\"designs\",{\"children\":[\"assemblies\",{\"children\":[[\"slug\",\"telescopic-rackpinion-76\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"telescopic-rackpinion-76\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"designs\",{\"children\":[\"assemblies\",{\"children\":[[\"slug\",\"telescopic-rackpinion-76\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$Lb\",[\"$\",\"$Lc\",null,{\"kind\":\"assembly\",\"design\":{\"slug\":\"telescopic-rackpinion-76\",\"name\":\"Telescopic Cylinder — Rack \u0026 Pinion (Mechanism 76)\",\"subtitle\":\"Square outer bodies + cylindrical bores; screw-driven 2:1+ stage cascade\",\"description\":\"N nested telescoping members with square outer profiles and a cylindrical bore through each. Each member carries pinions on its body that mesh racks on the inner face of the member outside it and the outer face of the member inside it. A screw drives the second member; each successive member rises by +1× stroke over its outer neighbour. Pin/rod fingers on each member slide in the cylindrical bore of the member outside it for guiding.\",\"status\":\"in-progress\",\"tags\":[\"rack\",\"pinion\",\"gear\",\"telescopic\",\"lift\",\"doubler\",\"mechanism-76\"],\"mechanismId\":76,\"parameters\":[{\"id\":\"N\",\"label\":\"Number of stages (walls)\",\"default\":7,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Stages\",\"description\":\"Total nested members. Each beyond the outer adds a +1× stage.\"},{\"id\":\"cylHeigh
