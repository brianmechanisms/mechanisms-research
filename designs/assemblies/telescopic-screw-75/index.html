w — locus-3 design study\",\"description\":\"Buildable 3D realisation of Mechanism 75 / locus 3: an N-stage telescopic screw driven from below, with the topmost stage held against rotation by a rod-and-sleeve chain anchored to a barrel-mounted receiver. Designed for dispensing inside a circular barrel.\",\"status\":\"in-progress\",\"tags\":[\"screw\",\"telescopic\",\"lift\",\"dispenser\",\"anti-rotation\",\"mechanism-75\"],\"mechanismId\":75,\"parameters\":[{\"id\":\"N\",\"label\":\"Number of stages\",\"default\":5,\"min\":2,\"max\":8,\"step\":1,\"group\":\"Stages\",\"description\":\"Number of nested screw stages, top stage held against rotation.\"},{\"id\":\"stageHeight\",\"label\":\"Stage height\",\"default\":40,\"min\":10,\"max\":200,\"step\":1,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"rCore\",\"label\":\"Central bore radius\",\"default\":3,\"min\":1,\"max\":20,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Stages\"},{\"id\":\"tOuter\",\"label\":\"Outer wall thickness\",\"default\":2,\"min\":0.5,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Wall\"},{\"id\":\"tGroove\",\"label\":\"Annular groove width\",\"default\":3,\"min\":1,\"max\":12,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Wall\"},{\"id\":\"tInner\",\"label\":\"Inner wall thickness\",\"default\":2,\"min\":0.5,\"max\":8,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Wall\"},{\"id\":\"rodLengthFactor\",\"label\":\"Rod length factor\",\"default\":0.9,\"min\":0.3,\"max\":1,\"step\":0.05,\"group\":\"Anti-rotation\",\"description\":\"Rod length as a fraction of stage height; controls max stroke per stage.\"},{\"id\":\"spinScale\",\"label\":\"Visual spin gain\",\"default\":8,\"min\":0,\"max\":50,\"step\":1,\"group\":\"Animation\",\"description\":\"Thread/stage rotation multiplier for the animation; does not change geometry.\"}],\"tree\":[{\"id\":\"telescopic-screw-75\",\"label\":\"Telescopic Screw Lift\",\"children\":[{\"id\":\"barrel\",\"label\":\"Barrel (transparent, fixed)\",\"color\":\"#b0b0b0\"},{\"id\":\"receiver\",\"label\":\"Anti-rotation receiver (barrel-fixed)\",\"color\":\"#555555\"},{\"id\":\"stage-0\",\"label\":\"Stage 0 body (driven, outermost)\",\"color\":\"#440154\"},{\"id\":\"sleeve-0\",\"label\":\"Sleeve 0 (anti-rot ring)\",\"color\":\"#9966cc\"},{\"id\":\"rod-cage-0\",\"label\":\"Rod cage 0 → receiver\",\"color\":\"#cc3333\"},{\"id\":\"stage-1\",\"label\":\"Stage 1 body\",\"color\":\"#3b528b\"},{\"id\":\"sleeve-1\",\"label\":\"Sleeve 1\",\"color\":\"#9966cc\"},{\"id\":\"rod-cage-1\",\"label\":\"Rod cage 1 → sleeve 0\",\"color\":\"#cc3333\"},{\"id\":\"stage-2\",\"label\":\"Stage 2 body\",\"color\":\"#21908d\"},{\"id\":\"sleeve-2\",\"label\":\"Sleeve 2\",\"color\":\"#9966cc\"},{\"id\":\"rod-cage-2\",\"label\":\"Rod cage 2 → sleeve 1\",\"color\":\"#cc3333\"},{\"id\":\"stage-3\",\"label\":\"Stage 3 body\",\"color\":\"#5ec962\"},{\"id\":\"sleeve-3\",\"label\":\"Stage 3 - sleeve\",\"color\":\"#9966cc\"},{\"id\":\"rod-cage-3\",\"label\":\"Rod cage 3 → sleeve 2\",\"color\":\"#cc3333\"},{\"id\":\"top-unit\",\"label\":\"Stage 4\",\"color\":\"#fde725\"}]}],\"bom\":[{\"label\":\"Barrel tube\",\"quantity\":1,\"note\":\"Smooth-bore cylindrical tube (transparent in viewer).\"},{\"label\":\"Anti-rotation receiver\",\"quantity\":1,\"note\":\"Fixed cyl at barrel base, holes for stage-0 rods.\"},{\"label\":\"Threaded stage (outer + inner walls + groove floor)\",\"quantity\":4,\"note\":\"Stages 0..N-2; identical pattern, different radii.\"},{\"label\":\"Top stage (solid)\",\"quantity\":1,\"note\":\"Innermost stage, rigidly fused with its sleeve; platform face.\"},{\"label\":\"Sleeve disc\",\"quantity\":5,\"note\":\"One per stage; top is solid, others are rings.\"},{\"label\":\"Anti-rotation rod\",\"quantity\":20,\"note\":\"4 per stage × 5 stages (visualised at 90° intervals).\"}],\"scad\":\"// Telescopic Screw Lift — assembly source.\\n// Each part is generated as a self-contained SCAD program by the\\n// 'telescopic-screw-75' entry in scadRegistry.ts (compiled to STL via\\n// openscad-wasm). Part list:\\n//   barrel              — outer transparent tube\\n//   receiver            — fixed annulus at the base with 4 rod holes\\n//   stage-{k}           — k = 0..N-1; outer/inner walls + groove floor\\n//                         (top stage is a solid cylinder)\\n//   sleeve-{k}          — anti-rotation disc on top of stage k;\\n//                         non-top sleeves have 4 rod-clearance holes\\n//   rod-cage-{k}        — 4 rods hanging from sleeve k into the unit below\\n\",\"equations\":\"## Telescoping kinematics\\n\\nDriven from below (stage 0) at angular rate ω, top stage (k=N-1) held against rotation. Each thread interface contributes lift = p × Δφ where Δφ is the relative rotation across that interface.\\n\\n$$ z_{top} = \\\\frac{p \\\\, \\\\varphi_{in}}{2\\\\pi} $$\\n\\nPer-stage rise (linear interpolation):\\n\\n$$ z_k = z_{top} \\\\cdot \\\\frac{k}{N-1} $$\\n\\n## Stage radii\\n\\nBuilt innermost-out from the central bore radius $r_c$:\\n\\n$$ r^{i,ID}_{N-1} = r_c $$\\n$$ r^{i,OD}_k = r^{i,ID}_k + t_i $$\\n$$ r^{o,ID}_k = r^{i,OD}_k + t_g $$\\n$$ r^{o,OD}_k = r^{o,ID}_k + t_o $$\\n$$ r^{i,ID}_{k-1} = r^{o,OD}_k + \\\\text{gap} $$\\n\\n## Max stroke\\n\\nEach rod must remain engaged with its receiver below; with rod length $L_r = f_r \\\\cdot h$:\\n\\n$$ z_{max,k} = h - (h - L_r) = L_r $$\\n\\nTotal stroke distributed across N−1 interfaces:\\n\\n$$ z_{stroke} \\\\approx (N-1) \\\\cdot L_r \\\\cdot \\\\eta $$\\n\\nwhere $\\\\eta$ is a safety factor (≈ 0.85 in the builder).\",\"notes\":\"Geometry mirrors the locus-3 design study. The barrel is rendered transparent so the screw stack stays visible. Animation: progress 0 → max → 0 (triangle-wave) extends and collapses the stack; the bottom stage spins at the full input rate, intermediate stages spin proportionally, the top stage is rotation-locked.\"}}],null],null],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children
