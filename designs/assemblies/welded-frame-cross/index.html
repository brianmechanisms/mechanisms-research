· cross\",\"subtitle\":\"Two welded rectangles sharing the X axis; Y-pipe halves welded into the Z-pipe sides\",\"description\":\"Reusable sub-assembly: the welded-frame with an additional perpendicular rectangle in the XY plane. The base-frame Z-pipes run continuously through the X-axis junction; the perpendicular frame's Y-pipes are split into halves whose inner ends butt-weld into the sides of the Z-pipes (real welds would be saddle/fish-mouth coped). No fittings.\",\"status\":\"in-progress\",\"tags\":[\"subassembly\",\"frame\",\"welded\",\"NPS\",\"mitred\",\"2dof\",\"cross\"],\"kind\":\"subassembly\",\"tree\":[{\"id\":\"base-frame\",\"label\":\"Base frame (XZ plane)\",\"children\":[{\"id\":\"pipe-x-front\",\"label\":\"X-pipe · front (+Z)\",\"color\":\"#8a8a8a\"},{\"id\":\"pipe-x-rear\",\"label\":\"X-pipe · rear (−Z)\",\"color\":\"#8a8a8a\"},{\"id\":\"frame-pipe-z-right\",\"label\":\"Z-pipe · right (+X) — split at junction\",\"children\":[{\"id\":\"pipe-z-right-front\",\"label\":\"+Z half\",\"color\":\"#8a8a8a\"},{\"id\":\"pipe-z-right-rear\",\"label\":\"−Z half\",\"color\":\"#8a8a8a\"}]},{\"id\":\"frame-pipe-z-left\",\"label\":\"Z-pipe · left (−X) — split at junction\",\"children\":[{\"id\":\"pipe-z-left-front\",\"label\":\"+Z half\",\"color\":\"#8a8a8a\"},{\"id\":\"pipe-z-left-rear\",\"label\":\"−Z half\",\"color\":\"#8a8a8a\"}]}]},{\"id\":\"perp-frame\",\"label\":\"Perpendicular frame (XY plane)\",\"children\":[{\"id\":\"pipe-x-top\",\"label\":\"X-pipe · top (+Y)\",\"color\":\"#8a8a8a\"},{\"id\":\"pipe-x-bottom\",\"label\":\"X-pipe · bottom (−Y)\",\"color\":\"#8a8a8a\"},{\"id\":\"frame-pipe-y-right\",\"label\":\"Y-pipe · right (+X) — split at junction\",\"children\":[{\"id\":\"pipe-y-right-up\",\"label\":\"+Y half\",\"color\":\"#8a8a8a\"},{\"id\":\"pipe-y-right-down\",\"label\":\"−Y half\",\"color\":\"#8a8a8a\"}]},{\"id\":\"frame-pipe-y-left\",\"label\":\"Y-pipe · left (−X) — split at junction\",\"children\":[{\"id\":\"pipe-y-left-up\",\"label\":\"+Y half\",\"
