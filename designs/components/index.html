"unit\":\"mm\"},{\"id\":\"wheelDia\",\"label\":\"V-wheel diameter\",\"default\":24,\"min\":16,\"max\":32,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"wheelThickness\",\"label\":\"V-wheel thickness\",\"default\":11,\"min\":6,\"max\":16,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"pinDia\",\"label\":\"Follower pin diameter\",\"default\":8,\"min\":3,\"max\":12,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"pinLen\",\"label\":\"Follower pin length\",\"default\":12,\"min\":6,\"max\":30,\"step\":1,\"unit\":\"mm\"},{\"id\":\"parW\",\"label\":\"Parallelogram width\",\"default\":16,\"min\":4,\"max\":60,\"step\":1,\"unit\":\"mm\"},{\"id\":\"flangeY\",\"label\":\"Flange outboard extent\",\"default\":18,\"min\":8,\"max\":40,\"step\":1,\"unit\":\"mm\"},{\"id\":\"flangeT\",\"label\":\"Flange thickness\",\"default\":4,\"min\":2,\"max\":10,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"pivotDia\",\"label\":\"Link pivot pin diameter\",\"default\":5,\"min\":3,\"max\":10,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"pivotLen\",\"label\":\"Link pivot pin length\",\"default\":8,\"min\":4,\"max\":20,\"step\":0.5,\"unit\":\"mm\"}],\"scad\":\"$11\",\"notes\":\"v1 has the plate flat against one face of the rail. A later iteration will swap the wheel/axle assembly for the canonical OpenBuilds Mini-V Wheel Kit so the BOM cross-references real hardware.\"},{\"slug\":\"cam-plate-70-3\",\"name\":\"Dual-Groove Cam Plate (Mechanism 70.3)\",\"subtitle\":\"Synthesised from the kinematic class\",\"description\":\"A single disc carrying two closed grooves milled into it: groove 1 drives S1 + S3 (antiphase), groove 2 drives S2 + S4. Each pitch curve is synthesised from the slider trajectories; groove walls are the pitch curve offset ±rollerR along the curve normal. The disc rotates with the shaft at constant ω.\",\"status\":\"in-progress\",\"tags\":[\"cam\",\"synthesis\",\"mechanism-70.3\"],\"parameters\":[{\"id\":\"rollerR\",\"label\":\"Roller radius\",\"default\":0.06,\"min\":0.01,\"max\":0.5,\"step\":0.005,\"group\":\"Mechanism\"},{\"id\":\"r2min\",\"label\":\"r2min\",\"default\":0.2,\"min\":0.05,\"max\":5,\"step\":0.01,\"group\":\"Mechanism\"},{\"id\":\"L1\",\"label\":\"Link 1 length\",\"default\":0.7,\"min\":0.2,\"max\":5,\"step\":0.01,\"group\":\"Mechanism\"},{\"id\":\"L2\",\"label\":\"Link 2 length\",\"default\":1.2,\"min\":0.2,\"max\":5,\"step\":0.01,\"group\":\"Mechanism\"},{\"id\":\"railY\",\"label\":\"Rail Y\",\"default\":-0.4,\"min\":-5,\"max\":5,\"step\":0.01,\"group\":\"Mechanism\"},{\"id\":\"parW\",\"label\":\"Parallelogram width\",\"default\":0.08,\"min\":0,\"max\":1,\"step\":0.01,\"group\":\"Mechanism\"},{\"id\":\"worldScale\",\"label\":\"World scale\",\"default\":200,\"min\":50,\"max\":500,\"step\":1,\"unit\":\"mm/unit\",\"group\":\"Scale\"},{\"id\":\"thickness\",\"label\":\"Plate thickness\",\"default\":10,\"min\":3,\"max\":30,\"step\":0.5,\"unit\":\"mm\",\"group\":\"Plate\"},{\"id\":\"boreDia\",\"label\":\"Centre bore\",\"default\":10.2,\"min\":4,\"max\":25,\"step\":0.1,\"unit\":\"mm\",\"group\":\"Plate\"}],\"scad\":\"// Dual-Groove Cam Plate — synthesised from Mechanism 70.3.\\n//\\n// The two groove pitch curves and their ±rollerR wall offsets are\\n// computed from the slider trajectories of Mechanism 70.3. This SCAD\\n// stub exposes the parameters but defers the polygon data to a\\n// downstream emitter — the production SCAD will inline the points[]\\n// array generated from the same synthesis used by the 3D viewer.\\n\\nroller_r   = 0.06;   // world units\\nr2min      = 0.2;\\nL1         = 0.7;\\nL2         = 1.2;\\nrail_y     = -0.4;\\npar_w      = 0.08;\\nworldScale = 200;    // mm / world unit\\nthickness  = 10;     // mm\\nbore_d     = 10.2;   // mm\\n\\n// Placeholder: outer disc with bore only. The two grooves will be\\n// inserted as polygon( points = [ ... ]) lists generated at build time.\\nmodule cam_plate_placeholder() {\\n  difference() {\\n    cylinder(h = thickness, r = 60, $fn = 96, center = true);\\n    cylinder(h = thickness + 1, d = bore_d, $fn = 64, center = true);\\n  }\\n}\\n\\ncam_plate_placeholder();\\n\",\"notes\":\"v1 of the SCAD shows the disc + bore only — the groove polygons are emitted from the same TypeScript synthesis used by the 3D viewer (lib/data/designs/builders/camPlate.ts) and should be inlined as polygon point lists for the manufacturable SCAD.\"},{\"slug\":\"rod-rail\",\"name\":\"Round Rod Rail\",\"subtitle\":\"Solid rod or hollow pipe, parametric length and radius\",\"description\":\"Round-section rail for the rod-variant walker. The slider rides on three grooved wheels (preloaded triangle). Hollow when `wallT \u003e 0`, otherwise solid.\",\"status\":\"in-progress\",\"tags\":[\"rail\",\"rod\",\"frame\"],\"parameters\":[{\"id\":\"length\",\"label\":\"Length\",\"default\":600,\"min\":100,\"max\":2000,\"step\":1,\"unit\":\"mm\"},{\"id\":\"rodR\",\"label\":\"Rod outer radius\",\"default\":8,\"min\":3,\"max\":25,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"wallT\",\"label\":\"Wall thickness\",\"default\":0,\"min\":0,\"max\":10,\"step\":0.5,\"unit\":\"mm\",\"description\":\"0 = solid rod\"}],\"scad\":\"// Round rod / pipe rail.\\n\\nlength = 600;\\nrod_r  = 8;\\nwall_t = 0;   // 0 = solid\\n\\nmodule rod_rail() {\\n  rotate([0,90,0])\\n  difference() {\\n    cylinder(h = length, r = rod_r, center = true, $fn = 48);\\n    if (wall_t \u003e 0)\\n      cylinder(h = length + 1, r = rod_r - wall_t, center = true, $fn = 48);\\n  }\\n}\\n\\nrod_rail();\\n\"},{\"slug\":\"rod-mid-clamp\",\"name\":\"Rod Mid-Clamp\",\"subtitle\":\"Square block with round bore + four corner mount holes\",\"description\":\"Solid square block with a round bore through its centre — the rod passes through the bore. Four corner holes parallel to the bore let the block be screwed down to a chassis face.\",\"status\":\"in-progress\",\"tags\":[\"clamp\",\"rail\",\"mount\"],\"parameters\":[{\"id\":\"rodR\",\"label\":\"Rod outer radius\",\"default\":8,\"min\":3,\"max\":25,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"boreClearance\",\"label\":\"Bore clearance\",\"default\":0.3,\"min\":0,\"max\":1,\"step\":0.05,\"unit\":\"mm\"},{\"id\":\"size\",\"label\":\"Block size (Y × Z)\",\"default\":32,\"min\":16,\"max\":80,\"step\":1,\"unit\":\"mm\"},{\"id\":\"sleeveL\",\"label\":\"Block length (along rod)\",\"default\":30,\"min\":10,\"max\":80,\"step\":1,\"unit\":\"mm\"},{\"id\":\"mountHoleDia\",\"label\":\"Mount hole diameter\",\"default\":5.5,\"min\":2,\"max\":12,\"step\":0.1,\"unit\":\"mm\"},{\"id\":\"mountHoleInset\",\"label\":\"Mount hole inset from face\",\"default\":5,\"min\":2,\"max\":20,\"step\":0.5,\"unit\":\"mm\"}],\"scad\":\"// Rod mid-clamp — square block with round bore + 4 corner mount holes.\\n\\nrod_r            = 8;\\nbore_clearance   = 0.3;\\nsize             = 32;        // block Y × Z\\nsleeve_l         = 30;        // length along rod (X)\\nmount_hole_dia   = 5.5;\\nmount_hole_inset = 5;         // from each face\\n\\nbore_r = rod_r + bore_clearance;\\nhalf   = size / 2;\\ninset  = mount_hole_inset;\\n\\nmodule rod_mid_clamp() {\\n  rotate([0, 90, 0])\\n  linear_extrude(height = sleeve_l, center = true)\\n  difference() {\\n    square(size, center = true);\\n    circle(r = bore_r, $fn = 48);\\n    for (sy = [-1, 1])\\n      for (sz = [-1, 1])\\n        translate([sy * (half - inset), sz * (half - inset)])\\n          circle(d = mount_hole_dia, $fn = 24);\\n  }\\n}\\n\\nrod_mid_clamp();\\n\"},{\"slug\":\"rod-slider-3wheel\",\"name\":\"3-Wheel Rod Slider\",\"subtitle\":\"Two plates sandwich the rod; 3 grooved wheels ride between them\",\"description\":\"Carriage with TWO plates — one above the rod (+Y) and one below (−Y) — joined at each end by a short web. Three grooved wheels sit between the plates with axles along Y, the grooves wrapping the rod. Two wheels on one Z side spaced along the rail, one wheel on the opposite Z side at the centre — preloaded triangle.\",\"status\":\"in-progress\",\"tags\":[\"slider\",\"carriage\",\"rod\"],\"parameters\":[{\"id\":\"rodR\",\"label\":\"Rod radius\",\"default\":8,\"min\":3,\"max\":25,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"plateL\",\"label\":\"Plate length (X)\",\"default\":60,\"min\":30,\"max\":120,\"step\":1,\"unit\":\"mm\"},{\"id\":\"plateW\",\"label\":\"Plate width (Z)\",\"default\":36,\"min\":18,\"max\":80,\"step\":1,\"unit\":\"mm\"},{\"id\":\"plateT\",\"label\":\"Plate thickness (Y)\",\"default\":4,\"min\":2,\"max\":10,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"wheelDia\",\"label\":\"Wheel outer diameter\",\"default\":16,\"min\":8,\"max\":32,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"wheelThickness\",\"label\":\"Wheel thickness\",\"default\":6,\"min\":3,\"max\":16,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"wheelSpacingX\",\"label\":\"Wheel X spacing\",\"default\":36,\"min\":16,\"max\":80,\"step\":1,\"unit\":\"mm\"},{\"id\":\"ridgeT\",\"label\":\"Cam ridge thickness\",\"default\":4,\"min\":1,\"max\":12,\"step\":0.5,\"unit\":\"mm\",\"description\":\"Sets follower roller-pair spacing.\"},{\"id\":\"rollerR\",\"label\":\"Follower roller radius\",\"default\":4,\"min\":1,\"max\":12,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"rollerLen\",\"label\":\"Follower roller length\",\"default\":6,\"min\":2,\"max\":16,\"step\":0.5,\"unit\":\"mm\"}],\"scad\":\"// 3-grooved-wheel slider — placeholder.\\n\\nrod_r         = 8;\\nplate_l       = 60;\\nplate_w       = 36;\\nplate_t       = 4;\\nwheel_dia     = 16;\\nwheel_t       = 6;\\nwsx           = 36;\\n\\ninner_half_h  = rod_r + 1.5;\\n\\nmodule rod_slider_3wheel() {\\n  // Upper + lower plates.\\n  for (s = [-1, 1])\\n    translate([0, s * (inner_half_h + plate_t/2), 0])\\n      cube([plate_l, plate_t, plate_w], center = true);\\n  // End webs.\\n  for (sx = [-1, 1])\\n    translate([sx * (plate_l/2 - 2), 0, 0])\\n      cube([4, 2 * inner_half_h, plate_w], center = true);\\n  // TODO: 3 grooved wheels + axles.\\n}\\n\\nrod_slider_3wheel();\\n\"},{\"slug\":\"cam-mount-post\",\"name\":\"Cam-Mount Post\",\"subtitle\":\"Vertical shaft rising from the mid-clamp; carries the cam assembly\",\"description\":\"A simple cylindrical post that screws into (or press-fits to) the mid-clamp top face. The cam assembly mounts at its tip, turning the post into the cam shaft for the walker.\",\"status\":\"in-progress\",\"tags\":[\"shaft\",\"cam\",\"mount\"],\"parameters\":[{\"id\":\"postDia\",\"label\":\"Post diameter\",\"default\":10,\"min\":4,\"max\":25,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"postH\",\"label\":\"Post height\",\"default\":60,\"min\":20,\"max\":200,\"step\":1,\"unit\":\"mm\"}],\"scad\":\"// Cam-mount post.\\n\\npost_d = 10;\\npost_h = 60;\\n\\nmodule cam_mount_post() {\\n  cylinder(h = post_h, d = post_d, $fn = 32);\\n}\\n\\ncam_mount_post();\\n\"},{\"slug\":\"cam-disc\",\"name\":\"Cam Disc (blank)\",\"subtitle\":\"Flat disc with a centre bore; slides onto the cam-mount post\",\"description\":\"The blank disc that becomes the cam plate once ridges or grooves are added to its face. Centre bore matches the cam-mount post diameter (with a small slip-fit clearance).\",\"status\":\"in-progress\",\"tags\":[\"cam\",\"disc\",\"blank\"],\"parameters\":[{\"id\":\"outerDia\",\"label\":\"Outer diameter\",\"default\":80,\"min\":20,\"max\":400,\"step\":1,\"unit\":\"mm\"},{\"id\":\"boreDia\",\"label\":\"Bore diameter\",\"default\":10.4,\"min\":3,\"max\":30,\"step\":0.1,\"unit\":\"mm\",\"description\":\"Post diameter + clearance.\"},{\"id\":\"thickness\",\"label\":\"Thickness\",\"default\":6,\"min\":2,\"max\":30,\"step\":0.5,\"unit\":\"mm\"}],\"scad\":\"// Cam disc (blank).\\n\\nouter_d = 80;\\nbore_d  = 10.4;\\nthick   = 6;\\n\\nmodule cam_disc() {\\n  difference() {\\n    cylinder(h = thick, d = outer_d, $fn = 96);\\n    translate([0, 0, -1])\\n      cylinder(h = thick + 2, d = bore_d, $fn = 48);\\n  }\\n}\\n\\ncam_disc();\\n\"},{\"slug\":\"cam-assembly-70-3\",\"name\":\"Cam Assembly (Mechanism 70.3, raised ridges)\",\"subtitle\":\"Shaft + backing plate + two screw-on raised cam ridges\",\"description\":\"Assembly version of the cam: a central drive shaft, a backing plate, and two raised ridges (the inverse of the cut grooves in `cam-plate-70-3`). Each ridge is the pitch curve from `Mechanism70c.computeCamProfile` extruded above the plate. Followers are a pair of rollers straddling each ridge.\",\"status\":\"in-progress\",\"tags\":[\"cam\",\"assembly\",\"mechanism-70.3\"],\"parameters\":[{\"id\":\"rollerR\",\"label\":\"Roller follower radius (world)\",\"default\":0.06,\"min\":0.01,\"max\":0.5,\"step\":0.005},{\"id\":\"r2min\",\"label\":\"r2min (world)\",\"default\":0.2,\"min\":0.05,\"max\":5,\"step\":0.01},{\"id\":\"L1\",\"label\":\"L1\",\"default\":0.7,\"min\":0.2,\"max\":5,\"step\":0.01},{\"id\":\"L2\",\"label\":\"L2\",\"default\":1.2,\"min\":0.2,\"max\":5,\"step\":0.01},{\"id\":\"railY\",\"label\":\"Rail Y (world)\",\"default\":-0.4,\"min\":-5,\"max\":5,\"step\":0.01},{\"id\":\"parW\",\"label\":\"parW (world)\",\"default\":0.08,\"min\":0,\"max\":1,\"step\":0.01},{\"id\":\"worldScale\",\"label\":\"World scale\",\"default\":200,\"min\":50,\"max\":500,\"step\":1,\"unit\":\"mm/unit\"},{\"id\":\"backingPlateThickness\",\"label\":\"Backing plate thickness\",\"default\":6,\"min\":3,\"max\":20,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"ridgeT\",\"label\":\"Ridge radial thickness\",\"default\":4,\"min\":1,\"max\":12,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"ridgeH\",\"label\":\"Ridge height\",\"default\":8,\"min\":3,\"max\":25,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"shaftDia\",\"label\":\"Shaft diameter\",\"default\":10,\"min\":5,\"max\":20,\"step\":0.5,\"unit\":\"mm\"},{\"id\":\"shaftLength\",\"label\":\"Shaft length\",\"default\":80,\"min\":40,\"max\":200,\"step\":1,\"unit\":\"mm\"}],\"scad\":\"// Cam assembly — placeholder. Real ridge polygons are emitted from\\n// the same synthesis used by the 3D viewer (camAssembly.ts).\\n\\nbacking_plate_t = 6;\\nridge_t         = 4;\\nridge_h         = 8;\\nshaft_d         = 10;\\nshaft_l         = 80;\\nouter_r         = 60;\\n\\nmodule cam_assembly_70_3() {\\n  // Backing plate.\\n  difference() {\\n    cylinder(h = backing_plate_t, r = outer_r, $fn = 96);\\n    translate([0, 0, -1])\\n      cylinder(h = backing_plate_t + 2, d = shaft_d + 0.4, $fn = 48);\\n  }\\n  // Shaft.\\n  translate([0, 0, -shaft_l/2 + backing_plate_t/2])\\n    cylinder(h = shaft_l, d = shaft_d, center = true, $fn = 24);\\n  // TODO: ridge1, ridge2 — polygon( points = [ ... ]) lists from synthesis.\\n}\\n\\ncam_assembly_70_3();\\n\",\"notes\":\"The two ridge polygon point lists must be inlined into the SCAD from the TypeScript synthesis at build time. Ridge centreline = pitch curve; the ridge is the pitch curve offset ±ridgeT/2 along the curve normal, then linear_extrude’d to ridge_h.\"}]}]}]],null],null],null]},[null,[\"$\",\"$L12\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\",\"components\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L13\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/mechanisms-research/_next/static/css/6bf84677938b7be2.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"div\",null,{\"className\":\"__variable_55ec73 __variable_4918c1 __variable_1f2f98 designs-root\",\"children\":[\"$\",\"$L14\",null,{\"children\":[\"$\",\"$L12\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"designs\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L13\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]}]}]],null],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/mechanisms-research/_next/static/css/3c5c22c869011c46.css\",\"precedence\":\"next\",\"crossOrig
