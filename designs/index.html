g shaft).\n  • Follower: a pair of rollers (radius rollerR · worldScale) on either side of the ridge.\n  • Required follower-pair gap (centre-to-centre):\n        rollerPairGap = ridgeT + 2·(rollerR · worldScale) + clearance\n\nKEY DIMENSIONS (defaults)\n\n  rod radius              rodR              = 8 mm\n  rod length              rodLength         = 600 mm\n  shaft diameter          shaftDia          = 8 mm  (608ZZ bore)\n  shaft length            shaftLength       = frameDepth + 60 mm\n  cam plate thickness     camPlateThickness = 6 mm\n  cam plate outer dia     camPlateOuterDia  = 80 mm\n  ridge radial t          ridgeT            = 4 mm\n  ridge height            ridgeH            = 8 mm\n  world scale          = 200 mm/unit\n  L1 (world)           = 0.7\n  L2 (world)           = 1.2\n  parW (world)         = 0.08\n  rollerR (world)      = 0.06   →  1.2 mm × worldScale (= 12 mm) … see notes\n  r2min (world)        = 0.2\n\nSLIDER WHEEL LAYOUT (3-wheel preloaded triangle)\n\n  • Two grooved wheels on +Y side of the rod, spaced wheelSpacingX along rail axis.\n  • One grooved wheel on −Y side at the carriage centre.\n  • Wheel groove inner radius ≈ rodR + 0.5 mm clearance.\n"])</script><script>self.__next_f.push([1,"1e3:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$La\",null,{\"buildId\":\"bkwcP0ZnRZAP7mAGMQcgY\",\"assetPrefix\":\"/mechanisms-research\",\"urlParts\":[\"\",\"designs\",\"\"],\"initialTree\":[\"\",{\"children\":[\"designs\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"designs\",{\"children\":[\"__PAGE__\",{},[[\"$Lb\",[[\"$\",\"$Lc\",null,{}],[\"$\",\"$Ld\",null,{\"code\":\"Designs / Index\",\"title\":\"Drawing Office\",\"subtitle\":\"Manufacturable parts and buildable assemblies. Each sheet ships parametric OpenSCAD; assemblies linked to a kinematic class animate live from the IK.\",\"right\":[\"$\",\"div\",null,{\"className\":\"flex gap-px\",\"style\":{\"background\"
