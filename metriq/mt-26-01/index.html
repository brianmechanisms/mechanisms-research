sms-research/_next/static/media/b7ea2ab4a8ad1f81-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n7:HL[\"/mechanisms-research/_next/static/media/d7df244fe7b07b95-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n8:HL[\"/mechanisms-research/_next/static/media/e6099e249fd938cc-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n9:HL[\"/mechanisms-research/_next/static/css/a278255f367788ec.css\",\"style\"]\na:HL[\"/mechanisms-research/_next/static/css/5ab1acfdd2984050.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"b:I[55854,[],\"\"]\nd:I[8350,[\"4687\",\"static/chunks/0bfc6d32-5100df61438d51ae.js\",\"4144\",\"static/chunks/4144-f587ff692dbc30d7.js\",\"6981\",\"static/chunks/6981-84ea8d8545ab219e.js\",\"9129\",\"static/chunks/app/metriq/%5Bslug%5D/page-59ba64a6069aae44.js\"],\"default\"]\nf:I[68046,[],\"\"]\n11:I[87597,[],\"\"]\n12:I[28053,[\"8952\",\"static/chunks/app/metriq/layout-57fed99190232024.js\"],\"default\"]\n13:I[79821,[\"3185\",\"static/chunks/app/layout-216e2108b630e66b.js\"],\"AuthProvider\"]\n14:I[10579,[\"3185\",\"static/chunks/app/layout-216e2108b630e66b.js\"],\"default\"]\n16:I[80914,[],\"\"]\ne:T13d1,"])</script><script>self.__next_f.push([1,"## Intent\n\nTwo vertical tubes side by side, joined into one body by a middle wall that\nstops short of the bottom. A single slanting plunger reciprocates below that\nwall. Turn the drive and solids move from tube **B** into tube **A**.\n\nNo valves, no timing, no separate sequencing element. The direction comes from\none inclined face and one screen.\n\n## The parts\n\n| # | Part | Constraint |\n|---|---|---|\n| **A** | Left tube — the **receiving** side | Fixed. Open at the bottom. |\n| **B** | Right tube — the **supply** side | Fixed. Open at the bottom. |\n| **middle wall** | Divides A from B, **stops short of the bottom** | Fixed. Its bottom edge is the plunger's top stop. |\n| **screen** | Spans A, level with the middle wall's bottom edge | Fixed. The one-way element. |\n| **plunger** | One slanting member spanning **both** bores | One DOF: vertical translation. |\n\nThere is **no floor**. The tubes are open at the bottom and the plunger *is*\nthe floor — which is why its lowest position is a hard limit rather than a\npreference.\n\n## The slant\n\nOne continuous inclined face, **highest in B and falling the whole way into\nA**. No level section, no ridge. Everything resting on it slides down and to\nthe left — out of B, across the crossover, and into A. That single inclination\nis the entire direction-giving mechanism.\n\nThe face must be steeper than the material's **angle of repose** or nothing\nruns down it. With 35° repose the slant is set at 40° — the shallowest angle\nthat still runs, because every extra degree is expensive:\n\n\u003e A single slant across **both** bores is inherently tall. At 40° it rises 5.13\n\u003e across the pair. The plunger works entirely *below* the middle wall, so that\n\u003e rise has to fit under the wall, and the stroke has to fit above the rise.\n\u003e Every degree of slant is therefore paid for twice.\n\n## The cycle\n\nThe plunger reciprocates between two hard stops. Neither is a number that was\nchosen — both are things the machine runs into:\n\n| | limit | what stops it |\n|---|---|---|\n| **TOP** | plunger's **top face**, where it passes **under** the wall, meets the wall's bottom edge | the middle wall is the stopper |\n| **BOTTOM** | plunger's **low end** reaches the tubes' open rim | any lower and the seal breaks and material runs out |\n\nTwo details about the top stop that are easy to get wrong:\n\n- Contact is **not** at the plunger's high end. That end is out at B's far\n  side, past the wall entirely, and never touches it.\n- Contact is on the plunger's **top** face, not its underside.\n\nSince the face rises left to right, of the two points beneath the wall it is\nthe one at the wall's **right** face that stands highest and touches first.\nThat single point sets the whole stroke.\n\n### What the material does\n\n**Down-stroke.** Material comes across from B and slides down the face.\n\n**Up-stroke.** The load splits. What sits high on the face — the B side — falls\nback into B. What has already slid low — the A side — is carried up and\ndelivered into A.\n\nSo each stroke *sorts* rather than pushes: some returns, some crosses. The net\nis a transfer B → A. Nothing has to be timed.\n\n## The screen is the whole problem\n\n**This mechanism only works if the screen does something a plain mesh does\nnot.** It has to resist flow downward under gravity, yet permit flow upward\nwhen driven by the plunger. Those demands are in tension, and a plain woven\nmesh satisfies neither well: sized to hold material under gravity it also\nblocks it under stroke pressure; sized to pass it under pressure it lets it\ndrain back.\n\n### It must yield to force, not to motion\n\nA subtlety that is easy to get wrong, and that the simulation got wrong first.\n\nThe obvious way to model a one-way screen is *let a particle through if it is\nmoving upward*. That is not the mechanism, and it flatters it badly. It means\nmaterial passes **because it is flying** — so fast, bouncing particles sail\nthrough while a slowly, steadily pressed column is blocked. That is backwards\nfrom the real loading case.\n\nA real machine of this kind moves slowly. Nothing is flung anywhere. Material\ngoes through because the plunger *forces* it through. The physical quantity is\n**contact force**, not velocity.\n\nUnder the velocity rule 403 of 542 particles were delivered; under a force\nthreshold, 235. The velocity rule was letting material through for free.\n\n### Slower is better — which is the point\n\n| stroke | delivered | fell out |\n|---|---|---|\n| fast | 235 / 542 | 10 |\n| **slow** | **315 / 542** | **3** |\n\nSlowing the machine by 2.2× delivered 43% more and lost a third as much. Under\nthe old velocity rule the result would have gone the other way.\n\nAt a slow stroke the material stays a **packed column** against the face, so\nthe plunger transmits load into it steadily and the contact force at the screen\nbuilds and *stays* above yield. A fast stroke throws the pack apart — particles\ngo ballistic, lose contact, and the load spikes and collapses instead of\npressing.\n\n**So this is a slow, force-driven machine, and it should be built and run as\none.**"])</script><script>self.__next_f.push([1,"10:[\"slug\",\"mt-26-01\",\"d\"]\n17:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$Lb\",null,{\"buildId\":\"710gl6eUKXjcrYn2SPyPo\",\"assetPrefix\":\"/mechanisms-research\",\"urlParts\":[\"\",\"metriq\",\"mt-26-01\",\"\"],\"initialTree\":[\"\",{\"children\":[\"metriq\",{\"children\":[[\"slug\",\"mt-26-01\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"mt-26-01\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"metriq\",{\"children\":[[\"slug\",\"mt-26-01\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$Lc\",[\"$\",\"$Ld\",null,{\"entry\":{\"slug\":\"mt-26-01\",\"title\":\"Slant-Plunger Transfer\",\"summary\":\"Two tubes, one slanting plunger. Solids move from B into A with no valves and nothing to time.\",\"status\":\"simulated\",\"visibility\":\"private\",\"updated\":\"2026-08-28\",\"source\":\"apps/research-private/24_slant_plunger_transfer\",\"claims\":[{\"statement\":\"Reciprocating the plunger nets a transfer of solids from B into A.\",\"support\":\"simulated\",\"basis\":\"315 of 542 particles delivered into A over six cycles in a rigid-body granular simulation (pymunk / Chipmunk2D), with 3 lost.\"},{\"statement\":\"The screen passes material upward when driven, and holds it against gravity.\",\"support\":\"assumed\",\"basis\":\"Modelled as an ideal force-yielding element. No such screen has been designed or built — this is the mechanism’s open problem, not a demonstrated property.\"},{\"statement\":\"The mechanism works better slowly than quickly.\",\"support\":\"simulated\",\"basis\":\"Halving the stroke speed raised delivery from 235 to 315 of 542 and cut losses from 10 to 3. Slow strokes keep the material a packed column, so load at the screen builds and stays above yield.\"}],\"results\":[{\"label\":\"Delivered into A\",\"value\":\"315 / 542\",\"note\":\"six cycles, slow stroke\"},{\"label\":\"Lost out the bottom\",\"value\":\"3 / 542\"},{\"label\":\"Slant angle\",\"value\":\"40°\",\"note\":\"repose is 35°; the shallowest angle that still runs\"},{\"label\":\"Slant rise\",\"value\":\"5.13\",\"note\":\"across both bores\"},{\"label\":\"Crossover height\",\"value\":\"5.21\"},{\"label\":\"Stroke\",\"value\":\"2.00\",\"note\":\"derived, not chosen\"}],\"open\":[\"The screen. It must stay shut under the weight of material resting on it and open under stroke load — closer to a pressure-relief element than a filter. Whether that can be built passively, at the difference between “a heap resting” and “a heap being pushed”, is unresolved.\",\"Whether the transfer rate holds with real particle shapes. The simulation uses discs; angular grains interlock and arch differently.\",\"Wear at the plunger’s low end, which seals against the tube rim on every stroke.\"],\"figures\":[{\"src\":\"/metriq/mt-26-01/cross-section.png\",\"caption\":\"Cross-section. Two bores, middle wall stopping short of the bottom, screen level with the wall’s end, and the single slanting plunger spanning both.\"},{\"src\":\"/metriq/mt-26-01/states.png\",\"caption\":\"One cycle. Both ends of the stroke are hard stops the machine runs into, not positions chosen for the drawing.\",\"wide\":true}],\"body\":\"$e\"}}],[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/mechanisms-research/_next/static/css/5ab1acfdd2984050.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]]],null],null]},[null,[\"$\",\"$Lf\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"metriq\",\"children\",\"$10\",\"children\"],\"error\"
