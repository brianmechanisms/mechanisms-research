a name="twitter:title" content="Brian Mechanisms - Interactive Mechanism Showcase"/><meta name="twitter:description" content="Explore 25+ advanced mechanical systems including quick return mechanisms, rotary motion, and walking systems."/><meta name="twitter:image" content="https://cseco.co.ke/mechanisms-research/mechanisms-research/og-image.png"/><link rel="shortcut icon" href="/mechanisms-research/favicon.svg"/><link rel="icon" href="/mechanisms-research/favicon.svg" type="image/svg+xml"/><link rel="icon" href="/mechanisms-research/favicon.svg" sizes="any"/><link rel="apple-touch-icon" href="/mechanisms-research/favicon.svg"/><meta name="next-size-adjust"/><script src="/mechanisms-research/_next/static/chunks/polyfills-42372ed130431b0a.js" noModule=""></script></head><body class="__className_866e57"><div class="__variable_55ec73 __variable_4918c1 __variable_1f2f98 metriq-root"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><div class="min-h-screen flex items-center justify-center"><div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-mechanism-accent"></div></div><!--/$--></div><script src="/mechanisms-research/_next/static/chunks/webpack-028dda637c991d41.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0]);self.__next_f.push([2,null])</script><script>self.__next_f.push([1,"1:HL[\"/mechanisms-research/_next/static/media/e4af272ccee01ff0-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n2:HL[\"/mechanisms-research/_next/static/css/0aa1076111372aba.css\",\"style\"]\n3:HL[\"/mechanisms-research/_next/static/media/0e96d314a90a6138-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n4:HL[\"/mechanisms-research/_next/static/media/26d4368bf94c0ec4-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n5:HL[\"/mechanisms-research/_next/static/media/9cc5b37ab1350db7-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n6:HL[\"/mechanisms-research/_next/static/media/b7ea2ab4a8ad1f81-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n7:HL[\"/mechanisms-research/_next/static/media/d7df244fe7b07b95-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n8:HL[\"/mechanisms-research/_next/static/media/e6099e249fd938cc-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n9:HL[\"/mechanisms-research/_next/static/css/914ca70d282c263c.css\",\"style\"]\na:HL[\"/mechanisms-research/_next/static/css/5ab1acfdd2984050.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"b:I[55854,[],\"\"]\nd:I[6679,[\"4687\",\"static/chunks/0bfc6d32-5100df61438d51ae.js\",\"4144\",\"static/chunks/4144-f587ff692dbc30d7.js\",\"6981\",\"static/chunks/6981-84ea8d8545ab219e.js\",\"9129\",\"static/chunks/app/metriq/%5Bslug%5D/page-455c1191b23a98e9.js\"],\"default\"]\nf:I[68046,[],\"\"]\n11:I[87597,[],\"\"]\n12:I[28053,[\"4144\",\"static/chunks/4144-f587ff692dbc30d7.js\",\"8952\",\"static/chunks/app/metriq/layout-48b32810203f2314.js\"],\"default\"]\n13:I[80868,[\"4144\",\"static/chunks/4144-f587ff692dbc30d7.js\",\"8952\",\"static/chunks/app/metriq/layout-48b32810203f2314.js\"],\"default\"]\n14:I[79821,[\"3185\",\"static/chunks/app/layout-216e2108b630e66b.js\"],\"AuthProvider\"]\n15:I[10579,[\"3185\",\"static/chunks/app/layout-216e2108b630e66b.js\"],\"default\"]\n17:I[80914,[],\"\"]\ne:Tc8c,"])</script><script>self.__next_f.push([1,"## Intent\n\nA rotary check valve built from **five nested curved shells** — wedges —\nthat all share **one hinge** at the centre. Bottom to top they run blue,\ngreen, yellow, orange, red; blue is the biggest and outermost, red the\nsmallest and innermost. Each shell's outer radius steps down by one wall\nthickness, so every shell fits *inside* the one below it, like a fan or a\ntelescope folded round a pivot.\n\n## Fan out to seal, nest to clear\n\nThe opening parameter is **theta**, measured anticlockwise from red's fixed\nedge at **90°**:\n\n- **theta = 0 — OPEN.** All five shells are stacked on the same slot, collapsed\n  onto the fixed red core. The valve's whole footprint is a single shell wide;\n  the bore beside it is clear.\n- **theta = 50° — CLOSED.** Blue swings the full angle, the inner shells each\n  swing a proportional share, and they fan out to fill the arc. Blue's leading\n  face — drawn heavy, as the closing/seal face — reaches the **170° stop** and\n  spans the bore.\n\nRed is the **fixed core**: it never moves, and every other shell is measured\nfrom its 90° edge. Blue (outermost) travels the whole theta; each shell inward\ntravels less, so they nest progressively rather than colliding.\n\n## The stop\n\n170° is a hard geometric limit, not a chosen angle. Blue's leading face sits at\n`90 + theta + SEG`; when that reaches 170° the fan is fully open across the\nbore and cannot swing further. That is the seal position.\n\n## The return spring\n\nA coil spring runs from **red's fixed top-right corner** to the **midpoint of\nblue's face line**. As blue fans out to close, the spring is the element pulling\nit there; as force from beneath drives the shells to nest, the spring is\nstretched and stores the energy to close again.\n\n## Check-valve actuation\n\nThe physical story is a **spring-return check valve**:\n\n- **Force from below pushes the valve OPEN** — the shells telescope together\n  and nest (theta → 0), clearing the bore.\n- **Releasing the force lets the spring pull it CLOSED** — the shells fan back\n  out to the 170° stop and seal.\n\nSo flow (or a pusher) from one side opens it; the spring shuts it when that\nforce drops. It passes one way and holds the other, which is the check-valve\naction.\n\n## Prior art\n\nNo exact prior art was found. The closest analogues each miss the defining\nfeature:\n\n- **Iris diaphragm / iris damper.** Overlapping blades open and close an\n  aperture, but each blade rides its **own pivot around the perimeter** — the\n  blades do not nest, and there is no single shared hinge.\n- **Rotary camera shutter.** Coaxial sector blades do rotate about a common\n  axis, but they are **timing shutters** — they sweep an opening past a frame,\n  not fan rigid shells out to a mechanical stop to seal a bore.\n- **Spring-return swing / multi-flapper check valves.** These share the\n  open-by-flow, close-by-spring actuation, but their leaves are **flat and\n  independent** — they flap, they do not nest concentrically.\n\nThe novel element is **rigid concentric shells that rotationally nest about a\nsingle shared hinge**, combined with **check-valve actuation** (open by force\nfrom beneath, close by return spring). None of the analogues combines those."])</script><script>self.__next_f.push([1,"10:[\"slug\",\"mt-28-02\",\"d\"]\n18:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$Lb\",null,{\"buildId\":\"ffAIXdR1AizZ25Z-0-jM9\",\"assetPrefix\":\"/mechanisms-research\",\"urlParts\":[\"\",\"metriq\",\"mt-28-02\",\"\"],\"initialTree\":[\"\",{\"children\":[\"metriq\",{\"children\":[[\"slug\",\"mt-28-02\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"mt-28-02\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"metriq\",{\"children\":[[\"slug\",\"mt-28-02\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$Lc\",[\"$\",\"$Ld\",null,{\"entry\":{\"slug\":\"mt-28-02\",\"title\":\"Annular Telescope Valve\",\"summary\":\"Five nested shells on one hinge fan out to seal a bore and telescope into a single-shell footprint to open it.\",\"status\":\"geometry\",\"visibility\":\"private\",\"updated\":\"2026-09-01\",\"source\":\"apps/research-private/28_annular_telescope_valve\",\"claims\":[{\"statement\":\"The nested shells fan out to seal the bore and rotate together to nest into a single-shell footprint when open.\",\"support\":\"simulated\",\"basis\":\"Demonstrated in geometry: the concept render shows the shells collapsing onto the fixed core at theta = 0 and fanning to the 170° stop at theta = 50°, sharing a single hinge throughout.\"},{\"statement\":\"Opened by force from beneath; a return spring closes it (check-valve action).\",\"support\":\"assumed\",\"basis\":\"The actuation is a design intent, not a demonstrated property. No spring rate, seal, or flow force has been designed or built — nothing here fixes the balance between them.\"},{\"statement\":\"Rigid concentric shells that rotationally nest about a single shared hinge appear to be a novel valve element.\",\"support\":\"assumed\",\"basis\":\"No exact prior art found. The closest analogues (iris diaphragm, rotary camera shutter, spring-return check valve) each miss either the nesting, the single hinge, or the check actuation — see Prior art below.\"}],\"open\":[\"The seal at the shell edges. Curved rigid faces meeting a bore wall (and each other) is not obviously sealable — the whole valve is only as good as that contact.\",\"Spring rate versus flow force. The spring must hold closed against back-pressure yet yield to opening force from beneath, and nothing here sets that balance.\",\"Wear at the shared hinge and along the sliding shell faces, which rub past one another every cycle.\",\"Whether the shells jam when nesting — a rigid telescope can bind if any face is out of true.\",\"Real fluid or granular behaviour through the fanned gap, which the static geometry says nothing about.\"],\"figures\":[{\"src\":\"/metriq/mt-28-02/concept.png\",\"caption\":\"Three states of the fan. OPEN (theta = 0) — all five shells nested on the fixed red core; opening (theta = 25°); CLOSED (theta = 50°) — blue’s heavy leading face reaches the 170° stop and spans the bore. The zig-zag is the return spring, anchored at red’s fixed corner and blue’s face.\",\"wide\":true}],\"body\":\"$e\"}}],[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/mechanisms-research/_next/static/css/5ab1acfdd2984050.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]]],null],null]},[null,[\"$\",\"$Lf\",null,{\"parallelRouter
