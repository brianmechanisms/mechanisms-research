<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0a7d33"/>
    </marker>
    <marker id="lead" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
    </marker>
    <pattern id="solid" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#e9d9b8"/>
      <circle cx="3" cy="3" r="1.3" fill="#b69a5e"/>
      <circle cx="8" cy="8" r="1.3" fill="#b69a5e"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="640" height="860" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">
    Vertical screw-lift dispenser — axial cross-section
  </text>
  <text x="320" y="46" text-anchor="middle" font-size="12" fill="#777">
    container at the BOTTOM · outlet at the TOP · single actuator rotates the screw
  </text>

  <!-- ============ TOP OUTLET ============ -->
  <!-- discharge spout off the top of the tube -->
  <path d="M230,120 L230,90 L150,90 L150,60 L300,60 L300,120 Z"
        fill="#cfd8e3" stroke="#33485f" stroke-width="2"/>
  <path d="M370,120 L370,90 L300,90"
        fill="none" stroke="#33485f" stroke-width="2"/>
  <rect x="300" y="60" width="70" height="30" fill="#cfd8e3" stroke="#33485f" stroke-width="2"/>
  <!-- dispensed product falling out the spout -->
  <circle cx="120" cy="78" r="2.5" fill="#b69a5e"/>
  <circle cx="110" cy="86" r="2.5" fill="#b69a5e"/>
  <circle cx="125" cy="92" r="2.5" fill="#b69a5e"/>
  <line x1="150" y1="75" x2="100" y2="75" stroke="#0a7d33" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ TUBE ============ -->
  <!-- tube walls: inner bore at 230/370, outer at 216/384 -->
  <rect x="216" y="120" width="14" height="480" fill="#dfe6ee" stroke="#33485f" stroke-width="2"/>
  <rect x="370" y="120" width="14" height="480" fill="#dfe6ee" stroke="#33485f" stroke-width="2"/>

  <!-- product columns in the annular gap (between screw OD and tube bore) -->
  <rect x="230" y="120" width="154" height="480" fill="url(#solid)" opacity="0.55"/>

  <!-- clearance: screw OD (236/364) just inside the bore (230/370) -->
  <!-- ====== SCREW SHAFT with HOLLOW CORE ====== -->
  <!-- shaft OD 282/318, hollow core 292/308 -->
  <rect x="282" y="115" width="36" height="600" fill="#b7bfc9" stroke="#33485f" stroke-width="1.5"/>
  <rect x="292" y="110" width="16" height="610" fill="#ffffff" stroke="#33485f" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ====== SCREW FLIGHTS (auger) ======
       left band x 236..282, right band x 318..364, offset half a pitch -->
  <g stroke="#7a5a2a" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- left flights: outer edge sits half a pitch higher -->
    <path d="M282,170 L236,142"/>
    <path d="M282,226 L236,198"/>
    <path d="M282,282 L236,254"/>
    <path d="M282,338 L236,310"/>
    <path d="M282,394 L236,366"/>
    <path d="M282,450 L236,422"/>
    <path d="M282,506 L236,478"/>
    <path d="M282,562 L236,534"/>
    <!-- right flights: mirrored slant, offset by half pitch -->
    <path d="M318,198 L364,170"/>
    <path d="M318,254 L364,226"/>
    <path d="M318,310 L364,282"/>
    <path d="M318,366 L364,338"/>
    <path d="M318,422 L364,394"/>
    <path d="M318,478 L364,450"/>
    <path d="M318,534 L364,506"/>
    <path d="M318,590 L364,562"/>
  </g>

  <!-- upward conveying flow arrows -->
  <line x1="253" y1="585" x2="253" y2="150" stroke="#0a7d33" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <line x1="347" y1="585" x2="347" y2="150" stroke="#0a7d33" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>

  <!-- ============ BOTTOM CYLINDRICAL CONTAINER ============ -->
  <!-- wider cylinder, solid fill, tube enters its top -->
  <path d="M160,600 L160,740 Q160,760 180,760 L420,760 Q440,760 440,740 L440,600"
        fill="url(#solid)" stroke="#33485f" stroke-width="2"/>
  <!-- container side walls drawn over the fill top edges -->
  <line x1="160" y1="600" x2="216" y2="600" stroke="#33485f" stroke-width="2"/>
  <line x1="384" y1="600" x2="440" y2="600" stroke="#33485f" stroke-width="2"/>
  <!-- shaft + screw intake reaching down into the container -->
  <rect x="282" y="600" width="36" height="120" fill="#b7bfc9" stroke="#33485f" stroke-width="1.5"/>
  <rect x="292" y="600" width="16" height="120" fill="#ffffff" stroke="#33485f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g stroke="#7a5a2a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M282,640 L250,620"/>
    <path d="M282,690 L250,670"/>
    <path d="M318,620 L350,640"/>
    <path d="M318,670 L350,690"/>
  </g>

  <!-- ============ SINGLE ACTUATOR ============ -->
  <rect x="270" y="760" width="60" height="55" rx="6" fill="#444" stroke="#222" stroke-width="2"/>
  <circle cx="300" cy="788" r="14" fill="#888"/>
  <path d="M300,720 L300,760" stroke="#222" stroke-width="6"/>
  <text x="300" y="835" text-anchor="middle" font-size="12" font-weight="700" fill="#222">single actuator</text>
  <path d="M340,788 A40,40 0 0 1 300,748" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ LABELS / LEADERS ============ -->
  <g font-size="12" fill="#333">
    <!-- top outlet -->
    <line x1="200" y1="72" x2="430" y2="115" stroke="#444" stroke-width="1" marker-end="url(#lead)"/>
    <text x="430" y="112">top outlet (discharge)</text>

    <!-- tube -->
    <line x1="384" y1="200" x2="470" y2="190" stroke="#444" stroke-width="1" marker-end="url(#lead)"/>
    <text x="474" y="187">tube — bore slightly</text>
    <text x="474" y="202">larger than screw OD</text>

    <!-- clearance -->
    <line x1="233" y1="300" x2="120" y2="300" stroke="#444" stroke-width="1" marker-end="url(#lead)"/>
    <text x="20" y="297">clearance</text>
    <text x="20" y="312">(screw OD ↔ bore)</text>

    <!-- screw flight -->
    <line x1="260" y1="420" x2="120" y2="430" stroke="#444" stroke-width="1" marker-end="url(#lead)"/>
    <text x="20" y="427">screw / auger</text>
    <text x="20" y="442">flight</text>

    <!-- hollow core -->
    <line x1="300" y1="480" x2="470" y2="470" stroke="#444" stroke-width="1" marker-end="url(#lead)"/>
    <text x="474" y="467">hollow screw core</text>
    <text x="474" y="482">(central bore)</text>

    <!-- shaft -->
    <line x1="318" y1="540" x2="470" y2="545" stroke="#444" stroke-width="1" marker-end="url(#lead)"/>
    <text x="474" y="548">screw shaft</text>

    <!-- container -->
    <line x1="200" y1="700" x2="110" y2="700" stroke="#444" stroke-width="1" marker-end="url(#lead)"/>
    <text x="20" y="697">cylindrical</text>
    <text x="20" y="712">container (solid in)</text>
  </g>
</svg>
